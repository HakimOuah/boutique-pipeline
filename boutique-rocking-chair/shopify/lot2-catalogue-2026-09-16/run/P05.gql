  x44_p: productUpdate(product:{id:"gid://shopify/Product/16616099545433", title:"Plaid grosse maille tricoté à la main", handle:"plaid-grosse-maille-tricote-main", descriptionHtml:"<p><strong>De grosses mailles moelleuses à poser sur le fauteuil, pour des soirées bien au chaud.</strong></p>\n<ul>\n<li>Grosses mailles tricotées à la main, volume généreux</li>\n<li>Deux formats : 100 × 120 cm ou 100 × 150 cm</li>\n<li>Traitement anti-boulochage, lavable en machine</li>\n<li>5 coloris doux : gris perle, crème, gris bleuté, nude, rose poudré</li>\n</ul>\n<p>Ce plaid tricoté à la main en très grosses mailles habille votre rocking chair d'une touche douce et graphique. Posé sur le dossier ou sur vos genoux, il devient la pièce cocon du coin lecture.</p>\n<h3>Un coin lecture instantané</h3>\n<p>Dépliez-le sur vos jambes, un livre à la main, et le fauteuil devient votre coin calme du soir. Le reste du temps, il se replie sur l'accoudoir et décore la pièce.</p>\n<h3>Des mailles XXL douces au toucher</h3>\n<p>Chaque maille est tricotée à la main dans un fil épais et moelleux. Le relief des tresses donne du volume au plaid et une vraie présence déco sur un fauteuil ou un lit.</p>\n<h3>Deux formats pour votre fauteuil</h3>\n<p>Le 100 × 120 cm se pose sur un fauteuil à bascule ou sur les genoux. Le 100 × 150 cm couvre davantage, pour vous envelopper jusqu'aux épaules ou habiller le pied d'un lit.</p>\n<h3>5 coloris pour s'accorder au salon</h3>\n<p>Gris perle, crème, gris bleuté, nude ou rose poudré : des teintes calmes qui s'associent à la bouclette, au lin ou au bois clair.</p>\n<h3>Un plaid qui garde sa tenue</h3>\n<p>Le fil bénéficie d'un traitement anti-boulochage et le plaid passe en machine : il reste net au fil des soirées.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Format 1</td>\n<td>100 × 120 cm</td>\n</tr>\n<tr>\n<td>Format 2</td>\n<td>100 × 150 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : le 100 × 120 cm suffit pour un fauteuil à bascule ; choisissez le 100 × 150 cm pour vous couvrir entièrement ou pour un canapé.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Façon</td>\n<td>Grosse maille tricotée à la main</td>\n</tr>\n<tr>\n<td>Finition</td>\n<td>Anti-boulochage</td>\n</tr>\n<tr>\n<td>Formats</td>\n<td>100 × 120 cm, 100 × 150 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris perle, crème, gris bleuté, nude, rose poudré</td>\n</tr>\n<tr>\n<td>Entretien</td>\n<td>Lavable en machine</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le plaid se lave en machine. Entre deux lavages, secouez-le doucement et reformez les mailles à la main pour garder leur volume.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le plaid arrive plié, prêt à poser.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quelle taille choisir pour un rocking chair ?</strong><br>\nLe 100 × 120 cm se pose sur le dossier ou sur les genoux. Le 100 × 150 cm vous couvre davantage, jusqu'aux épaules.</p>\n<p><strong>2. Le plaid se lave-t-il en machine ?</strong><br>\nOui, il est lavable en machine. Reformez les mailles à la main après séchage.</p>\n<p><strong>3. Les mailles boulochent-elles ?</strong><br>\nLe fil a reçu un traitement anti-boulochage, pour un plaid qui reste net au fil des usages.</p>\n<p><strong>4. Est-il vraiment tricoté à la main ?</strong><br>\nOui, chaque plaid est tricoté à la main en très grosses mailles.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nGris perle, crème, gris bleuté, nude et rose poudré, dans les deux formats.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Plaid grosse maille tricoté main | Bercelou", description:"Plaid grosse maille tricoté à la main, en 100 × 120 ou 100 × 150 cm. 5 coloris doux, lavable en machine. Livraison offerte en France."}, productType:"Plaid", vendor:"Bercelou", tags:["plaid", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }
  x45_p: productUpdate(product:{id:"gid://shopify/Product/16616099807577", title:"Plaid polaire torsadé doublé sherpa", handle:"plaid-polaire-torsade-sherpa", descriptionHtml:"<p><strong>Le relief d'un gros tricot, la douceur d'une polaire : le plaid des longues soirées d'hiver.</strong></p>\n<ul>\n<li>Face polaire en relief torsadé</li>\n<li>Revers sherpa doux et chaud</li>\n<li>Anti-boulochage, lavable en machine</li>\n<li>120 × 200 ou 150 × 200 cm, 5 coloris</li>\n</ul>\n<p>Ce plaid réunit l'esprit d'un pull torsadé et le confort d'une polaire doublée sherpa. Sur le rocking chair ou le canapé, il invite à rester au chaud un peu plus longtemps.</p>\n<h3>Deux faces, deux douceurs</h3>\n<p>Côté face, une polaire au motif torsadé en relief. Côté revers, un sherpa blanc et moelleux qui garde la chaleur contre vous.</p>\n<h3>Pour les soirées d'hiver</h3>\n<p>Enroulez-vous dedans pour une tétée de nuit, une lecture ou un film : le plaid vous enveloppe sans peser.</p>\n<h3>Deux tailles utiles</h3>\n<p>Le 120 × 200 cm pour un fauteuil ou une personne, le 150 × 200 cm pour un canapé ou pour se blottir à deux.</p>\n<h3>Facile à vivre</h3>\n<p>Traité anti-boulochage, il passe en machine et garde son relief au fil des lavages.</p>\n<h3>5 coloris apaisants</h3>\n<p>Bleu glacier, gris anthracite, écru, sable ou vert sauge, pour s'accorder à votre intérieur.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Format 1</td>\n<td>120 × 200 cm</td>\n</tr>\n<tr>\n<td>Format 2</td>\n<td>150 × 200 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : le 120 × 200 cm se drape sur un fauteuil à bascule ; le 150 × 200 cm couvre un canapé deux places.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Face</td>\n<td>Polaire à relief torsadé</td>\n</tr>\n<tr>\n<td>Revers</td>\n<td>Sherpa</td>\n</tr>\n<tr>\n<td>Finition</td>\n<td>Anti-boulochage</td>\n</tr>\n<tr>\n<td>Formats</td>\n<td>120 × 200 cm, 150 × 200 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Bleu glacier, gris anthracite, écru, sable, vert sauge</td>\n</tr>\n<tr>\n<td>Entretien</td>\n<td>Lavable en machine</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le plaid se lave en machine. Faites-le sécher à plat ou suspendu pour garder le gonflant du sherpa.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le plaid arrive plié, prêt à utiliser.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le plaid est-il chaud ?</strong><br>\nOui : la polaire et son revers sherpa gardent bien la chaleur, idéal pour l'hiver.</p>\n<p><strong>2. Se lave-t-il en machine ?</strong><br>\nOui, il est lavable en machine et traité anti-boulochage.</p>\n<p><strong>3. Quelle taille choisir ?</strong><br>\nLe 120 × 200 cm pour un fauteuil ou une personne, le 150 × 200 cm pour un canapé ou deux personnes.</p>\n<p><strong>4. Les deux faces sont-elles identiques ?</strong><br>\nNon : la face est une polaire à relief torsadé, le revers un sherpa blanc et moelleux.</p>\n<p><strong>5. Quels coloris sont proposés ?</strong><br>\nBleu glacier, gris anthracite, écru, sable et vert sauge.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Plaid polaire torsadé doublé sherpa | Bercelou", description:"Plaid polaire à relief torsadé, doublé sherpa, anti-boulochage et lavable en machine. 120 × 200 ou 150 × 200 cm, 5 coloris doux."}, productType:"Plaid", vendor:"Bercelou", tags:["plaid", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }
  x46_p: productUpdate(product:{id:"gid://shopify/Product/16616056848729", title:"Pouf coffre rond en chenille beige, base effet bois", handle:"pouf-coffre-chenille-beige", descriptionHtml:"<p><strong>Un pouf beige tout en douceur, qui cache le désordre et accueille vos pieds le soir.</strong></p>\n<ul>\n<li>Chenille beige douce et moelleuse au toucher</li>\n<li>Rangement caché sous le couvercle</li>\n<li>Assise d'appoint à 45 cm, charge jusqu'à 120 kg</li>\n<li>Format compact de 38 cm, pour les petits espaces</li>\n</ul>\n<h3>Un beige qui s'accorde à tout</h3>\n<p>La chenille beige, douce et veloutée, se marie aux intérieurs clairs, scandinaves ou bohèmes, et aux fauteuils bouclette du catalogue.</p>\n<h3>Le rangement que l'on ne voit pas</h3>\n<p>Sous le couvercle, l'intérieur de 35 cm de diamètre sur 37 cm de profondeur garde télécommandes, plaids et livres.</p>\n<h3>Repose-pieds, siège ou bout de canapé</h3>\n<p>À 45 cm de haut, il sert de siège d'appoint, de tabouret pour enfiler ses chaussures ou de repose-pieds devant un fauteuil haut.</p>\n<h3>Une base stable et discrète</h3>\n<p>La base en métal effet bois lui donne une assise stable au quotidien, sur 38 cm seulement.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>38 × 38 × 45 cm</td>\n</tr>\n<tr>\n<td>Rangement (diamètre × profondeur)</td>\n<td>35 × 37 cm</td>\n</tr>\n<tr>\n<td>Poids</td>\n<td>4,9 kg</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>40 × 40 × 47 cm, 5,6 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : il tient dans un carré de 38 cm, parfait au bout d'un lit ou dans une entrée étroite.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Chenille 100 % polyester, rembourrage mousse</td>\n</tr>\n<tr>\n<td>Base</td>\n<td>Métal effet bois</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Beige</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Coffre sous couvercle</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la chenille à l'aspirateur, embout tissu. Une tache se traite localement à l'eau tiède, en tamponnant sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<h2>FAQ</h2>\n<p><strong>1. Que peut-on ranger dans le pouf ?</strong><br>\nL'intérieur de 35 cm de diamètre et 37 cm de profondeur accueille un plaid, des livres ou des télécommandes.</p>\n<p><strong>2. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 120 kg.</p>\n<p><strong>3. Quelle est sa hauteur ?</strong><br>\n45 cm, une hauteur d'assise classique.</p>\n<p><strong>4. Est-il lourd à déplacer ?</strong><br>\nIl pèse 4,9 kg : il se déplace d'une main.</p>\n<p><strong>5. Comment entretenir la chenille ?</strong><br>\nAspirateur au quotidien, nettoyage local des taches à l'eau tiède.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Pouf coffre rond en chenille beige | Bercelou", description:"Pouf de rangement rond en chenille beige, 38 × 45 cm, base métal effet bois, 120 kg. Assise, repose-pieds et coffre. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf", "repose-pieds"]}) { product { id handle } userErrors { field message } }
  x47_p: productUpdate(product:{id:"gid://shopify/Product/16616056521049", title:"Pouf coffre rond en bouclette blanche, pieds bois", handle:"pouf-coffre-rond-bouclette-blanc", descriptionHtml:"<p><strong>Un pouf moelleux qui cache plaids et livres, et accueille vos pieds au pied du fauteuil.</strong></p>\n<ul>\n<li>40,5 litres de rangement sous le couvercle rembourré</li>\n<li>Bouclette blanche douce, dessus capitonné en losanges</li>\n<li>Assise, repose-pieds ou petit coffre : trois usages</li>\n<li>Pieds en pin, charge recommandée jusqu'à 120 kg</li>\n</ul>\n<h3>Vos pieds posés, le coin fauteuil complet</h3>\n<p>Placé devant votre rocking chair ou votre canapé, ce pouf de 41 cm de haut accueille vos jambes pour les soirées au calme. Son dessus rembourré reste confortable sur la durée.</p>\n<h3>Un coffre caché pour les plaids</h3>\n<p>Soulevez le couvercle : 40,5 litres attendent plaids, livres ou jouets. Le coin reste rangé, sans meuble en plus.</p>\n<h3>Une bouclette douce et lumineuse</h3>\n<p>La bouclette blanche habille tout le pouf. Son dessus capitonné en losanges apporte du relief et s'accorde aux fauteuils teddy et bouclette.</p>\n<h3>Une assise d'appoint solide</h3>\n<p>Posé sur quatre pieds en pin, il supporte jusqu'à 120 kg. Un invité de plus, une paire de chaussures à enfiler : il sert tous les jours.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre</td>\n<td>45 cm</td>\n</tr>\n<tr>\n<td>Hauteur totale</td>\n<td>41 cm</td>\n</tr>\n<tr>\n<td>Rangement intérieur (diamètre × hauteur)</td>\n<td>43 × 28 cm</td>\n</tr>\n<tr>\n<td>Volume de rangement</td>\n<td>40,5 L</td>\n</tr>\n<tr>\n<td>Pieds</td>\n<td>4,5 × 4,5 × 5 cm</td>\n</tr>\n<tr>\n<td>Charge maximale recommandée</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>47 × 47 × 38 cm, 6 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez un cercle de 45 cm au sol, et un peu d'espace au-dessus pour ouvrir le couvercle.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Bouclette 100 % polyester, rembourrage mousse</td>\n</tr>\n<tr>\n<td>Pieds</td>\n<td>Pin</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Blanc</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Coffre sous couvercle rembourré</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Simple, à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la bouclette à l'aspirateur, embout tissu. Une tache se traite localement, à l'eau tiède et au savon doux, en tamponnant.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le pouf arrive avec un montage simple à réaliser.</p>\n<h2>FAQ</h2>\n<p><strong>1. Combien peut-on ranger dans le pouf ?</strong><br>\nLe coffre offre 40,5 litres, soit un espace de 43 cm de diamètre sur 28 cm de profondeur : assez pour deux plaids ou une pile de livres.</p>\n<p><strong>2. Peut-on s'asseoir dessus ?</strong><br>\nOui, le pouf supporte jusqu'à 120 kg et sert d'assise d'appoint.</p>\n<p><strong>3. Quelle hauteur pour poser les pieds ?</strong><br>\nIl mesure 41 cm de haut, une hauteur confortable devant un fauteuil ou un canapé.</p>\n<p><strong>4. La bouclette est-elle facile à entretenir ?</strong><br>\nUn passage d'aspirateur suffit au quotidien ; une tache se nettoie localement à l'eau tiède.</p>\n<p><strong>5. Faut-il le monter ?</strong><br>\nUn montage simple est à prévoir à réception.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Pouf coffre rond en bouclette blanche | Bercelou", description:"Pouf coffre rond en bouclette blanche, 40,5 L de rangement, pieds en pin, 120 kg. Assise, repose-pieds et coffre en un. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf", "repose-pieds"]}) { product { id handle } userErrors { field message } }
  x48_p: productUpdate(product:{id:"gid://shopify/Product/16616056652121", title:"Pouf coffre rond en velours côtelé, 32 L", handle:"pouf-coffre-rond-velours-cotele", descriptionHtml:"<p><strong>Le petit pouf qui range la télécommande et le plaid, et prolonge votre fauteuil d'un repose-pieds.</strong></p>\n<ul>\n<li>32 litres de rangement dissimulé sous l'assise</li>\n<li>Velours côtelé doux, en beige, gris clair ou bleu ciel</li>\n<li>Compact : 40 cm de diamètre pour 41 cm de haut</li>\n<li>Charge maximale de 120 kg</li>\n</ul>\n<h3>Un repose-pieds au bon format</h3>\n<p>Avec 41 cm de haut, il se glisse devant un fauteuil ou un rocking chair pour poser les jambes le soir.</p>\n<h3>Un rangement discret</h3>\n<p>Sous le couvercle, 32 litres accueillent plaid, magazines ou petits jouets. Tout reste à portée de main.</p>\n<h3>Le velours côtelé qui réchauffe la pièce</h3>\n<p>Ses côtes verticales captent la lumière. Beige sable, gris clair ou bleu ciel : trois teintes douces pour s'accorder au salon ou à la chambre.</p>\n<h3>Une assise d'appoint compacte</h3>\n<p>Son rembourrage en mousse et sa charge de 120 kg en font un siège de dépannage, une banquette d'entrée ou un tabouret de coiffeuse.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre</td>\n<td>40 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>41 cm</td>\n</tr>\n<tr>\n<td>Rangement (diamètre × hauteur)</td>\n<td>33 × 30 cm</td>\n</tr>\n<tr>\n<td>Volume de rangement</td>\n<td>32 L</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>41 × 17 × 41 cm, 4,7 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : un cercle de 40 cm suffit, idéal dans une petite chambre ou une entrée.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Velours côtelé 100 % polyester, rembourrage mousse</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Beige sable, gris clair, bleu ciel</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Coffre sous couvercle</td>\n</tr>\n<tr>\n<td>Usages</td>\n<td>Repose-pieds, assise d'appoint, banc d'entrée</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Brossez le velours côtelé dans le sens des côtes et dépoussiérez-le à l'aspirateur. Une tache se traite localement à l'eau tiède, en tamponnant.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quelle contenance a le coffre ?</strong><br>\n32 litres, sur 33 cm de diamètre et 30 cm de profondeur.</p>\n<p><strong>2. Peut-on s'asseoir dessus ?</strong><br>\nOui, il supporte jusqu'à 120 kg.</p>\n<p><strong>3. Quels coloris sont disponibles ?</strong><br>\nBeige sable, gris clair et bleu ciel, tous en velours côtelé.</p>\n<p><strong>4. Est-il adapté à une petite pièce ?</strong><br>\nOui : 40 cm de diamètre seulement, il se range facilement contre un mur ou au pied du lit.</p>\n<p><strong>5. Comment entretenir le velours côtelé ?</strong><br>\nUn brossage doux et un passage d'aspirateur ; une tache se nettoie localement.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Pouf coffre rond en velours côtelé 32 L | Bercelou", description:"Pouf coffre rond en velours côtelé : 32 L de rangement, 120 kg, 40 cm de diamètre. Beige, gris clair ou bleu ciel. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf", "repose-pieds"]}) { product { id handle } userErrors { field message } }
  x49_p: productUpdate(product:{id:"gid://shopify/Product/16616056750425", title:"Pouf coffre en sherpa crème, base effet bois", handle:"pouf-coffre-sherpa-creme", descriptionHtml:"<p><strong>Un pouf tout doux, prêt dès le déballage, qui range le plaid et accueille vos pieds.</strong></p>\n<ul>\n<li>Sherpa crème moelleux, assise rembourrée de 7 cm</li>\n<li>Rangement intérieur sous le couvercle</li>\n<li>Livré monté, prêt à l'emploi</li>\n<li>Charge jusqu'à 120 kg</li>\n</ul>\n<h3>Une douceur d'agneau au pied du fauteuil</h3>\n<p>Le sherpa crème apporte la même chaleur que les fauteuils teddy. Posé devant votre rocking chair, il complète le coin cocon.</p>\n<h3>Une vraie assise à 45 cm</h3>\n<p>Sa hauteur d'assise de 45 cm en fait un siège d'appoint confortable, ou un tabouret de coiffeuse dans la chambre.</p>\n<h3>Le plaid rangé à portée de main</h3>\n<p>Soulevez le couvercle : l'intérieur de 35 cm de diamètre et 37 cm de profondeur garde plaid, chaussons ou livres.</p>\n<h3>Prêt dès la livraison</h3>\n<p>Le pouf arrive monté. Vous le sortez du carton, il est prêt.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>38 × 38 × 45 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>45 cm</td>\n</tr>\n<tr>\n<td>Épaisseur d'assise</td>\n<td>7 cm</td>\n</tr>\n<tr>\n<td>Rangement (diamètre × profondeur)</td>\n<td>35 × 37 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>40 × 40 × 47 cm, 5,6 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : 38 cm au sol suffisent ; il se glisse au bout du lit ou à côté du fauteuil.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Sherpa 100 % polyester, rembourrage mousse</td>\n</tr>\n<tr>\n<td>Base</td>\n<td>Métal effet bois</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Crème</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Coffre sous couvercle</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Livré monté</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le sherpa à l'aspirateur, embout tissu, puis aérez les bouclettes d'une brosse douce. Une tache se traite localement à l'eau tiède.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le pouf arrive monté.</p>\n<h2>FAQ</h2>\n<p><strong>1. Faut-il monter le pouf ?</strong><br>\nNon, il est livré monté et prêt à l'emploi.</p>\n<p><strong>2. Quelle est la hauteur d'assise ?</strong><br>\n45 cm, une hauteur de chaise : on s'y assoit et on s'en relève facilement.</p>\n<p><strong>3. Que peut-on ranger dedans ?</strong><br>\nL'intérieur mesure 35 cm de diamètre sur 37 cm de profondeur : plaid, chaussons, livres.</p>\n<p><strong>4. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 120 kg.</p>\n<p><strong>5. Le sherpa bouloche-t-il ?</strong><br>\nUn brossage doux de temps en temps garde les bouclettes aérées.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Pouf coffre en sherpa crème, 45 cm | Bercelou", description:"Pouf coffre rond en sherpa crème, 45 cm de haut, 120 kg, livré monté. Assise, repose-pieds et rangement. Livraison offerte en France."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf", "repose-pieds"]}) { product { id handle } userErrors { field message } }
  x50_p: productUpdate(product:{id:"gid://shopify/Product/16616057405785", title:"Pouf d'extérieur en acacia massif, coussin anthracite", handle:"pouf-exterieur-acacia-coussin-anthracite", descriptionHtml:"<p><strong>Le repose-pieds de la terrasse, qui devient assise ou table basse selon le moment.</strong></p>\n<ul>\n<li>Cadre en acacia massif, teinte bois naturelle</li>\n<li>Assise en textilène qui résiste aux intempéries</li>\n<li>Coussin épais de 8 cm, gris anthracite</li>\n<li>Grand plateau carré de 79 × 79 cm</li>\n</ul>\n<h3>Les jambes posées sur la terrasse</h3>\n<p>Placé devant un rocking chair d'extérieur ou un fauteuil de jardin, il accueille vos jambes pour les fins de journée dehors.</p>\n<h3>Un bois chaleureux et solide</h3>\n<p>Le cadre en acacia massif, connu pour sa robustesse, apporte une teinte naturelle qui s'accorde au jardin.</p>\n<h3>Une assise faite pour dehors</h3>\n<p>Le textilène tendu sous le coussin résiste aux intempéries et à la décoloration, et le cadre sèche vite après la pluie.</p>\n<h3>Pouf, assise ou table basse</h3>\n<p>Avec son coussin, c'est un pouf ou une assise d'appoint ; sans coussin, le plateau tendu reçoit un plateau et des verres.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Plateau</td>\n<td>79 × 79 cm</td>\n</tr>\n<tr>\n<td>Hauteur du cadre</td>\n<td>37 cm</td>\n</tr>\n<tr>\n<td>Coussin</td>\n<td>80 × 80 × 8 cm</td>\n</tr>\n<tr>\n<td>Hauteur totale avec coussin</td>\n<td>45 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>92 × 25 × 18 cm, 8,2 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez un carré de 80 cm devant votre fauteuil, avec un passage libre autour.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Cadre</td>\n<td>Acacia massif</td>\n</tr>\n<tr>\n<td>Assise</td>\n<td>Textilène résistant aux intempéries</td>\n</tr>\n<tr>\n<td>Coussin</td>\n<td>Polyester, anthracite</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Extérieur (terrasse, balcon, jardin)</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Essuyez le cadre à l'eau claire. Rentrez ou couvrez le coussin par temps de pluie et laissez sécher le bois à l'air. Une housse de protection prolonge la vie du salon en hiver.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le pouf est à assembler à réception.</p>\n<h2>FAQ</h2>\n<p><strong>1. Peut-il rester dehors ?</strong><br>\nLe cadre en acacia et l'assise en textilène sont faits pour l'extérieur. Rentrez le coussin par temps de pluie.</p>\n<p><strong>2. Quelle est sa hauteur ?</strong><br>\n37 cm pour le cadre, 45 cm avec le coussin.</p>\n<p><strong>3. Peut-on s'en servir comme table basse ?</strong><br>\nOui, sans coussin, le plateau tendu reçoit un plateau et des verres.</p>\n<p><strong>4. Faut-il le monter ?</strong><br>\nOui, un assemblage est à prévoir à réception.</p>\n<p><strong>5. Le coussin est-il fourni ?</strong><br>\nOui, un coussin anthracite de 80 × 80 × 8 cm.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Pouf d'extérieur en acacia massif et textilène | Bercelou", description:"Pouf d'extérieur carré 79 × 79 cm en acacia massif, assise textilène et coussin anthracite. Repose-pieds ou table basse de terrasse."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf-exterieur", "pouf"]}) { product { id handle } userErrors { field message } }
  x51_p: productUpdate(product:{id:"gid://shopify/Product/16616057143641", title:"Pouf géant rond en velours côtelé à larges côtes", handle:"pouf-geant-rond-velours-cotele", descriptionHtml:"<p><strong>Un grand nid de velours où l'on s'enfonce pour lire, jouer ou se poser le soir.</strong></p>\n<ul>\n<li>Format XXL : jusqu'à 122 cm de diamètre</li>\n<li>Mousse haute résilience qui soutient le dos et les jambes</li>\n<li>Velours côtelé à larges côtes, doux au toucher</li>\n<li>Dessous antidérapant, 4 coloris</li>\n</ul>\n<h3>Un coin lecture où l'on se love</h3>\n<p>Son grand diamètre accueille un adulte en tailleur ou un parent avec un enfant. On s'y installe avec un livre ou une tasse.</p>\n<h3>Un soutien qui tient</h3>\n<p>La mousse haute résilience soutient le dos, les hanches et les jambes, et reprend sa forme quand vous vous levez.</p>\n<h3>Les larges côtes du velours</h3>\n<p>Le velours côtelé à larges côtes donne du relief et une douceur qui invite à s'y poser.</p>\n<h3>Stable au sol</h3>\n<p>Le dessous antidérapant le garde en place, même quand on s'y laisse tomber.</p>\n<h3>Quatre teintes</h3>\n<p>Noir, gris perle, vert sapin ou blanc crème.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre</td>\n<td>109 à 122 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>58 à 66 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>48 × 38 × 21 cm, 10,4 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez un cercle de 125 cm au sol. Les cotes varient légèrement selon le volume repris par la mousse.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Velours côtelé à larges côtes</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute résilience</td>\n</tr>\n<tr>\n<td>Dessous</td>\n<td>Antidérapant</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Noir, gris perle, vert sapin, blanc crème</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le velours à l'aspirateur, embout tissu, en suivant le sens des côtes. Une tache se traite localement à l'eau tiède, en tamponnant.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le pouf arrive compressé : ouvrez l'emballage, tapotez-le, puis laissez-lui environ 72 heures pour retrouver tout son volume.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quelle taille fait-il une fois déballé ?</strong><br>\nDe 109 à 122 cm de diamètre et de 58 à 66 cm de haut.</p>\n<p><strong>2. Combien de temps pour qu'il prenne sa forme ?</strong><br>\nEnviron 72 heures après ouverture. Tapotez-le pour l'aider.</p>\n<p><strong>3. Est-il confortable pour lire ?</strong><br>\nSa mousse haute résilience soutient le dos et les jambes, assis en tailleur ou à demi allongé.</p>\n<p><strong>4. Glisse-t-il au sol ?</strong><br>\nNon, son dessous est antidérapant.</p>\n<p><strong>5. Quels coloris sont proposés ?</strong><br>\nNoir, gris perle, vert sapin et blanc crème.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Pouf géant rond en velours côtelé XXL | Bercelou", description:"Pouf géant rond en velours côtelé à larges côtes, jusqu'à 122 cm de diamètre, mousse haute résilience, dessous antidérapant. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf-poire", "pouf"]}) { product { id handle } userErrors { field message } }
  x52_p: productUpdate(product:{id:"gid://shopify/Product/16616056947033", title:"Pouf rond en jute tressé main, rayures naturelles", handle:"pouf-jute-tresse-raye-naturel", descriptionHtml:"<p><strong>La matière naturelle du rotin, en version souple, pour poser les pieds devant votre fauteuil.</strong></p>\n<ul>\n<li>Corde de jute tressée à la main</li>\n<li>Garni de billes de mousse, souple sous les pieds</li>\n<li>45 cm de diamètre, 30 cm de haut</li>\n<li>Beige naturel ou kaki</li>\n</ul>\n<h3>Une matière naturelle, travaillée à la main</h3>\n<p>La corde de jute tressée à la main s'enroule en spirale et dessine des rayures naturelles. Chaque pouf a son relief.</p>\n<h3>Assorti aux fauteuils en rotin</h3>\n<p>Il complète un rocking chair en rotin ou en bois avec la même chaleur de fibre naturelle.</p>\n<h3>Un repose-pieds souple</h3>\n<p>Garni de billes de mousse, il accueille les jambes en douceur. À 30 cm de haut, il se place devant un fauteuil ou un canapé.</p>\n<h3>Un siège au ras du sol</h3>\n<p>Pour un enfant qui lit à vos pieds ou un invité de plus, il devient une assise d'appoint.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre</td>\n<td>45 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>30 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : un cercle de 45 cm au sol, devant le fauteuil ou à côté du canapé.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Jute tressé</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Billes de mousse EPS</td>\n</tr>\n<tr>\n<td>Fabrication</td>\n<td>Fait main</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Beige naturel, kaki</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la jute à l'aspirateur, embout brosse. Évitez l'humidité : une tache se tamponne avec un chiffon à peine humide, puis laissez sécher à l'air.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le pouf arrive prêt à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le pouf est-il fait main ?</strong><br>\nOui, il est réalisé en corde de jute tressée à la main.</p>\n<p><strong>2. La jute gratte-t-elle ?</strong><br>\nLa jute a le toucher d'une fibre naturelle. Posez un plaid dessus si vous préférez une surface plus douce pour les pieds nus.</p>\n<p><strong>3. Quelles sont ses dimensions ?</strong><br>\n45 cm de diamètre et 30 cm de haut.</p>\n<p><strong>4. Est-il souple ?</strong><br>\nOui, son garnissage en billes de mousse le rend souple.</p>\n<p><strong>5. Peut-il aller dehors ?</strong><br>\nGardez-le à l'intérieur : la jute craint l'humidité.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Pouf rond en jute tressé main, 45 cm | Bercelou", description:"Pouf rond en jute tressé à la main, 45 × 30 cm, garni de billes de mousse. Beige naturel ou kaki, esprit naturel. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf", "repose-pieds"]}) { product { id handle } userErrors { field message } }
  x53_p: productUpdate(product:{id:"gid://shopify/Product/16616056881497", title:"Pouf rond en macramé de coton tressé main", handle:"pouf-macrame-coton-ecru", descriptionHtml:"<p><strong>Une touche bohème au pied du rocking chair : on y pose les pieds, un livre ou un plateau.</strong></p>\n<ul>\n<li>Macramé de coton tressé à la main</li>\n<li>Garni de billes de mousse, souple et confortable</li>\n<li>45 cm de diamètre, 30 cm de haut</li>\n<li>Beige naturel ou ivoire</li>\n</ul>\n<h3>Un motif fait main</h3>\n<p>Chaque pouf est réalisé en corde de coton tressée à la main. Losanges et franges de macramé dessinent un relief qui habille tout le tour.</p>\n<h3>Le compagnon du fauteuil en rotin</h3>\n<p>Beige naturel ou ivoire, il prolonge l'esprit bohème d'un rocking chair en rotin ou d'un fauteuil cocon.</p>\n<h3>Souple sous les pieds</h3>\n<p>Son garnissage en billes de mousse épouse la forme de vos jambes. À 30 cm de haut, il se place devant un fauteuil bas ou un canapé.</p>\n<h3>Assise, repose-pieds ou déco</h3>\n<p>Posez-y les pieds, asseyez-vous un instant au ras du sol, ou laissez-le simplement réchauffer un coin de la pièce.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre</td>\n<td>45 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>30 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez un cercle de 45 cm devant votre fauteuil ou votre canapé.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Coton tressé en macramé</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Billes de mousse EPS</td>\n</tr>\n<tr>\n<td>Fabrication</td>\n<td>Fait main</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Beige naturel, ivoire</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le macramé à l'aspirateur, embout brosse, et redonnez sa forme au pouf en le tapotant. Une tache se traite localement, à l'eau tiède et au savon doux.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le pouf arrive prêt à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le pouf est-il vraiment fait main ?</strong><br>\nOui, il est réalisé en corde de coton tressée à la main.</p>\n<p><strong>2. Est-il ferme ou souple ?</strong><br>\nSouple : il est garni de billes de mousse qui épousent la forme des jambes.</p>\n<p><strong>3. Quelle hauteur fait-il ?</strong><br>\n30 cm, pour 45 cm de diamètre.</p>\n<p><strong>4. Quelle différence entre beige et ivoire ?</strong><br>\nLe beige naturel est légèrement plus chaud ; l'ivoire est plus clair. Les deux restent des tons doux.</p>\n<p><strong>5. Peut-on s'asseoir dessus ?</strong><br>\nOui, pour une assise d'appoint au ras du sol.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Pouf rond en macramé de coton tressé main | Bercelou", description:"Pouf rond en macramé de coton tressé à la main, 45 × 30 cm, garni de billes de mousse. Beige ou ivoire, style bohème. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf", "repose-pieds"]}) { product { id handle } userErrors { field message } }
}
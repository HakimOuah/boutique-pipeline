mutation {
  x34_p: productUpdate(product:{id:"gid://shopify/Product/16616092205401", title:"Galette de sol ronde en paille tressée, Ø 40 cm", handle:"galette-de-sol-en-paille-tressee", descriptionHtml:"<p><strong>Une assise basse en paille naturelle, tressée à la main, pour un coin salon tout en douceur.</strong></p>\n<ul>\n<li>Paille naturelle tressée à la main</li>\n<li>Cœur en mousse pour une assise souple</li>\n<li>Ø 40 cm, 6 cm d'épaisseur</li>\n<li>Complétez votre coin cocon</li>\n</ul>\n<p>Cette galette ronde en paille tressée à la main apporte une assise basse et naturelle à votre salon, près d'une table basse ou au pied du rocking chair.</p>\n<h3>Une matière naturelle</h3>\n<p>La paille tressée à la main dessine une spirale régulière, chaleureuse, qui s'accorde au rotin, au bois clair et au lin.</p>\n<h3>Une assise souple</h3>\n<p>Sous la paille, un cœur en mousse amortit l'assise : on s'y installe pour un thé, une histoire ou un jeu au sol.</p>\n<h3>Un format compact</h3>\n<p>Avec 40 cm de diamètre et 6 cm d'épaisseur, elle se range facilement et se déplace d'une pièce à l'autre.</p>\n<h3>Au pied du fauteuil</h3>\n<p>Posée près du rocking chair, elle devient l'assise des enfants pendant l'histoire du soir, ou un repose-pieds bas.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre</td>\n<td>40 cm</td>\n</tr>\n<tr>\n<td>Épaisseur</td>\n<td>6 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez un sol sec : la galette s'installe à l'intérieur, sur parquet, tapis ou carrelage.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Paille naturelle tressée à la main</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse</td>\n</tr>\n<tr>\n<td>Forme</td>\n<td>Ronde</td>\n</tr>\n<tr>\n<td>Housse</td>\n<td>Non déhoussable</td>\n</tr>\n<tr>\n<td>Dimensions</td>\n<td>Ø 40 × 6 cm</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Nettoyez la galette avec un chiffon sec et gardez-la au sec. Si elle est mouillée, essuyez-la avec un chiffon sec et laissez-la sécher naturellement dans un endroit aéré ou tempéré.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. La galette arrive prête à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. En quelle matière est la galette ?</strong><br>\nEn paille naturelle tressée à la main, avec un cœur en mousse.</p>\n<p><strong>2. Quelles sont ses dimensions ?</strong><br>\n40 cm de diamètre pour 6 cm d'épaisseur.</p>\n<p><strong>3. Comment l'entretenir ?</strong><br>\nAvec un chiffon sec. Si elle est mouillée, essuyez-la et laissez-la sécher dans un endroit aéré.</p>\n<p><strong>4. Peut-on l'utiliser dehors ?</strong><br>\nElle doit rester au sec : réservez-la à l'intérieur ou à une véranda abritée.</p>\n<p><strong>5. La housse s'enlève-t-elle ?</strong><br>\nNon, la paille et la mousse forment un seul bloc.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Galette de sol ronde en paille tressée | Bercelou", description:"Galette de sol ronde en paille naturelle tressée à la main, Ø 40 × 6 cm, cœur en mousse. Style japonais, pour salon ou coin lecture."}, productType:"Coussin de sol", vendor:"Bercelou", tags:["coussin-de-sol"]}) { product { id handle } userErrors { field message } }
  x35_p: productUpdate(product:{id:"gid://shopify/Product/16616099938649", title:"Grand coussin de sol rond en velours côtelé, Ø 55 cm", handle:"grand-coussin-de-sol-rond-velours-cotele", descriptionHtml:"<p><strong>Un grand coussin capitonné et rebondi, pour se poser au sol comme dans un fauteuil.</strong></p>\n<ul>\n<li>Grand diamètre de 55 cm</li>\n<li>Velours côtelé doux et chaleureux</li>\n<li>Capitonnage en 9 points qui garde la forme</li>\n<li>Gris taupe, cognac, vert olive ou bleu nuit</li>\n</ul>\n<p>Ce grand coussin rond en velours côtelé offre une vraie assise au sol. Rebondi et capitonné, il complète le coin lecture autour du rocking chair.</p>\n<h3>Une vraie assise au sol</h3>\n<p>Avec 55 cm de diamètre et un garnissage généreux, il accueille un adulte en tailleur ou un enfant qui s'y love.</p>\n<h3>Il garde sa forme</h3>\n<p>Neuf points de capitonnage maintiennent le garnissage en place et évitent que le coussin se déforme.</p>\n<h3>Le velours côtelé, doux et chaleureux</h3>\n<p>Les côtes du velours donnent une texture riche et douce, en gris taupe, cognac, vert olive ou bleu nuit.</p>\n<h3>Autour du rocking chair</h3>\n<p>Posé près du fauteuil, il devient la place des enfants pendant l'histoire du soir, ou un appui pour les jeux au sol.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre</td>\n<td>55 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez environ 60 cm au sol pour le coussin et son gonflant.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Housse</td>\n<td>Velours côtelé (100 % polyester)</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Fibres de coton perlé EPE</td>\n</tr>\n<tr>\n<td>Capitonnage</td>\n<td>9 points</td>\n</tr>\n<tr>\n<td>Housse amovible</td>\n<td>Non</td>\n</tr>\n<tr>\n<td>Diamètre</td>\n<td>55 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris taupe, cognac, vert olive, bleu nuit</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le velours à l'aspirateur, embout tissu, en suivant le sens des côtes. Traitez une tache localement, à l'eau tiède, en tamponnant.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le coussin arrive prêt à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quel est le diamètre du coussin ?</strong><br>\n55 cm.</p>\n<p><strong>2. Garde-t-il sa forme ?</strong><br>\nOui, ses 9 points de capitonnage maintiennent le garnissage et limitent la déformation.</p>\n<p><strong>3. La housse s'enlève-t-elle ?</strong><br>\nNon : dépoussiérez-le à l'aspirateur et nettoyez les taches localement.</p>\n<p><strong>4. Convient-il à un adulte ?</strong><br>\nOui, son grand diamètre offre une assise confortable à un adulte assis au sol.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nGris taupe, cognac, vert olive et bleu nuit.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Grand coussin de sol rond velours côtelé | Bercelou", description:"Grand coussin de sol rond Ø 55 cm en velours côtelé, capitonné en 9 points pour garder sa forme. Gris taupe, cognac, vert olive, bleu nuit."}, productType:"Coussin de sol", vendor:"Bercelou", tags:["coussin-de-sol", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }
  x36_p: productUpdate(product:{id:"gid://shopify/Product/16616099709273", title:"Jeté de canapé jacquard à glands, carreaux ou bambou", handle:"jete-de-canape-a-glands", descriptionHtml:"<p><strong>Un jeté moelleux qui habille le fauteuil ou le canapé et le protège au quotidien.</strong></p>\n<ul>\n<li>Tissage jacquard moelleux, finition à glands</li>\n<li>Carreaux beige ou crème à motif bambou</li>\n<li>130 × 180 cm pour un fauteuil, 180 × 230 cm pour un canapé</li>\n<li>Lavable en machine</li>\n</ul>\n<p>Ce jeté en jacquard doux et chaud se pose sur un fauteuil, un canapé ou un lit. Sa bordure à glands et ses motifs discrets réchauffent le salon.</p>\n<h3>Un fauteuil habillé en un geste</h3>\n<p>Posez le jeté sur l'assise et le dossier : le fauteuil change d'allure et reste protégé des frottements du quotidien.</p>\n<h3>Deux motifs doux</h3>\n<p>Les carreaux beige apportent une note classique et chaleureuse. Le crème à motif bambou joue la carte naturelle et apaisante.</p>\n<h3>Le bon format</h3>\n<p>Le 130 × 180 cm couvre un fauteuil ou se pose sur les genoux. Le 180 × 230 cm habille un canapé deux ou trois places.</p>\n<h3>Facile à entretenir</h3>\n<p>Le jeté passe en machine : il se lave aussi simplement qu'un plaid.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Format 1</td>\n<td>130 × 180 cm</td>\n</tr>\n<tr>\n<td>Format 2</td>\n<td>180 × 230 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : le 130 × 180 cm couvre l'assise et le dossier d'un fauteuil ; le 180 × 230 cm habille un canapé deux à trois places.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Polyester</td>\n</tr>\n<tr>\n<td>Tissage</td>\n<td>Jacquard</td>\n</tr>\n<tr>\n<td>Finition</td>\n<td>Glands</td>\n</tr>\n<tr>\n<td>Formats</td>\n<td>130 × 180 cm, 180 × 230 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Carreaux beige, crème motif bambou</td>\n</tr>\n<tr>\n<td>Contenu</td>\n<td>1 jeté</td>\n</tr>\n<tr>\n<td>Entretien</td>\n<td>Lavable en machine</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le jeté se lave en machine. Démêlez les glands à la main après séchage pour une bordure nette.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le jeté arrive plié, prêt à poser.</p>\n<h2>FAQ</h2>\n<p><strong>1. Peut-on l'utiliser comme plaid ?</strong><br>\nOui, il est doux et chaud : il se pose sur un fauteuil comme sur les genoux.</p>\n<p><strong>2. Quelle taille pour un canapé ?</strong><br>\nLe 180 × 230 cm habille un canapé deux ou trois places.</p>\n<p><strong>3. Quelle taille pour un fauteuil ?</strong><br>\nLe 130 × 180 cm couvre l'assise et le dossier d'un fauteuil.</p>\n<p><strong>4. Se lave-t-il en machine ?</strong><br>\nOui, il est lavable en machine.</p>\n<p><strong>5. En quelle matière est-il ?</strong><br>\nEn polyester, tissé en jacquard, avec une bordure à glands.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Jeté de canapé jacquard à glands | Bercelou", description:"Jeté de canapé jacquard à glands, lavable en machine. Carreaux beige ou crème motif bambou, en 130 × 180 ou 180 × 230 cm. Livraison offerte."}, productType:"Plaid", vendor:"Bercelou", tags:["plaid"]}) { product { id handle } userErrors { field message } }
  x37_p: productUpdate(product:{id:"gid://shopify/Product/16616099873113", title:"Jeté de canapé crème à lignes abstraites et franges", handle:"jete-de-canape-lignes-abstraites", descriptionHtml:"<p><strong>Un fond crème, une ligne souple : le jeté qui donne un air de galerie au salon.</strong></p>\n<ul>\n<li>Fond crème et lignes abstraites tissées</li>\n<li>Toucher brossé, bordure à franges</li>\n<li>130 × 180 cm ou 180 × 230 cm</li>\n<li>Lignes anthracite, taupe, terracotta ou grises</li>\n</ul>\n<p>Ce jeté au fond crème traversé de lignes souples habille un fauteuil, un canapé ou le pied du lit. Sa bordure à franges lui donne une allure bohème et douce.</p>\n<h3>Un fauteuil relooké en un instant</h3>\n<p>Posé sur l'assise et le dossier, le jeté change l'allure du fauteuil et le protège des frottements du quotidien.</p>\n<h3>Des lignes qui dessinent le salon</h3>\n<p>Un motif abstrait tissé, en anthracite, taupe, terracotta ou gris, pour une touche graphique sans surcharger la pièce.</p>\n<h3>Une matière douce</h3>\n<p>Le tissage à fils épais et la finition brossée offrent un toucher doux, agréable sur les genoux comme sur l'assise.</p>\n<h3>Le bon format</h3>\n<p>Le 130 × 180 cm pour un fauteuil, le 180 × 230 cm pour un canapé deux ou trois places.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Format 1</td>\n<td>130 × 180 cm</td>\n</tr>\n<tr>\n<td>Format 2</td>\n<td>180 × 230 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : le 130 × 180 cm couvre un fauteuil ; le 180 × 230 cm habille un canapé. Prévoyez un rétrécissement possible de 2 à 3 % au lavage.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tissage</td>\n<td>Fils épais, finition brossée</td>\n</tr>\n<tr>\n<td>Finition</td>\n<td>Franges</td>\n</tr>\n<tr>\n<td>Formats</td>\n<td>130 × 180 cm, 180 × 230 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Crème, lignes anthracite, taupe, terracotta ou grises</td>\n</tr>\n<tr>\n<td>Entretien</td>\n<td>Lavage délicat à moins de 30 °C</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Lavez le jeté à moins de 30 °C, en cycle doux ou à la main, sans trempage prolongé ni javel. Lavez séparément couleurs claires et foncées, puis faites sécher à l'air, dans un endroit ventilé. Le tissu peut rétrécir de 2 à 3 %. Quelques fibres peuvent se détacher lors des premiers lavages : c'est normal pour ce tissage.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le jeté arrive plié, prêt à poser.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment laver ce jeté ?</strong><br>\nÀ moins de 30 °C, en cycle doux ou à la main, sans javel, puis séchage à l'air.</p>\n<p><strong>2. Peluche-t-il au début ?</strong><br>\nQuelques fibres peuvent se détacher lors des premiers lavages, c'est normal pour ce tissage et cela s'estompe.</p>\n<p><strong>3. Quelle taille pour un fauteuil ?</strong><br>\nLe 130 × 180 cm couvre l'assise et le dossier d'un fauteuil.</p>\n<p><strong>4. Quelle taille pour un canapé ?</strong><br>\nLe 180 × 230 cm habille un canapé deux ou trois places.</p>\n<p><strong>5. Quelles couleurs de lignes existent ?</strong><br>\nAnthracite, taupe, terracotta ou gris, toujours sur fond crème.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Jeté de canapé crème à lignes et franges | Bercelou", description:"Jeté de canapé crème à lignes abstraites et franges, fil brossé doux. 130 × 180 ou 180 × 230 cm, 4 coloris de lignes. Livraison offerte."}, productType:"Plaid", vendor:"Bercelou", tags:["plaid"]}) { product { id handle } userErrors { field message } }
  x38_p: productUpdate(product:{id:"gid://shopify/Product/16616099905881", title:"Jeté de canapé jacquard à motif arches et franges", handle:"jete-de-canape-motif-arches", descriptionHtml:"<p><strong>Des arches douces et une bande de couleur pour habiller le canapé et le protéger.</strong></p>\n<ul>\n<li>Jacquard crème à motif arches, bande colorée</li>\n<li>Bordure à franges</li>\n<li>130 × 180 cm ou 180 × 230 cm</li>\n<li>Lavable en machine, 5 coloris</li>\n</ul>\n<p>Ce jeté en jacquard dessine des arches ton sur ton sur un fond crème, rehaussées d'une bande colorée. Il se pose sur un fauteuil ou un canapé et le protège de l'usure quotidienne.</p>\n<h3>Protéger sans cacher</h3>\n<p>Le jeté couvre l'assise et le dossier : votre fauteuil ou votre canapé est préservé des frottements, des petites taches et des passages du quotidien.</p>\n<h3>Un motif doux et moderne</h3>\n<p>Les arches tissées en jacquard et la bande de couleur apportent une touche graphique qui reste calme.</p>\n<h3>Facile à poser</h3>\n<p>Il suffit de le draper et de rentrer les bords dans l'assise : aucune housse ajustée à enfiler.</p>\n<h3>Le bon format</h3>\n<p>Le 130 × 180 cm pour un fauteuil, le 180 × 230 cm pour un canapé deux ou trois places.</p>\n<h3>5 coloris</h3>\n<p>Caramel, brun café, gris, vert sauge ou terracotta, toujours associés au crème.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Format 1</td>\n<td>130 × 180 cm</td>\n</tr>\n<tr>\n<td>Format 2</td>\n<td>180 × 230 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : le 130 × 180 cm couvre un fauteuil ; le 180 × 230 cm habille un canapé.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>100 % polyester</td>\n</tr>\n<tr>\n<td>Tissage</td>\n<td>Jacquard</td>\n</tr>\n<tr>\n<td>Finition</td>\n<td>Franges</td>\n</tr>\n<tr>\n<td>Formats</td>\n<td>130 × 180 cm, 180 × 230 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Caramel, brun café, gris, vert sauge, terracotta</td>\n</tr>\n<tr>\n<td>Entretien</td>\n<td>Lavable en machine</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le jeté se lave en machine. Démêlez les franges à la main après séchage.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le jeté arrive plié, prêt à poser.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment l'installer sur un canapé ?</strong><br>\nDrapez-le sur l'assise et le dossier, puis rentrez les bords entre l'assise et le dossier.</p>\n<p><strong>2. Protège-t-il le canapé ?</strong><br>\nOui, il couvre l'assise et le dossier et les préserve des frottements et des petites taches.</p>\n<p><strong>3. Se lave-t-il en machine ?</strong><br>\nOui, il est lavable en machine.</p>\n<p><strong>4. Quelle taille choisir ?</strong><br>\nLe 130 × 180 cm pour un fauteuil, le 180 × 230 cm pour un canapé deux ou trois places.</p>\n<p><strong>5. Quels coloris sont proposés ?</strong><br>\nCaramel, brun café, gris, vert sauge et terracotta, sur fond crème.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Jeté de canapé jacquard motif arches | Bercelou", description:"Jeté de canapé jacquard à motif arches et franges, lavable en machine. 130 × 180 ou 180 × 230 cm, 5 coloris doux. Livraison offerte."}, productType:"Plaid", vendor:"Bercelou", tags:["plaid"]}) { product { id handle } userErrors { field message } }
  x39_p: productUpdate(product:{id:"gid://shopify/Product/16616056684889", title:"Lot de 2 poufs coffres gigognes en velours blanc", handle:"lot-2-poufs-coffres-gigognes-velours-blanc", descriptionHtml:"<p><strong>Deux poufs ronds qui s'emboîtent : un repose-pieds au pied du fauteuil, un coffre de plus quand il faut.</strong></p>\n<ul>\n<li>Lot de 2 poufs : un grand (Ø41 cm) et un petit (Ø32 cm)</li>\n<li>Chacun cache un rangement sous son couvercle</li>\n<li>Le petit se range dans le grand pour gagner de la place</li>\n<li>Velours nuage blanc, charge jusqu'à 150 kg</li>\n</ul>\n<h3>Deux poufs pour le prix d'un lot</h3>\n<p>Vous recevez deux poufs coffres : un grand de 41 cm de diamètre et un petit de 32 cm. Utilisez-les séparément ou côte à côte.</p>\n<h3>Des repose-pieds à la bonne hauteur</h3>\n<p>Hauts de 24,5 et 20,5 cm, ils accueillent vos pieds devant un fauteuil ou un rocking chair, sans vous faire lever les genoux.</p>\n<h3>Du rangement en plus, sans encombrer</h3>\n<p>Chaque couvercle s'ouvre sur un espace pour chaussons, plaid ou petits jouets. Quand vous n'en avez pas besoin, le petit pouf se glisse dans le grand.</p>\n<h3>Un velours blanc tout en rondeur</h3>\n<p>Le velours nuage blanc et les formes arrondies adoucissent le salon, la chambre ou l'entrée.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Grand pouf (diamètre × hauteur)</td>\n<td>41 × 24,5 cm</td>\n</tr>\n<tr>\n<td>Petit pouf (diamètre × hauteur)</td>\n<td>32 × 20,5 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>43 × 42 × 29 cm, 5,7 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : une fois emboîtés, les deux poufs n'occupent qu'un cercle de 41 cm.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Contenu</td>\n<td>2 poufs coffres (grand et petit), 1 notice</td>\n</tr>\n<tr>\n<td>Matière</td>\n<td>Velours nuage, mousse, structure en MDF</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Blanc</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Sous couvercle, dans chaque pouf</td>\n</tr>\n<tr>\n<td>Rangement gain de place</td>\n<td>Le petit pouf s'emboîte dans le grand</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le velours à l'aspirateur, embout tissu. Une tache se traite localement, à l'eau tiède, en tamponnant sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Les deux poufs arrivent dans le même colis, avec leur notice.</p>\n<h2>FAQ</h2>\n<p><strong>1. Combien de poufs contient le lot ?</strong><br>\nDeux : un grand de 41 cm de diamètre et un petit de 32 cm.</p>\n<p><strong>2. Peut-on s'asseoir dessus ?</strong><br>\nOui, chaque pouf supporte jusqu'à 150 kg. Leur faible hauteur les destine surtout à poser les pieds ou à enfiler ses chaussures.</p>\n<p><strong>3. Comment les ranger quand on ne s'en sert pas ?</strong><br>\nLe petit pouf se range dans le grand.</p>\n<p><strong>4. Quelle hauteur font-ils ?</strong><br>\n24,5 cm pour le grand, 20,5 cm pour le petit.</p>\n<p><strong>5. Le blanc est-il salissant ?</strong><br>\nUn passage d'aspirateur régulier et un nettoyage local des taches suffisent à le garder net.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je retourner le lot ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Lot de 2 poufs coffres gigognes velours blanc | Bercelou", description:"Lot de 2 poufs coffres ronds en velours blanc, emboîtables : Ø41 et Ø32 cm, charge 150 kg. Repose-pieds et rangement. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf", "repose-pieds"]}) { product { id handle } userErrors { field message } }
  x40_p: productUpdate(product:{id:"gid://shopify/Product/16616092238169", title:"Petit pouf carré en coton gaufré, 30 × 30 cm", handle:"petit-pouf-carre-coton-gaufre", descriptionHtml:"<p><strong>Un petit pouf souple en coton gaufré, pour poser les pieds devant le fauteuil.</strong></p>\n<ul>\n<li>Housse 100 % coton gaufré</li>\n<li>Garni de billes, livré prêt à l'emploi</li>\n<li>Format compact 30 × 30 × 20 cm</li>\n<li>Écru, blanc, caramel ou gris perle</li>\n</ul>\n<p>Ce petit pouf carré en coton gaufré se glisse devant le rocking chair pour surélever les pieds, ou sert d'assise d'appoint pour les enfants.</p>\n<h3>Vos pieds surélevés pendant la tétée</h3>\n<p>Posé devant le fauteuil, le pouf remonte légèrement vos pieds : vos genoux se relèvent et bébé repose plus près de vous.</p>\n<h3>Une matière douce et facile à vivre</h3>\n<p>La housse en 100 % coton gaufré est douce au toucher et donne un joli relief au pouf.</p>\n<h3>Souple et léger</h3>\n<p>Garni de billes, il épouse la forme des pieds et se déplace d'une main, de la chambre au salon.</p>\n<h3>Un format qui se glisse partout</h3>\n<p>Avec 30 × 30 cm au sol et 20 cm de haut, il trouve sa place devant un fauteuil, près d'un lit ou sous une console.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur × profondeur</td>\n<td>30 × 30 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>20 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : placez le pouf à une vingtaine de centimètres devant le fauteuil à bascule, pour garder la bascule libre. Les cotes sont prises pouf garni, à 1 à 3 cm près.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Housse</td>\n<td>100 % coton gaufré</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Billes EPS</td>\n</tr>\n<tr>\n<td>Livraison</td>\n<td>Pouf livré garni</td>\n</tr>\n<tr>\n<td>Dimensions</td>\n<td>30 × 30 × 20 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Écru, blanc, caramel, gris perle</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la housse en coton à l'aspirateur, embout tissu, et traitez une tache localement, à l'eau tiède.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le pouf est livré garni, prêt à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le pouf est-il livré rempli ?</strong><br>\nOui, il est livré garni de billes, prêt à l'emploi.</p>\n<p><strong>2. Quelle est sa hauteur ?</strong><br>\n20 cm, pour 30 × 30 cm au sol, mesurés pouf garni.</p>\n<p><strong>3. Peut-il servir de repose-pieds devant un rocking chair ?</strong><br>\nOui : placé devant le fauteuil, il surélève les pieds pendant la tétée ou la lecture.</p>\n<p><strong>4. En quelle matière est la housse ?</strong><br>\nEn 100 % coton gaufré.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nÉcru, blanc, caramel et gris perle.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Petit pouf carré en coton gaufré | Bercelou", description:"Petit pouf carré 30 × 30 × 20 cm, housse 100 % coton gaufré, garni de billes. Repose-pieds ou assise d'appoint, 4 coloris doux."}, productType:"Pouf", vendor:"Bercelou", tags:["coussin-de-sol", "pouf", "repose-pieds"]}) { product { id handle } userErrors { field message } }
  x41_p: productUpdate(product:{id:"gid://shopify/Product/16616057635161", title:"Petit repose-pieds capitonné effet lin marron clair", handle:"petit-repose-pieds-effet-lin-marron-clair", descriptionHtml:"<p><strong>Le petit tabouret qui surélève vos pieds devant le fauteuil et se range partout.</strong></p>\n<ul>\n<li>Format compact : 27 × 27 cm, 26 cm de haut</li>\n<li>Assise capitonnée de 12 cm, tissu effet lin</li>\n<li>Pieds en bois d'hévéa avec patins antidérapants</li>\n<li>Charge jusqu'à 110 kg</li>\n</ul>\n<h3>Les pieds surélevés, sans encombrer</h3>\n<p>Avec 27 cm de côté, il se glisse devant un fauteuil ou un rocking chair et libère la place quand vous le rangez.</p>\n<h3>Un confort capitonné</h3>\n<p>Son assise de 12 cm, garnie de mousse dense et capitonnée, reste confortable sous les pieds.</p>\n<h3>Il reste en place</h3>\n<p>Les patins antidérapants sous les pieds en hévéa l'empêchent de glisser et protègent le sol.</p>\n<h3>Un petit siège pour les enfants</h3>\n<p>À 26 cm de haut, il devient un tabouret pour les plus petits ou un appui pour enfiler ses chaussures.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>27 × 27 × 26 cm</td>\n</tr>\n<tr>\n<td>Épaisseur d'assise</td>\n<td>12 cm</td>\n</tr>\n<tr>\n<td>Hauteur des pieds</td>\n<td>14 cm</td>\n</tr>\n<tr>\n<td>Charge maximale recommandée</td>\n<td>110 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>30 × 30 × 19 cm, 3,1 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : un carré de 30 cm suffit, il se range sous une console ou à côté du fauteuil.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu effet lin 100 % polyester</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse dense</td>\n</tr>\n<tr>\n<td>Pieds</td>\n<td>Bois d'hévéa, patins antidérapants</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Marron clair</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Simple et rapide</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu à l'aspirateur, embout tissu. Une tache se traite localement, à l'eau tiède et au savon doux.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le montage des pieds est simple et rapide.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quelle taille fait-il ?</strong><br>\n27 × 27 cm pour 26 cm de haut.</p>\n<p><strong>2. Glisse-t-il sur le parquet ?</strong><br>\nNon, ses pieds sont équipés de patins antidérapants.</p>\n<p><strong>3. Peut-on s'asseoir dessus ?</strong><br>\nOui, il supporte jusqu'à 110 kg.</p>\n<p><strong>4. Faut-il le monter ?</strong><br>\nUn montage simple et rapide est à prévoir.</p>\n<p><strong>5. Avec quel fauteuil l'associer ?</strong><br>\nIl complète un fauteuil d'allaitement, un rocking chair ou un fauteuil de lecture.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Petit repose-pieds capitonné effet lin | Bercelou", description:"Petit repose-pieds capitonné effet lin marron clair, 27 × 27 × 26 cm, pieds en hévéa, patins antidérapants, 110 kg. Livraison offerte."}, productType:"Repose-pieds", vendor:"Bercelou", tags:["repose-pieds", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }
  x42_p: productUpdate(product:{id:"gid://shopify/Product/16616099643737", title:"Plaid en fausse fourrure effet lapin, relief nervuré", handle:"plaid-fausse-fourrure-effet-lapin", descriptionHtml:"<p><strong>Une douceur de fourrure à glisser sur vos genoux, pour les soirées au coin du fauteuil.</strong></p>\n<ul>\n<li>Peluche imitation fourrure de lapin, très douce</li>\n<li>Relief nervuré qui donne du volume</li>\n<li>Anti-boulochage, lavable en machine</li>\n<li>120 × 200 ou 150 × 200 cm, en 5 coloris</li>\n</ul>\n<p>Ce plaid en peluche effet fourrure de lapin est l'allié des soirées cocooning. Son relief nervuré lui donne du gonflant et un joli jeu de lumière, sur un rocking chair comme sur un canapé.</p>\n<h3>Une douceur à envelopper</h3>\n<p>La peluche imitation lapin est moelleuse et chaude : glissez-la sur vos genoux pendant une histoire du soir ou une tétée, et le fauteuil devient un vrai cocon.</p>\n<h3>Un relief qui habille le fauteuil</h3>\n<p>Les nervures régulières donnent du volume au plaid. Plié sur l'accoudoir ou le dossier, il apporte une touche douce et élégante au salon.</p>\n<h3>Deux tailles utiles</h3>\n<p>Le 120 × 200 cm se drape sur un fauteuil ou sur une personne. Le 150 × 200 cm couvre un canapé ou deux personnes blotties.</p>\n<h3>Une matière facile à vivre</h3>\n<p>Le tissu est traité anti-boulochage et passe en machine : le plaid garde son aspect au fil des lavages.</p>\n<h3>5 coloris apaisants</h3>\n<p>Blanc lait, taupe, vert amande, gris perle ou rose poudré, pour s'accorder à votre fauteuil.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Format 1</td>\n<td>120 × 200 cm</td>\n</tr>\n<tr>\n<td>Format 2</td>\n<td>150 × 200 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : le 120 × 200 cm suffit pour un fauteuil ; le 150 × 200 cm couvre un canapé deux places.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Peluche imitation fourrure de lapin</td>\n</tr>\n<tr>\n<td>Aspect</td>\n<td>Relief nervuré</td>\n</tr>\n<tr>\n<td>Finition</td>\n<td>Anti-boulochage</td>\n</tr>\n<tr>\n<td>Formats</td>\n<td>120 × 200 cm, 150 × 200 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Blanc lait, taupe, vert amande, gris perle, rose poudré</td>\n</tr>\n<tr>\n<td>Entretien</td>\n<td>Lavable en machine</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le plaid se lave en machine. À réception, sortez-le de son sachet sous vide, secouez-le doucement et laissez-lui jusqu'à 24 h pour retrouver tout son gonflant.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le plaid est livré compressé sous vide : il retrouve son volume en 24 h environ.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le plaid est-il en vraie fourrure ?</strong><br>\nNon, c'est une peluche imitation fourrure de lapin, douce et facile d'entretien.</p>\n<p><strong>2. Pourquoi paraît-il plat à réception ?</strong><br>\nIl voyage sous vide. Sortez-le du sachet, secouez-le et laissez-lui jusqu'à 24 h pour reprendre son volume.</p>\n<p><strong>3. Se lave-t-il en machine ?</strong><br>\nOui, il est lavable en machine et traité anti-boulochage.</p>\n<p><strong>4. Quelle taille choisir ?</strong><br>\nLe 120 × 200 cm pour un fauteuil ou une personne, le 150 × 200 cm pour un canapé ou deux personnes.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nBlanc lait, taupe, vert amande, gris perle et rose poudré.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Plaid fausse fourrure effet lapin | Bercelou", description:"Plaid en fausse fourrure effet lapin, relief nervuré, anti-boulochage et lavable en machine. 120 × 200 ou 150 × 200 cm, 5 coloris."}, productType:"Plaid", vendor:"Bercelou", tags:["plaid", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }
  x43_p: productUpdate(product:{id:"gid://shopify/Product/16616099578201", title:"Plaid gaufré en coton, grand format 165 × 230 cm", handle:"plaid-gaufre-en-coton", descriptionHtml:"<p><strong>Un coton gaufré léger et doux, pour le fauteuil, le canapé ou le pied du lit.</strong></p>\n<ul>\n<li>100 % coton, tissage gaufré en relief</li>\n<li>Grand format 165 × 230 cm</li>\n<li>Doux pour la peau, lavable en machine</li>\n<li>3 coloris naturels : sable, gris clair, blanc</li>\n</ul>\n<p>Ce plaid en coton gaufré apporte une texture naturelle et légère à votre coin fauteuil. Son grand format se drape sur un rocking chair, couvre un canapé ou habille le lit.</p>\n<h3>Une matière douce et facile à vivre</h3>\n<p>Le coton est doux pour la peau et respirant : on s'y enroule en demi-saison sans avoir trop chaud. Le plaid passe en machine, pour les petits accidents du quotidien.</p>\n<h3>Le relief du gaufré</h3>\n<p>Le tissage en nid d'abeille donne du relief et de la tenue au plaid. Il capte la lumière et réchauffe la pièce, même plié sur un accoudoir.</p>\n<h3>Un grand format polyvalent</h3>\n<p>Avec 165 × 230 cm, il se drape généreusement sur un fauteuil à bascule, couvre un canapé deux places ou sert de jeté au pied du lit.</p>\n<h3>Des teintes naturelles</h3>\n<p>Sable, gris clair ou blanc : trois couleurs calmes qui s'accordent au bois clair, au rotin et à la bouclette.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions</td>\n<td>165 × 230 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : plié en deux ou en trois, il se pose sur le dossier d'un rocking chair ; déplié, il couvre un canapé deux places.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>100 % coton</td>\n</tr>\n<tr>\n<td>Tissage</td>\n<td>Gaufré (nid d'abeille)</td>\n</tr>\n<tr>\n<td>Dimensions</td>\n<td>165 × 230 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Sable, gris clair, blanc</td>\n</tr>\n<tr>\n<td>Contenu</td>\n<td>1 plaid</td>\n</tr>\n<tr>\n<td>Entretien</td>\n<td>Lavable en machine</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Lavez le plaid en machine. Les dimensions peuvent varier de 1 à 5 cm, le coton étant une fibre naturelle.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le plaid arrive plié, prêt à poser.</p>\n<h2>FAQ</h2>\n<p><strong>1. En quelle matière est ce plaid ?</strong><br>\nEn 100 % coton, avec un tissage gaufré en nid d'abeille.</p>\n<p><strong>2. Est-il assez grand pour un canapé ?</strong><br>\nOui : avec 165 × 230 cm, il couvre un canapé deux places ou se drape généreusement sur un fauteuil.</p>\n<p><strong>3. Se lave-t-il en machine ?</strong><br>\nOui, il est lavable en machine.</p>\n<p><strong>4. Convient-il en été ?</strong><br>\nLe coton est léger et respirant : le plaid s'utilise toute l'année, en couverture légère ou en jeté décoratif.</p>\n<p><strong>5. Quels coloris sont proposés ?</strong><br>\nSable, gris clair et blanc.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Plaid gaufré en coton, 165 × 230 cm | Bercelou", description:"Grand plaid gaufré 100 % coton, 165 × 230 cm, lavable en machine. Sable, gris clair ou blanc. Livraison offerte en France métropolitaine."}, productType:"Plaid", vendor:"Bercelou", tags:["plaid", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }

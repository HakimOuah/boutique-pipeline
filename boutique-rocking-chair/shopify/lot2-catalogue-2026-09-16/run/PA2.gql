mutation {
  a16_p: productUpdate(product:{id:"gid://shopify/Product/16616085619033", title:"Rocking chair en tissu gris clair, cadre en bois clair", handle:"rocking-chair-tissu-gris-cadre-bois-clair", descriptionHtml:"<p><strong>Un fauteuil à bascule aux lignes simples, avec son coussin lombaire, pour lire et se détendre au salon.</strong></p>\n<ul>\n<li>Cadre et patins en bois d'hévéa massif</li>\n<li>Coussin lombaire inclus pour caler le dos</li>\n<li>Assise large de 58,5 cm, épaisse de 15 cm</li>\n<li>Balancement doux sur 35°, charge 120 kg</li>\n</ul>\n<h3>Un coin lecture en un instant</h3>\n<p>Posez-le près d'une fenêtre : son cadre en bois clair et son tissu gris clair s'accordent aux intérieurs scandinaves comme aux chambres.</p>\n<h3>Le dos bien calé</h3>\n<p>Le coussin lombaire se glisse contre le dossier rembourré pour soutenir le bas du dos pendant la lecture.</p>\n<h3>Une assise large et moelleuse</h3>\n<p>L'assise de 58,5 × 56 cm repose sur un coussin de 15 cm, habillé d'un tissu au toucher lin.</p>\n<h3>Une bascule douce</h3>\n<p>Les pieds incurvés en bois basculent sur 35°, d'avant en arrière. Les bandes de feutre antidérapantes gardent le mouvement régulier et protègent le sol.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>65 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>87 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>84 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>58,5 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>56 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>39 à 43 cm</td>\n</tr>\n<tr>\n<td>Épaisseur de l'assise</td>\n<td>15 cm</td>\n</tr>\n<tr>\n<td>Dossier (largeur × hauteur)</td>\n<td>58,5 × 54,5 cm</td>\n</tr>\n<tr>\n<td>Accoudoirs (longueur × hauteur)</td>\n<td>79 × 53 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>13,8 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 87 cm de profondeur au sol et environ 50 cm de dégagement derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu effet lin (100 % polyester), gris clair</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois d'hévéa massif, teinte naturelle</td>\n</tr>\n<tr>\n<td>Inclus</td>\n<td>Coussin lombaire</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Bandes de feutre antidérapantes</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le tissu se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter. Le bois s'essuie avec un chiffon doux et sec.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à assembler.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le coussin lombaire est-il fourni ?</strong><br>\nOui, il est livré avec le fauteuil.</p>\n<p><strong>2. À quelle hauteur est l'assise ?</strong><br>\nEntre 39 et 43 cm du sol, une assise basse et détendue.</p>\n<p><strong>3. De combien le fauteuil bascule-t-il ?</strong><br>\nLes pieds incurvés offrent un balancement de 35°, d'avant en arrière.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\n65 cm de large, 87 cm de profondeur et 84 cm de haut. Laissez environ 50 cm derrière pour la bascule.</p>\n<p><strong>5. Quel poids supporte-t-il ?</strong><br>\nLa charge maximale est de 120 kg.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair gris clair, cadre en bois clair | Bercelou", description:"Rocking chair en tissu effet lin gris clair, cadre en hévéa massif, coussin lombaire inclus, bascule de 35°. 120 kg. Livraison offerte en France."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-bois-rotin"]}) { product { id handle } userErrors { field message } }

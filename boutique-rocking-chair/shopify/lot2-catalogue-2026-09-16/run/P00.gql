  x0_p: productUpdate(product:{id:"gid://shopify/Product/16616084930905", title:"Canapé enfant 2 places en tissu gris, structure bois", handle:"canape-enfant-2-places-gris", descriptionHtml:"<p><strong>Un vrai petit canapé pour lire à deux, jouer ou se poser, dans un style scandinave sobre.</strong></p>\n<ul>\n<li>Assise de 69 cm de large, pour deux enfants</li>\n<li>Structure en bois d'hévéa, charge jusqu'à 80 kg</li>\n<li>Mousse haute densité qui garde sa forme</li>\n<li>Tissu gris doux, dossier capitonné</li>\n</ul>\n<h3>Un canapé à leur taille</h3>\n<p>Avec 77 cm de large pour 48 cm de haut, ce canapé est pensé pour les enfants dès 3 ans. L'assise de 69 cm accueille deux enfants côte à côte.</p>\n<h3>Pour lire et jouer à deux</h3>\n<p>Frères, sœurs ou copains s'y installent ensemble pour une histoire, un dessin animé ou un moment calme dans la salle de jeux.</p>\n<h3>Une assise qui garde sa forme</h3>\n<p>La mousse haute densité offre un confort durable, et le tissu à poils courts reste doux au toucher. Le dossier capitonné donne une allure de vrai canapé.</p>\n<h3>Il s'accorde à la chambre</h3>\n<p>Gris clair et bois naturel : un style scandinave sobre qui trouve sa place dans la chambre, la salle de jeux ou le coin lecture du salon.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>77 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>42 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>48 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>69 × 31 cm</td>\n</tr>\n<tr>\n<td>Dossier (largeur × hauteur)</td>\n<td>69 × 25 cm</td>\n</tr>\n<tr>\n<td>Accoudoirs (longueur × largeur × hauteur)</td>\n<td>36 × 5 × 9 cm</td>\n</tr>\n<tr>\n<td>Âge conseillé</td>\n<td>Dès 3 ans</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>80 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>71 × 35 × 22 cm, 7 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : un mur libre de 80 cm suffit, idéal sous une fenêtre ou au pied d'une bibliothèque.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu à poils courts, gris clair</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse polyuréthane haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois d'hévéa</td>\n</tr>\n<tr>\n<td>Places</td>\n<td>2 enfants</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>80 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris clair</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu à l'aspirateur, embout tissu. Une tache se traite localement avec un chiffon légèrement humide. Le bois s'essuie avec un chiffon sec.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le canapé arrive à monter ; sa légèreté facilite le montage et le déplacement.</p>\n<h2>FAQ</h2>\n<p><strong>1. À partir de quel âge ?</strong><br>\nLe canapé est conseillé dès 3 ans.</p>\n<p><strong>2. Combien d'enfants peuvent s'y asseoir ?</strong><br>\nDeux enfants, sur une assise de 69 cm de large.</p>\n<p><strong>3. Quelle charge supporte-t-il ?</strong><br>\nJusqu'à 80 kg.</p>\n<p><strong>4. Faut-il le monter ?</strong><br>\nOui, un assemblage simple à réception.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\n77 cm de large pour 42 cm de profondeur et 48 cm de haut.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Canapé enfant 2 places gris, structure bois | Bercelou", description:"Canapé enfant 2 places en tissu gris capitonné sur structure en bois d'hévéa, dès 3 ans, charge 80 kg, 77 × 42 × 48 cm. Livraison offerte."}, productType:"Fauteuil enfant", vendor:"Bercelou", tags:["rocking-chair-enfant"]}) { product { id handle } userErrors { field message } }
  x1_p: productUpdate(product:{id:"gid://shopify/Product/16616092172633", title:"Chaise à bascule enfant en bois massif blanc, à lattes", handle:"chaise-a-bascule-enfant-bois-blanc", descriptionHtml:"<p><strong>Le rocking chair classique à sa taille, pour se bercer au salon comme sur la terrasse.</strong></p>\n<ul>\n<li>Bois massif, finition blanche imperméable</li>\n<li>Assise et piètement à lattes, séchage rapide</li>\n<li>Intérieur, véranda, terrasse ou balcon</li>\n<li>Assise à 28 cm du sol</li>\n</ul>\n<h3>Le rocking chair à sa taille</h3>\n<p>Avec 57 cm de haut et une assise à 28 cm du sol, cette chaise à bascule est à la mesure des enfants. Ils se bercent comme les grands, en lisant ou en regardant le jardin.</p>\n<h3>Une bascule douce</h3>\n<p>Les patins en bois massif donnent un bercement régulier. L'angle des pieds a été étudié pour une assise équilibrée.</p>\n<h3>Dedans comme dehors</h3>\n<p>Les lattes laissent l'eau s'écouler et sécher vite, et la finition imperméable protège le bois. La chaise passe du salon à la terrasse, au balcon ou à la véranda.</p>\n<h3>Facile à vivre</h3>\n<p>Une éclaboussure ou un peu de terre : un coup d'éponge suffit. Le blanc s'accorde à la chambre d'enfant comme au mobilier de jardin.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>57 cm</td>\n</tr>\n<tr>\n<td>Largeur</td>\n<td>34,5 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>46,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>28 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>27,5 × 30 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs (sol)</td>\n<td>37,5 cm</td>\n</tr>\n<tr>\n<td>Largeur du dossier</td>\n<td>27 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>57 × 39 × 8 cm, 5,4 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez 30 cm de dégagement devant et derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Bois massif</td>\n</tr>\n<tr>\n<td>Finition</td>\n<td>Blanche, imperméable</td>\n</tr>\n<tr>\n<td>Assise</td>\n<td>À lattes</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Intérieur et extérieur</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Blanc</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Nettoyez la chaise avec une éponge humide. Laissez-la sécher à l'air après la pluie.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis plat de 57 × 39 × 8 cm.</p>\n<h2>FAQ</h2>\n<p><strong>1. Peut-elle rester dehors ?</strong><br>\nElle s'utilise en intérieur comme en extérieur : lattes drainantes et finition imperméable. Rentrez-la par mauvais temps prolongé pour préserver le bois.</p>\n<p><strong>2. Quelle est la hauteur d'assise ?</strong><br>\n28 cm du sol, pour une assise de 27,5 × 30 cm.</p>\n<p><strong>3. Comment l'entretenir ?</strong><br>\nUn coup d'éponge humide suffit.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\n34,5 cm de large pour 46,5 cm de profondeur et 57 cm de haut, plus un peu d'espace pour la bascule.</p>\n<p><strong>5. Quelle couleur est disponible ?</strong><br>\nBlanc.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Chaise à bascule enfant en bois blanc | Bercelou", description:"Chaise à bascule enfant en bois massif blanc, assise à lattes et finition imperméable, pour l'intérieur comme la terrasse. Livraison offerte."}, productType:"Fauteuil enfant", vendor:"Bercelou", tags:["rocking-chair-enfant"]}) { product { id handle } userErrors { field message } }
  x2_p: productUpdate(product:{id:"gid://shopify/Product/16616075493721", title:"Chaise longue à bascule en acacia massif, coussin gris", handle:"chaise-longue-a-bascule-acacia", descriptionHtml:"<p><strong>Allongez-vous, laissez-vous bercer : la vague d'acacia épouse le corps au jardin comme sur la terrasse.</strong></p>\n<ul>\n<li>Acacia massif à lattes, forme en vague ergonomique</li>\n<li>Coussin épais gris et coussin de tête</li>\n<li>Butées inférieures qui empêchent le basculement</li>\n<li>Lattes ajourées : l'eau ne stagne pas, l'air circule</li>\n</ul>\n<p>Une chaise longue à bascule sculptée en acacia massif, pour bronzer, lire ou somnoler au bord de la piscine, sur la terrasse ou au jardin.</p>\n<h3>Une bascule douce</h3>\n<p>La chaise longue se balance doucement pour accompagner vos moments de détente. Des butées placées sous la structure empêchent tout renversement.</p>\n<h3>Une forme qui épouse le corps</h3>\n<p>La surface ergonomique suit les courbes du dos et des jambes. Le coussin épais et le coussin de tête ajoutent du moelleux.</p>\n<h3>Sur la terrasse</h3>\n<p>L'acacia massif, dense et robuste, se prête à l'extérieur. Ses veinures uniques donnent à chaque chaise longue un aspect propre.</p>\n<h3>Une assise sèche et aérée</h3>\n<p>La conception à lattes laisse circuler l'air et évite que l'eau stagne.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × l × H)</td>\n<td>154 × 60 × 74 cm</td>\n</tr>\n<tr>\n<td>Coussin de tête (L × l)</td>\n<td>45,5 × 26,5 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez environ 1,80 m de longueur au sol pour se balancer librement.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Acacia massif à lattes</td>\n</tr>\n<tr>\n<td>Coussins</td>\n<td>Coussin d'assise épais et coussin de tête, gris</td>\n</tr>\n<tr>\n<td>Sécurité</td>\n<td>Butées anti-basculement</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Jardin, terrasse, bord de piscine, balcon</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Rangez les coussins à l'abri après usage. Protégez la chaise longue avec une housse imperméable pour préserver l'aspect du bois au fil des saisons.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 102 × 57 × 15 cm pour 15,4 kg. La chaise longue est à assembler à réception.</p>\n<h2>FAQ</h2>\n<p><strong>1. Peut-elle rester dehors ?</strong><br>\nL'acacia massif se prête à l'extérieur. Pour garder son aspect, protégez-la d'une housse imperméable et rentrez les coussins.</p>\n<p><strong>2. Est-elle stable quand on se balance ?</strong><br>\nOui, des butées sous la structure empêchent le basculement.</p>\n<p><strong>3. Les coussins sont-ils fournis ?</strong><br>\nOui, un coussin d'assise épais et un coussin de tête, gris.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\nElle mesure 154 cm de long et 60 cm de large : laissez un peu d'espace à chaque extrémité pour la bascule.</p>\n<p><strong>5. Faut-il la monter ?</strong><br>\nOui, elle arrive en colis plat et s'assemble à réception.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Chaise longue à bascule en acacia, coussin gris | Bercelou", description:"Chaise longue à bascule en acacia massif avec coussin épais gris et coussin de tête : forme ergonomique, butées de sécurité. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax-jardin", "rocking-chair-exterieur"]}) { product { id handle } userErrors { field message } }
  x3_p: productUpdate(product:{id:"gid://shopify/Product/16616099774809", title:"Coussin de sol carré en velours côtelé capitonné", handle:"coussin-de-sol-carre-velours-cotele", descriptionHtml:"<p><strong>Un carré moelleux en velours côtelé, pour le coin lecture ou l'assise sur la chaise.</strong></p>\n<ul>\n<li>Velours côtelé doux, double épaisseur moelleuse</li>\n<li>Garnissage généreux en fibres de polyester</li>\n<li>45 × 45 cm ou 50 × 50 cm</li>\n<li>Lavable à la main ou en machine</li>\n</ul>\n<p>Ce coussin carré en velours côtelé capitonné se pose au sol, sur une chaise ou sur un banc. Son garnissage généreux et son toucher velours en font l'assise douce du coin lecture.</p>\n<h3>Un coin lecture au sol</h3>\n<p>Posé près du rocking chair ou d'une bibliothèque, il offre une assise basse et moelleuse pour les histoires et les jeux.</p>\n<h3>Le velours côtelé, doux et chaleureux</h3>\n<p>Les côtes du velours captent la lumière et apportent une texture chaleureuse, en caramel ou bleu jean.</p>\n<h3>Un confort qui rebondit</h3>\n<p>Le garnissage généreux en fibres de polyester reprend bien sa forme, pour rester confortable au fil des assises.</p>\n<h3>Facile à laver</h3>\n<p>Le coussin se lave à la main ou en machine, pratique dans une chambre d'enfant.</p>\n<h3>Deux formats carrés</h3>\n<p>Le 45 × 45 cm pour une chaise ou un enfant, le 50 × 50 cm pour une assise au sol plus large.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Format 1</td>\n<td>45 × 45 cm</td>\n</tr>\n<tr>\n<td>Format 2</td>\n<td>50 × 50 cm</td>\n</tr>\n</tbody>\n</table>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Housse</td>\n<td>Velours côtelé (100 % polyester)</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Fibres de polyester</td>\n</tr>\n<tr>\n<td>Forme</td>\n<td>Carrée, capitonnée</td>\n</tr>\n<tr>\n<td>Housse amovible</td>\n<td>Non</td>\n</tr>\n<tr>\n<td>Formats</td>\n<td>45 × 45 cm, 50 × 50 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Caramel, bleu jean</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le coussin se lave entier, à la main ou en machine. Laissez-le sécher complètement et tapotez-le pour redonner du volume au garnissage.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le coussin arrive prêt à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le coussin se lave-t-il ?</strong><br>\nOui, entier, à la main ou en machine. Laissez-le bien sécher avant usage.</p>\n<p><strong>2. La housse s'enlève-t-elle ?</strong><br>\nNon, le coussin se lave en une seule pièce.</p>\n<p><strong>3. Peut-on l'utiliser sur une chaise ?</strong><br>\nOui, le 45 × 45 cm convient à une assise de chaise ou de banc.</p>\n<p><strong>4. Quel format pour s'asseoir au sol ?</strong><br>\nLe 50 × 50 cm offre une assise plus large pour un adulte.</p>\n<p><strong>5. Quels coloris sont proposés ?</strong><br>\nCaramel et bleu jean.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Coussin de sol carré en velours côtelé | Bercelou", description:"Coussin de sol carré en velours côtelé capitonné, 45 × 45 ou 50 × 50 cm, lavable à la main ou en machine. Caramel ou bleu jean."}, productType:"Coussin de sol", vendor:"Bercelou", tags:["coussin-de-sol", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }
  x4_p: productUpdate(product:{id:"gid://shopify/Product/16616099742041", title:"Coussin de sol rond épais aspect lin, déhoussable", handle:"coussin-de-sol-rond-epais-dehoussable", descriptionHtml:"<p><strong>Une assise ferme de 10 cm, une housse qui s'enlève : le coussin de sol facile à vivre.</strong></p>\n<ul>\n<li>10 cm d'épaisseur, mousse haute résilience</li>\n<li>Housse amovible et lavable</li>\n<li>Tissu aspect lin, 5 coloris doux</li>\n<li>Ø 40 cm ou Ø 50 cm</li>\n</ul>\n<p>Ce coussin de sol rond garde sa forme grâce à sa mousse haute résilience. Sa housse aspect lin s'enlève pour le lavage : pratique dans une chambre d'enfant ou un salon.</p>\n<h3>Une assise qui garde sa forme</h3>\n<p>Avec 10 cm de mousse haute résilience, le coussin reste plat et ferme, même après de longues heures d'assise.</p>\n<h3>Une housse facile à vivre</h3>\n<p>La housse est amovible et lavable : un petit accident, un goûter renversé, et elle repart au lavage.</p>\n<h3>Un aspect lin naturel</h3>\n<p>Le tissage aspect lin apporte une texture douce et naturelle, en écru, gris taupe, bleu gris, bleu ciel ou vert amande.</p>\n<h3>Deux diamètres</h3>\n<p>Le Ø 40 cm pour un enfant ou une chaise basse, le Ø 50 cm pour une assise d'adulte au sol.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre (format 1)</td>\n<td>40 cm</td>\n</tr>\n<tr>\n<td>Diamètre (format 2)</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Épaisseur</td>\n<td>10 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : les cotes peuvent varier de 1 à 5 cm sur le diamètre et de 1 cm sur l'épaisseur.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Housse</td>\n<td>Tissu aspect lin, amovible et lavable</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute résilience</td>\n</tr>\n<tr>\n<td>Forme</td>\n<td>Ronde, bords droits</td>\n</tr>\n<tr>\n<td>Épaisseur</td>\n<td>10 cm</td>\n</tr>\n<tr>\n<td>Diamètres</td>\n<td>40 cm, 50 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Écru, gris taupe, bleu gris, bleu ciel, vert amande</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Retirez la housse pour la laver, puis remettez-la une fois bien sèche.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le coussin est livré housse en place, prêt à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. La housse s'enlève-t-elle ?</strong><br>\nOui, elle est amovible et lavable.</p>\n<p><strong>2. Quelle est l'épaisseur du coussin ?</strong><br>\n10 cm, à 1 cm près.</p>\n<p><strong>3. Le coussin s'affaisse-t-il ?</strong><br>\nSa mousse haute résilience lui permet de garder sa forme au fil des assises.</p>\n<p><strong>4. Quel diamètre choisir ?</strong><br>\nLe Ø 40 cm pour un enfant, le Ø 50 cm pour un adulte.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nÉcru, gris taupe, bleu gris, bleu ciel et vert amande.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Coussin de sol rond épais, déhoussable | Bercelou", description:"Coussin de sol rond de 10 cm d'épaisseur, mousse haute résilience et housse amovible aspect lin. Ø 40 ou 50 cm, 5 coloris."}, productType:"Coussin de sol", vendor:"Bercelou", tags:["coussin-de-sol"]}) { product { id handle } userErrors { field message } }
  x5_p: productUpdate(product:{id:"gid://shopify/Product/16616092303705", title:"Coussin de sol rond rayé et capitonné", handle:"coussin-de-sol-rond-raye-capitonne", descriptionHtml:"<p><strong>Un gros coussin moelleux à fines rayures, pour s'asseoir au sol en tout confort.</strong></p>\n<ul>\n<li>Garnissage généreux, capitonnage moelleux</li>\n<li>Fines rayures douces : gris, beige ou bleu</li>\n<li>Ø 47 cm ou Ø 55 cm</li>\n<li>Complétez votre coin cocon</li>\n</ul>\n<p>Ce coussin de sol rond et rebondi, à fines rayures, offre une assise basse et moelleuse dans le salon, la chambre d'enfant ou le coin lecture.</p>\n<h3>Une assise moelleuse au sol</h3>\n<p>Le garnissage généreux et le capitonnage donnent un coussin bien rebondi, confortable pour s'asseoir longtemps au sol.</p>\n<h3>Autour du rocking chair</h3>\n<p>Posé près du fauteuil à bascule, il accueille un enfant pendant l'histoire du soir ou sert d'assise d'appoint.</p>\n<h3>Des rayures qui apaisent</h3>\n<p>Des rayures fines en gris, beige ou bleu, faciles à marier avec le lin, le bois et les tons naturels.</p>\n<h3>Deux diamètres</h3>\n<p>Le Ø 47 cm pour un enfant ou un coin étroit, le Ø 55 cm pour une grande assise d'adulte.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre (format 1)</td>\n<td>47 cm</td>\n</tr>\n<tr>\n<td>Diamètre (format 2)</td>\n<td>55 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : à réception, laissez le coussin quelques jours à l'air libre : il arrive légèrement compressé et reprend ensuite son volume.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Aspect</td>\n<td>Tissu à fines rayures, capitonné</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Fibres</td>\n</tr>\n<tr>\n<td>Forme</td>\n<td>Ronde</td>\n</tr>\n<tr>\n<td>Housse</td>\n<td>Non déhoussable</td>\n</tr>\n<tr>\n<td>Diamètres</td>\n<td>47 cm, 55 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Rayé gris, rayé beige, rayé bleu</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le coussin à l'aspirateur, embout tissu, et traitez une tache localement, à l'eau tiède, en tamponnant.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 7 à 15 jours ouvrés. Le coussin arrive compressé : laissez-lui quelques jours pour reprendre son volume.</p>\n<h2>FAQ</h2>\n<p><strong>1. Pourquoi le coussin paraît-il plat à réception ?</strong><br>\nIl voyage légèrement compressé. Laissez-le quelques jours à l'air libre pour qu'il retrouve sa taille.</p>\n<p><strong>2. Quel diamètre choisir ?</strong><br>\nLe Ø 47 cm pour un enfant ou un coin étroit, le Ø 55 cm pour une assise d'adulte.</p>\n<p><strong>3. La housse s'enlève-t-elle ?</strong><br>\nNon, le coussin n'est pas déhoussable : nettoyez-le localement.</p>\n<p><strong>4. Est-il confortable longtemps ?</strong><br>\nSon garnissage généreux et son capitonnage offrent une assise moelleuse pour rester assis au sol.</p>\n<p><strong>5. Quels coloris sont proposés ?</strong><br>\nRayé gris, rayé beige et rayé bleu.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 7 à 15 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou article manquant : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Coussin de sol rond rayé capitonné | Bercelou", description:"Gros coussin de sol rond rayé et capitonné, Ø 47 ou 55 cm, garnissage généreux. Rayé gris, beige ou bleu. Livraison offerte en France."}, productType:"Coussin de sol", vendor:"Bercelou", tags:["coussin-de-sol", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }
  x6_p: productUpdate(product:{id:"gid://shopify/Product/16616092959065", title:"Fauteuil à bascule d'allaitement en lin, poches latérales", handle:"fauteuil-a-bascule-allaitement-lin-poches", descriptionHtml:"<p><strong>Un dossier haut et épais, des accoudoirs à la bonne hauteur et deux poches pour tout garder près de vous.</strong></p>\n<ul>\n<li>Dossier haut épaissi de 60 cm, coussin lombaire</li>\n<li>Accoudoirs à 70 cm du sol, poche de chaque côté</li>\n<li>Assise à 54 cm du sol, pour vous relever plus facilement</li>\n<li>Lin respirant sur base à bascule en bois massif</li>\n</ul>\n<h3>Pour les tétées de nuit</h3>\n<p>Installez-vous au fond de l'assise, bercez bébé : la base à bascule en bois naturel donne un mouvement régulier, et les patins antidérapants protègent le sol.</p>\n<h3>Vos bras et votre dos bien soutenus</h3>\n<p>Le dossier, garni de mousse haute densité, remonte à 60 cm au-dessus de l'assise et soutient la taille, le dos et les épaules. Un coussin lombaire complète l'appui. Les accoudoirs, à 70 cm du sol, accueillent les bras pendant la tétée.</p>\n<h3>Se relever en douceur</h3>\n<p>L'assise est à 54 cm du sol, une hauteur qui aide à se relever avec bébé dans les bras. Arrêtez la bascule et prenez appui sur les accoudoirs pleins.</p>\n<h3>Tout à portée de main</h3>\n<p>Une grande poche sur chaque accoudoir garde le biberon, les mouchoirs, le téléphone ou un livre, sans vous lever.</p>\n<h3>Une matière douce et facile à vivre</h3>\n<p>Le lin beige, respirant et doux pour la peau, et le bois clair donnent au fauteuil une teinte crème qui s'intègre à la chambre comme au salon.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>96 cm</td>\n</tr>\n<tr>\n<td>Largeur</td>\n<td>68 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>93 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier (depuis l'assise)</td>\n<td>60 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>54 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>56 × 52 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs (sol)</td>\n<td>70 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>72 × 69 × 45 cm, 23,8 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 93 cm de profondeur au sol et 50 cm de dégagement derrière le fauteuil pour une bascule libre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Lin beige</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Base à bascule en bois massif</td>\n</tr>\n<tr>\n<td>Accessoire</td>\n<td>Coussin lombaire</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Une poche sur chaque accoudoir</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Antidérapants</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception, outils et notice fournis</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Lin beige</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le lin à l'aspirateur, embout tissu. Une tache se traite localement avec un chiffon légèrement humide, sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à monter, avec les outils et la notice.</p>\n<h2>FAQ</h2>\n<p><strong>1. Pourrai-je me relever avec bébé dans les bras ?</strong><br>\nL'assise est à 54 cm du sol et les accoudoirs à 70 cm : avancez-vous, arrêtez la bascule et prenez appui sur les accoudoirs.</p>\n<p><strong>2. Le dossier est-il assez haut ?</strong><br>\nIl remonte à 60 cm au-dessus de l'assise, jusqu'aux épaules, avec un coussin lombaire pour le bas du dos.</p>\n<p><strong>3. À quoi servent les poches ?</strong><br>\nChaque accoudoir a une grande poche pour le biberon, le téléphone, la télécommande, un livre ou les mouchoirs.</p>\n<p><strong>4. Le fauteuil protège-t-il le sol ?</strong><br>\nDes patins antidérapants sont posés sous la base à bascule en bois massif.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\n68 cm de large pour 93 cm de profondeur et 96 cm de haut. Laissez 50 cm derrière pour la bascule.</p>\n<p><strong>6. Le montage est-il fourni ?</strong><br>\nLe fauteuil arrive à monter, avec un jeu d'outils et une notice de montage.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil à bascule d'allaitement en lin | Bercelou", description:"Fauteuil à bascule d'allaitement en lin beige : dossier haut de 60 cm, accoudoirs à 70 cm, poches des deux côtés, base en bois massif. Livraison offerte."}, productType:"Fauteuil d'allaitement", vendor:"Bercelou", tags:["fauteuil-allaitement", "fauteuil-a-bascule"]}) { product { id handle } userErrors { field message } }
  x7_p: productUpdate(product:{id:"gid://shopify/Product/16616092893529", title:"Fauteuil à bascule chenille, soutien lombaire, repose-pieds", handle:"fauteuil-a-bascule-chenille-soutien-lombaire", descriptionHtml:"<p><strong>Réglez le soutien du bas du dos d'une pression, sortez le repose-pieds et bercez bébé en douceur.</strong></p>\n<ul>\n<li>Soutien lombaire gonflable, réglable à la main</li>\n<li>Repose-pieds coulissant, rangé sous l'assise</li>\n<li>Dossier haut matelassé de 59,5 cm</li>\n<li>Chenille douce, 3 coloris</li>\n</ul>\n<h3>Pour les tétées de nuit</h3>\n<p>Le dossier haut et les accoudoirs enveloppants vous tiennent au chaud, le repose-pieds soutient les jambes : le fauteuil accompagne les longues tétées et les moments de lecture.</p>\n<h3>Réglages et confort</h3>\n<p>Un coussin d'air est intégré au bas du dossier. Pressez la poire pour le gonfler et ajuster le soutien lombaire, appuyez sur le bouton pour le dégonfler. Chacun trouve son réglage.</p>\n<h3>Les jambes au repos</h3>\n<p>Le repose-pieds coulisse de sous l'assise et avance de 30 cm. Il se range d'un geste quand vous voulez vous relever.</p>\n<h3>Tout à portée de main</h3>\n<p>Une poche sur le côté droit garde un magazine, la télécommande ou le téléphone.</p>\n<h3>Une matière douce et facile à vivre</h3>\n<p>La chenille, douce et au grain chiné, recouvre une mousse haute densité. Le bord avant de l'assise, arrondi en cascade, allège l'appui sous les cuisses.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>89 cm</td>\n</tr>\n<tr>\n<td>Largeur</td>\n<td>63 cm</td>\n</tr>\n<tr>\n<td>Profondeur au sol</td>\n<td>92 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier (depuis l'assise)</td>\n<td>59,5 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>42 × 43 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs (depuis l'assise)</td>\n<td>26 cm</td>\n</tr>\n<tr>\n<td>Repose-pieds (largeur)</td>\n<td>27,5 cm</td>\n</tr>\n<tr>\n<td>Avancée du repose-pieds</td>\n<td>30 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>110 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>63 × 92 × 89 cm, 11,2 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez 92 cm de profondeur, 30 cm de plus devant pour le repose-pieds et 50 cm de dégagement derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Chenille</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Acier, pieds à bascule en bois massif</td>\n</tr>\n<tr>\n<td>Soutien lombaire</td>\n<td>Coussin d'air gonflable, réglable</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Coulissant sous l'assise</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Poche latérale côté droit</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Antidérapants</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>110 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception</td>\n</tr>\n<tr>\n<td>Coloris disponibles</td>\n<td>Gris anthracite, bleu gris, beige rosé</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la chenille à l'aspirateur, embout tissu. Une tache se traite localement avec un chiffon légèrement humide, sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à monter.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment régler le soutien lombaire ?</strong><br>\nPressez la poire pour gonfler le coussin d'air du bas du dossier, appuyez sur le bouton pour le dégonfler.</p>\n<p><strong>2. Le repose-pieds est-il intégré ?</strong><br>\nOui, il coulisse de sous l'assise et avance de 30 cm, puis se range.</p>\n<p><strong>3. Quelle charge le fauteuil supporte-t-il ?</strong><br>\nJusqu'à 110 kg.</p>\n<p><strong>4. Le dossier est-il haut ?</strong><br>\nIl remonte à 59,5 cm au-dessus de l'assise, matelassé sur toute sa hauteur.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nGris anthracite, bleu gris et beige rosé, tous en chenille.</p>\n<p><strong>6. Quelle place prévoir ?</strong><br>\n63 cm de large, 92 cm de profondeur et 89 cm de haut. Ajoutez 30 cm devant pour le repose-pieds et 50 cm derrière pour la bascule.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil à bascule chenille, soutien lombaire | Bercelou", description:"Fauteuil à bascule en chenille : soutien lombaire gonflable réglable, repose-pieds coulissant, poche de rangement. 3 coloris. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["fauteuil-allaitement", "rocking-chair-repose-pieds", "fauteuil-a-bascule"]}) { product { id handle } userErrors { field message } }
  x8_p: productUpdate(product:{id:"gid://shopify/Product/16616092762457", title:"Fauteuil à bascule en teddy écru, accoudoirs en bois", handle:"fauteuil-a-bascule-teddy-accoudoirs-bois", descriptionHtml:"<p><strong>Un teddy moelleux, une bascule lente sur bois massif : le fauteuil où l'on se pose pour la tétée, puis pour lire.</strong></p>\n<ul>\n<li>Teddy écru moelleux, rembourrage épais de 15 cm</li>\n<li>Dossier haut de 65 cm, pour appuyer tout le dos</li>\n<li>Structure en hévéa massif, bandes de feutre sous les patins</li>\n<li>Charge jusqu'à 120 kg</li>\n</ul>\n<h3>Une bascule douce</h3>\n<p>Le fauteuil oscille d'environ 10° vers l'avant et vers l'arrière, un mouvement mesuré qui berce sans surprise. Des bandes de feutre antidérapantes sous les patins protègent le sol.</p>\n<h3>Vos bras et votre dos bien soutenus</h3>\n<p>Le dossier en deux coussins remonte à 65 cm au-dessus de l'assise et épouse le dos, jusqu'à la tête. Les accoudoirs en bois lisse, légèrement galbés, se trouvent à 17 cm au-dessus de l'assise pour poser les avant-bras.</p>\n<h3>Une assise large et moelleuse</h3>\n<p>L'assise mesure 60 cm de large pour 57 cm de profondeur, avec un rembourrage de 15 cm. Placez un coussin sur l'accoudoir pour les longues tétées.</p>\n<h3>Se relever en douceur</h3>\n<p>L'assise est à 53 cm du sol, une hauteur qui aide à se relever. Arrêtez la bascule avec les pieds et prenez appui sur les accoudoirs en bois.</p>\n<h3>Il reste au salon après bébé</h3>\n<p>Teddy écru et bois d'hévéa clair : une silhouette scandinave qui réchauffe le salon et devient le coin lecture de la maison.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>98 cm</td>\n</tr>\n<tr>\n<td>Largeur</td>\n<td>65 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>90 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier (depuis l'assise)</td>\n<td>65 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>53 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>60 × 57 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs (depuis l'assise)</td>\n<td>17 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du rembourrage</td>\n<td>15 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>86 × 44 × 62 cm, 19,5 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 90 cm de profondeur au sol et 50 cm de dégagement derrière le fauteuil pour une bascule libre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Teddy écru</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois d'hévéa massif</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>En bois, galbés</td>\n</tr>\n<tr>\n<td>Bascule</td>\n<td>Environ 10° vers l'avant et vers l'arrière</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Bandes de feutre antidérapantes</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception, notice fournie</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Écru</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le teddy à l'aspirateur, embout tissu. Une tache se traite localement, à l'eau tiède. Le bois s'essuie avec un chiffon sec.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à monter, notice fournie.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le fauteuil convient-il à l'allaitement ?</strong><br>\nOui : dossier haut de 65 cm, assise large de 60 cm et rembourrage épais. Un coussin posé sur l'accoudoir en bois rend les longues tétées plus confortables.</p>\n<p><strong>2. Quelle est l'amplitude de la bascule ?</strong><br>\nEnviron 10° vers l'avant et vers l'arrière, un mouvement mesuré.</p>\n<p><strong>3. Le fauteuil raye-t-il le parquet ?</strong><br>\nDes bandes de feutre antidérapantes sont posées sous les patins pour protéger le sol.</p>\n<p><strong>4. Pourrai-je me relever facilement ?</strong><br>\nL'assise est à 53 cm du sol. Arrêtez la bascule avec les pieds et prenez appui sur les accoudoirs.</p>\n<p><strong>5. Quelle charge le fauteuil supporte-t-il ?</strong><br>\nJusqu'à 120 kg.</p>\n<p><strong>6. Quelle place prévoir ?</strong><br>\n65 cm de large pour 90 cm de profondeur et 98 cm de haut. Laissez 50 cm derrière pour la bascule.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil à bascule teddy, accoudoirs bois | Bercelou", description:"Fauteuil à bascule en teddy écru sur structure en hévéa massif : dossier de 65 cm, rembourrage de 15 cm, patins feutrés, charge 120 kg. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["fauteuil-a-bascule", "fauteuil-allaitement", "rocking-chair-design-scandinave"]}) { product { id handle } userErrors { field message } }

  x26_p: productUpdate(product:{id:"gid://shopify/Product/16616086339929", title:"Fauteuil relax en bouclette crème, pivotant et à bascule", handle:"fauteuil-relax-bouclette-creme-pivotant", descriptionHtml:"<p><strong>La douceur de la bouclette, une bascule qui apaise et un dossier qui s'allonge pour lire ou somnoler.</strong></p>\n<ul>\n<li>Bouclette crème douce, dossier double couche moelleux</li>\n<li>Pivote à 360° et se balance doucement</li>\n<li>Dossier inclinable jusqu'à 135° par poignée, repose-pieds intégré</li>\n<li>Assise large de 55 cm, à ressorts ensachés</li>\n</ul>\n<p>Ce fauteuil relax en bouclette crème réchauffe le salon et invite à la pause : il pivote vers la conversation, se balance doucement et s'incline pour lire ou faire une sieste.</p>\n<h3>Une matière douce et chaleureuse</h3>\n<p>La bouclette crème habille tout le fauteuil d'une texture douce et enveloppante, dans l'esprit des intérieurs cocooning.</p>\n<h3>Une bascule douce</h3>\n<p>Le fauteuil se balance doucement d'avant en arrière et pivote à 360°, pour vous tourner vers la fenêtre ou vos proches.</p>\n<h3>Réglages et confort</h3>\n<p>Une poignée incline le dossier jusqu'à 135° et déploie le repose-pieds. Vous passez de la lecture à la sieste sans quitter votre place.</p>\n<h3>Une assise moelleuse et durable</h3>\n<p>Des ressorts ensachés et une mousse haute densité garnissent l'assise. Le dossier double couche, rempli de coton PP, reste moelleux.</p>\n<h3>Il s'intègre au salon</h3>\n<p>Des lignes nettes, une couleur crème lumineuse : il se place aussi bien au salon que dans une chambre.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>76 × 94 × 100 cm</td>\n</tr>\n<tr>\n<td>Dimensions inclinées (L × P × H)</td>\n<td>76 × 160 × 78 cm</td>\n</tr>\n<tr>\n<td>Assise (L × P)</td>\n<td>55 × 56 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>49,5 cm</td>\n</tr>\n<tr>\n<td>Dossier (L × H)</td>\n<td>61 × 61 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du dossier</td>\n<td>19 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs (sol)</td>\n<td>61 cm</td>\n</tr>\n<tr>\n<td>Distance au mur conseillée</td>\n<td>30 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : laissez 30 cm entre le dossier et le mur, et comptez 160 cm de profondeur en position inclinée.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Bouclette, 100 % polyester</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Ressorts ensachés, mousse haute densité, coton PP</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Acier</td>\n</tr>\n<tr>\n<td>Mouvements</td>\n<td>Rotation 360°, bascule douce, inclinaison jusqu'à 135°</td>\n</tr>\n<tr>\n<td>Commande</td>\n<td>Manuelle, par poignée</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Intégré</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Crème</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception, notice fournie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la bouclette à l'aspirateur, embout tissu. Une tache se traite localement, à l'eau tiède, sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 77 × 58 × 47 cm pour 28 kg. Le fauteuil est à assembler à réception, notice fournie.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le fauteuil pivote-t-il et bascule-t-il ?</strong><br>\nOui, il tourne à 360° et se balance doucement.</p>\n<p><strong>2. Comment l'incliner ?</strong><br>\nTirez la poignée : le dossier s'incline jusqu'à 135° et le repose-pieds se déplie.</p>\n<p><strong>3. Quelle est la hauteur d'assise ?</strong><br>\nL'assise est à 49,5 cm du sol, les accoudoirs à 61 cm.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\nIl mesure 76 × 94 cm au sol. Laissez 30 cm derrière et comptez 160 cm de profondeur incliné.</p>\n<p><strong>5. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 120 kg.</p>\n<p><strong>6. Comment entretenir la bouclette ?</strong><br>\nÀ l'aspirateur, embout tissu, et localement à l'eau tiède en cas de tache.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil relax bouclette crème, pivotant | Bercelou", description:"Fauteuil relax en bouclette crème : pivotant à 360°, bascule douce, dossier inclinable à 135° et repose-pieds, ressorts ensachés. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax", "rocking-chair-repose-pieds"]}) { product { id handle } userErrors { field message } }
  x27_p: productUpdate(product:{id:"gid://shopify/Product/16616075231577", title:"Fauteuil relax électrique compact en tissu gris", handle:"fauteuil-relax-electrique-gris-compact", descriptionHtml:"<p><strong>Toutes les positions à la télécommande, dans 60 cm de largeur : le relax électrique des petits salons.</strong></p>\n<ul>\n<li>Positions électriques de 90° à 160°, télécommande filaire</li>\n<li>Dossier et repose-pieds réglés ensemble, en continu</li>\n<li>Format compact : 60 × 65 cm au sol, assise de 55 cm</li>\n<li>Poche latérale et patins protecteurs</li>\n</ul>\n<p>Ce fauteuil relax électrique réunit le confort d'un relax motorisé et un encombrement réduit, pour un salon, une chambre ou un coin lecture.</p>\n<h3>Réglages et confort</h3>\n<p>La télécommande filaire règle le dossier et le repose-pieds en continu : 90° pour lire, 120° pour la télévision, 160° pour la sieste.</p>\n<h3>Une assise qui garde sa forme</h3>\n<p>Le rembourrage en mousse haute densité soutient le corps et conserve sa tenue, même après de longues heures assis.</p>\n<h3>Une structure métal stable</h3>\n<p>Le châssis en métal assure un mouvement d'inclinaison régulier et un fauteuil stable dans chaque position.</p>\n<h3>Un format pensé pour les petits espaces</h3>\n<p>Avec 60 cm de largeur, 65 cm de profondeur et une assise de 55 cm de large, il se glisse sans alourdir la pièce.</p>\n<h3>Une matière facile à vivre</h3>\n<p>Le tissu gris chiné, respirant, s'entretient facilement. Une poche latérale garde télécommande et magazines près de vous.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>60 × 65 × 103 cm</td>\n</tr>\n<tr>\n<td>Largeur d'assise</td>\n<td>55 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs</td>\n<td>61 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>65 cm</td>\n</tr>\n<tr>\n<td>Repose-pieds déplié</td>\n<td>37 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : laissez environ 40 cm devant le fauteuil pour le repose-pieds et un peu d'espace derrière pour l'inclinaison.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu gris chiné</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Métal</td>\n</tr>\n<tr>\n<td>Commande</td>\n<td>Électrique, télécommande filaire</td>\n</tr>\n<tr>\n<td>Positions</td>\n<td>De 90° à 160°, réglage continu</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Intégré, électrique</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Poche latérale</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu à l'aspirateur, embout brosse. Nettoyez une tache localement avec une éponge légèrement humide, fauteuil débranché.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 22,5 kg.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment régler la position ?</strong><br>\nAvec la télécommande filaire, en continu de 90° à 160°.</p>\n<p><strong>2. Faut-il une prise électrique ?</strong><br>\nOui, le fauteuil est électrique : placez-le près d'une prise.</p>\n<p><strong>3. Convient-il à un petit salon ?</strong><br>\nOui, il mesure 60 cm de large et 65 cm de profondeur. Prévoyez environ 40 cm devant pour le repose-pieds.</p>\n<p><strong>4. L'assise est-elle confortable ?</strong><br>\nL'assise mesure 55 cm de large, rembourrée de mousse haute densité qui garde sa forme.</p>\n<p><strong>5. Abîme-t-il le sol ?</strong><br>\nNon, ses patins protecteurs préservent le sol des rayures.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil relax électrique compact, tissu gris | Bercelou", description:"Fauteuil relax électrique compact en tissu gris : télécommande filaire, positions de 90° à 160°, 60 cm de large, poche latérale. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax"]}) { product { id handle } userErrors { field message } }
  x28_p: productUpdate(product:{id:"gid://shopify/Product/16616075100505", title:"Grand fauteuil relax chenille crème, pivotant et à bascule", handle:"fauteuil-relax-large-chenille-creme", descriptionHtml:"<p><strong>Un fauteuil généreux où l'on s'enfonce le soir : il pivote, se balance et s'allonge d'un seul geste.</strong></p>\n<ul>\n<li>Assise large de 52 cm, dossier de 62 cm, accoudoirs de 20 cm</li>\n<li>Tirette latérale : dossier à 145° et repose-pieds en un geste</li>\n<li>Pivote à 360° et se balance doucement</li>\n<li>Chenille crème douce, deux poches latérales</li>\n</ul>\n<p>Ce grand fauteuil relax en chenille crème offre une assise enveloppante, taillée pour les longues soirées au salon ou dans la chambre.</p>\n<h3>Une assise généreuse</h3>\n<p>Avec 52 cm de largeur d'assise, un dossier haut de 62 cm et des accoudoirs larges de 20 cm, le corps entier trouve sa place.</p>\n<h3>Réglages et confort</h3>\n<p>La tirette latérale incline le dossier jusqu'à 145° et déplie en même temps le repose-pieds. Le fauteuil pivote à 360° et se balance doucement d'avant en arrière.</p>\n<h3>Un garnissage épais</h3>\n<p>Des ressorts ensachés et une mousse haute élasticité garnissent l'assise sur 20 cm et le dossier sur 22 cm, pour un soutien souple et durable.</p>\n<h3>Une matière douce et chaleureuse</h3>\n<p>La chenille crème, douce et respirante, habille tout le fauteuil. Elle apporte une note cocooning à un salon clair.</p>\n<h3>Tout à portée de main</h3>\n<p>Deux poches latérales de 35 × 28 cm gardent télécommandes et tablette à portée de main.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>95 × 94 × 104 cm</td>\n</tr>\n<tr>\n<td>Dimensions inclinées (L × P × H)</td>\n<td>95 × 162 × 83 cm</td>\n</tr>\n<tr>\n<td>Assise (L × P)</td>\n<td>52 × 56 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>51 cm</td>\n</tr>\n<tr>\n<td>Dossier (L × H)</td>\n<td>90 × 62 cm</td>\n</tr>\n<tr>\n<td>Épaisseur</td>\n<td>20 cm (assise), 22 cm (dossier)</td>\n</tr>\n<tr>\n<td>Accoudoirs (l × P × H)</td>\n<td>20 × 66 × 58 cm</td>\n</tr>\n<tr>\n<td>Poches latérales</td>\n<td>35 × 28 cm</td>\n</tr>\n<tr>\n<td>Distance au mur conseillée</td>\n<td>30 cm</td>\n</tr>\n<tr>\n<td>Taille conseillée</td>\n<td>jusqu'à 190 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : laissez 30 cm entre le dossier et le mur, et prévoyez 162 cm de profondeur pour l'inclinaison complète.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Chenille, 100 % polyester</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Ressorts ensachés, mousse haute élasticité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Métal et panneaux multiplis</td>\n</tr>\n<tr>\n<td>Mouvements</td>\n<td>Rotation 360°, bascule douce, inclinaison jusqu'à 145°</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Intégré, se déplie avec le dossier</td>\n</tr>\n<tr>\n<td>Rangements</td>\n<td>2 poches latérales</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Crème</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Simple, pièces à emboîter</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la chenille à l'aspirateur, embout brosse. Traitez une tache localement avec une éponge légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 86 × 66 × 48 cm pour 44 kg : prévoyez de l'aide pour le porter. Le montage est rapide, les éléments s'emboîtent.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le fauteuil est-il vraiment large ?</strong><br>\nL'assise mesure 52 cm de large pour 56 cm de profondeur, avec des accoudoirs de 20 cm.</p>\n<p><strong>2. Comment l'incliner ?</strong><br>\nTirez la tirette latérale : le dossier s'incline jusqu'à 145° et le repose-pieds se déplie.</p>\n<p><strong>3. Pivote-t-il et bascule-t-il ?</strong><br>\nOui, il tourne à 360° et se balance doucement.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\nIl mesure 95 × 94 cm au sol. Laissez 30 cm derrière le dossier et comptez 162 cm de profondeur incliné.</p>\n<p><strong>5. Pour quel gabarit est-il prévu ?</strong><br>\nPour les personnes jusqu'à 190 cm, et une charge de 150 kg.</p>\n<p><strong>6. Le montage est-il compliqué ?</strong><br>\nNon, la structure s'assemble simplement par emboîtement.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil relax large en chenille crème, pivotant | Bercelou", description:"Grand fauteuil relax en chenille crème : assise de 52 cm, pivotant, à bascule, inclinable à 145° avec repose-pieds, charge 150 kg. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax", "rocking-chair-repose-pieds"]}) { product { id handle } userErrors { field message } }
  x29_p: productUpdate(product:{id:"gid://shopify/Product/16616075133273", title:"Fauteuil relax manuel en tissu aspect lin gris clair", handle:"fauteuil-relax-manuel-lin-gris-clair", descriptionHtml:"<p><strong>Un fauteuil relax compact qui passe de la lecture à la sieste d'une simple poussée du dos.</strong></p>\n<ul>\n<li>Trois positions : lecture, télévision, sieste</li>\n<li>Repose-pieds intégré qui se déplie avec le dossier</li>\n<li>Dossier haut et coussins épais en mousse haute densité</li>\n<li>Montage en 15 minutes environ, outils fournis</li>\n</ul>\n<p>Ce fauteuil relax manuel en tissu aspect lin gris clair se glisse facilement dans un salon, une chambre ou un coin télévision.</p>\n<h3>Réglages et confort</h3>\n<p>Le mécanisme push-back s'actionne d'une poussée du dos : assise droite à 90° pour lire, 120° pour la télévision, 150° pour la sieste. Le repose-pieds se déplie avec le dossier.</p>\n<h3>Le dos bien soutenu</h3>\n<p>Le dossier haut, les coussins épais en mousse haute densité et les accoudoirs rembourrés accompagnent le dos et les épaules pendant les longues soirées.</p>\n<h3>Une matière douce et facile à vivre</h3>\n<p>Le tissu aspect lin, doux au toucher et respirant, se marie avec un intérieur contemporain comme classique.</p>\n<h3>Un format pensé pour les petits salons</h3>\n<p>Avec 72 cm de largeur et 65 cm de profondeur, il trouve sa place même dans une pièce compacte.</p>\n<h3>Tout à portée de main</h3>\n<p>Une poche latérale garde télécommande, livre ou tablette près de vous. Les patins antidérapants protègent vos sols.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>72 × 65 × 101 cm</td>\n</tr>\n<tr>\n<td>Longueur repose-pieds déplié</td>\n<td>157 cm</td>\n</tr>\n<tr>\n<td>Assise (L × P)</td>\n<td>49 × 56 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>64 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez environ 157 cm de longueur au sol pour la position sieste.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu aspect lin</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Métal et bois</td>\n</tr>\n<tr>\n<td>Mécanisme</td>\n<td>Push-back manuel, 90° / 120° / 150°</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Intégré</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Poche latérale</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris clair</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Environ 15 minutes, pièces numérotées, outils fournis</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu à l'aspirateur, embout brosse. Nettoyez une tache localement avec une éponge légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 75 × 66 × 54 cm pour 26 kg. Montage en 15 minutes environ, notice claire, pièces numérotées et outils fournis.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment passer d'une position à l'autre ?</strong><br>\nPoussez du dos : le fauteuil passe de 90° à 120° puis 150°, et le repose-pieds se déplie.</p>\n<p><strong>2. Le fauteuil est-il électrique ?</strong><br>\nNon, c'est un fauteuil relax manuel, sans branchement.</p>\n<p><strong>3. Convient-il à un petit salon ?</strong><br>\nOui, il mesure 72 cm de large pour 65 cm de profondeur en position assise.</p>\n<p><strong>4. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 136 kg.</p>\n<p><strong>5. Le montage est-il simple ?</strong><br>\nComptez environ 15 minutes : les pièces sont numérotées et les outils fournis.</p>\n<p><strong>6. Protège-t-il le sol ?</strong><br>\nOui, des patins antidérapants protègent tous les types de sols.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil relax manuel aspect lin gris clair | Bercelou", description:"Fauteuil relax manuel en tissu aspect lin gris clair : 3 positions, repose-pieds intégré, poche latérale, charge 136 kg. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax"]}) { product { id handle } userErrors { field message } }
  x30_p: productUpdate(product:{id:"gid://shopify/Product/16616075034969", title:"Fauteuil relax massant et chauffant en chenille écru", handle:"fauteuil-relax-massant-chauffant-chenille-ecru", descriptionHtml:"<p><strong>Pivotez, basculez, inclinez-vous : vibration et chaleur se règlent depuis la télécommande.</strong></p>\n<ul>\n<li>8 points de vibration et chauffage lombaire, à la télécommande</li>\n<li>Pivote à 360° et bascule doucement</li>\n<li>Dossier inclinable jusqu'à 155° par poignée</li>\n<li>Chenille écru chinée, deux poches latérales</li>\n</ul>\n<p>Un fauteuil relax enveloppant en chenille écru, qui réunit rotation, bascule douce, inclinaison et fonctions électriques de vibration et de chaleur.</p>\n<h3>Vibration et chaleur à la demande</h3>\n<p>Huit points de vibration sont répartis dans le dos, les lombaires, les cuisses et les jambes. La zone lombaire intègre une fonction chauffante. Tout se commande depuis la télécommande filaire : 3 modes et 3 intensités.</p>\n<h3>Réglages et confort</h3>\n<p>Une poignée intérieure incline le dossier jusqu'à 155°. Le fauteuil pivote à 360° et se balance doucement, pour trouver votre position sans vous relever.</p>\n<h3>Une assise épaisse et moelleuse</h3>\n<p>Des ressorts ensachés, une mousse épaisse et un rembourrage ouatiné garnissent le fauteuil : 13 cm d'épaisseur à l'assise, 23 cm au dossier.</p>\n<h3>Une matière douce et chaleureuse</h3>\n<p>La chenille écru chinée est douce au toucher et respirante. Elle réchauffe un salon clair ou un coin lecture.</p>\n<h3>Tout à portée de main</h3>\n<p>Deux poches latérales gardent la télécommande et votre téléphone près de vous.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>73,5 × 97 × 108 cm</td>\n</tr>\n<tr>\n<td>Dimensions inclinées (L × P × H)</td>\n<td>73,5 × 163 × 86 cm</td>\n</tr>\n<tr>\n<td>Assise (L × P)</td>\n<td>53 × 54 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Dossier (H × L)</td>\n<td>72 × 58 cm</td>\n</tr>\n<tr>\n<td>Accoudoirs (L × l)</td>\n<td>63 × 10 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs au-dessus de l'assise</td>\n<td>15,5 cm</td>\n</tr>\n<tr>\n<td>Épaisseur des coussins</td>\n<td>13 cm (assise), 23 cm (dossier)</td>\n</tr>\n<tr>\n<td>Inclinaison maximale</td>\n<td>155°</td>\n</tr>\n<tr>\n<td>Taille conseillée</td>\n<td>150 à 190 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez 163 cm de profondeur pour l'inclinaison complète et un peu d'espace autour pour la rotation.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Chenille, 100 % polyester</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Ressorts ensachés, mousse, ouate</td>\n</tr>\n<tr>\n<td>Fonctions électriques</td>\n<td>8 points de vibration, chauffage lombaire, 3 modes, 3 intensités</td>\n</tr>\n<tr>\n<td>Commande</td>\n<td>Télécommande filaire</td>\n</tr>\n<tr>\n<td>Alimentation</td>\n<td>Entrée 100-240 V, 50/60 Hz ; sortie 12 V, 12 W</td>\n</tr>\n<tr>\n<td>Mouvements</td>\n<td>Rotation 360°, bascule douce, inclinaison manuelle jusqu'à 155°</td>\n</tr>\n<tr>\n<td>Rangements</td>\n<td>2 poches latérales</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Écru chiné</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception, notice fournie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la chenille à l'aspirateur, embout brosse. Traitez une tache localement avec une éponge légèrement humide, fauteuil débranché.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 77 × 60 × 49 cm pour 43 kg : prévoyez de l'aide pour le porter. Le fauteuil est à assembler à réception, notice fournie.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment fonctionnent la vibration et la chaleur ?</strong><br>\nHuit points de vibration et une zone chauffante lombaire s'activent depuis la télécommande filaire, avec 3 modes et 3 intensités.</p>\n<p><strong>2. L'inclinaison est-elle électrique ?</strong><br>\nNon, le dossier s'incline à la main grâce à une poignée intérieure, jusqu'à 155°. La télécommande commande la vibration et la chaleur.</p>\n<p><strong>3. Faut-il une prise électrique ?</strong><br>\nOui, le fauteuil se branche sur secteur via son adaptateur (entrée 100-240 V). Placez-le près d'une prise.</p>\n<p><strong>4. Le fauteuil pivote-t-il et bascule-t-il ?</strong><br>\nOui, il tourne à 360° et se balance doucement.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\nIl mesure 73,5 × 97 cm au sol assis, et 163 cm de profondeur incliné.</p>\n<p><strong>6. Pour quelle taille est-il prévu ?</strong><br>\nPour les personnes de 150 à 190 cm, jusqu'à 150 kg.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil relax massant et chauffant, chenille | Bercelou", description:"Fauteuil relax en chenille écru : 8 points de vibration, chauffage lombaire, télécommande, pivotant et à bascule, inclinable à 155°. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax", "rocking-chair-repose-pieds"]}) { product { id handle } userErrors { field message } }
  x31_p: productUpdate(product:{id:"gid://shopify/Product/16616074969433", title:"Fauteuil relax pivotant en tissu beige, avec pouf", handle:"fauteuil-relax-pivotant-beige-avec-pouf", descriptionHtml:"<p><strong>Pivotez vers la fenêtre ou la conversation, posez les pieds sur le pouf : la détente se règle à votre envie.</strong></p>\n<ul>\n<li>Pivote à 360° sur un pied rond en acier chromé</li>\n<li>Dossier inclinable jusqu'à 135°</li>\n<li>Pouf repose-pieds assorti, réglable en hauteur (35 à 40 cm)</li>\n<li>Charge maximale : 150 kg pour le fauteuil, 50 kg pour le pouf</li>\n</ul>\n<p>Un fauteuil relax au dessin contemporain, livré avec son pouf. Assise, dossier et accoudoirs sont rembourrés de mousse haute densité pour épouser la forme du corps.</p>\n<h3>Réglages et confort</h3>\n<p>Le dossier s'incline jusqu'à 135° : droit pour lire, plus ouvert pour regarder un film ou faire une pause.</p>\n<h3>Il pivote avec vous</h3>\n<p>La base ronde en acier chromé tourne à 360°. Vous vous orientez vers la télévision, la fenêtre ou vos invités sans déplacer le fauteuil.</p>\n<h3>Les jambes posées, le dos soutenu</h3>\n<p>Le pouf assorti accueille vos jambes à 35 ou 40 cm du sol. L'assise rembourrée de 10 cm et le dossier de 11 cm restent moelleux et fermes.</p>\n<h3>Une matière facile à vivre</h3>\n<p>Le revêtement en tissu polyester beige s'accorde aux salons clairs et s'entretient simplement.</p>\n<h3>Une base stable et compacte</h3>\n<p>Le pied rond de 55 cm de diamètre assure la stabilité, pour un encombrement de 69 × 71 cm seulement.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fauteuil (L × P × H)</td>\n<td>69 × 71 × 104 cm</td>\n</tr>\n<tr>\n<td>Fauteuil incliné (L × P × H)</td>\n<td>69 × 93 × 97 cm</td>\n</tr>\n<tr>\n<td>Assise (L × P)</td>\n<td>47 × 47 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>45 cm</td>\n</tr>\n<tr>\n<td>Épaisseur de l'assise</td>\n<td>10 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>64 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du dossier</td>\n<td>11 cm</td>\n</tr>\n<tr>\n<td>Accoudoirs (L × l × H)</td>\n<td>30 × 12 × 15 cm</td>\n</tr>\n<tr>\n<td>Diamètre du pied</td>\n<td>55 cm</td>\n</tr>\n<tr>\n<td>Pouf (L × P × H)</td>\n<td>42 × 43 × 35 à 40 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg (fauteuil), 50 kg (pouf)</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez environ 93 cm de profondeur dossier incliné, plus la place du pouf devant le fauteuil.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu polyester</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Acier, pied rond chromé</td>\n</tr>\n<tr>\n<td>Rotation</td>\n<td>360°</td>\n</tr>\n<tr>\n<td>Inclinaison</td>\n<td>Jusqu'à 135°</td>\n</tr>\n<tr>\n<td>Pouf</td>\n<td>Inclus, hauteur réglable 35 ou 40 cm</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Beige</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg (fauteuil), 50 kg (pouf)</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage simple, notice illustrée fournie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu à l'aspirateur, embout brosse. Nettoyez une tache localement avec une éponge légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 77 × 56 × 39 cm pour 22 kg. Le fauteuil et le pouf se montent facilement grâce à la notice illustrée.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le pouf est-il inclus ?</strong><br>\nOui, le pouf repose-pieds assorti est livré avec le fauteuil.</p>\n<p><strong>2. Jusqu'où le dossier s'incline-t-il ?</strong><br>\nJusqu'à 135°, pour passer de la lecture à la détente.</p>\n<p><strong>3. Le fauteuil pivote-t-il ?</strong><br>\nOui, il tourne à 360° sur son pied rond en acier chromé.</p>\n<p><strong>4. Quelle est la hauteur d'assise ?</strong><br>\nL'assise est à 45 cm du sol, pour 47 × 47 cm de surface.</p>\n<p><strong>5. Quel poids supporte-t-il ?</strong><br>\n150 kg pour le fauteuil et 50 kg pour le pouf.</p>\n<p><strong>6. Quelle place prévoir ?</strong><br>\nLe fauteuil occupe 69 × 71 cm au sol. Prévoyez environ 93 cm de profondeur dossier incliné, et la place du pouf.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil relax pivotant beige et son pouf | Bercelou", description:"Fauteuil relax pivotant en tissu beige avec pouf assorti : dossier inclinable jusqu'à 135°, rotation 360°, charge 150 kg. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax"]}) { product { id handle } userErrors { field message } }
  x32_p: productUpdate(product:{id:"gid://shopify/Product/16616075166041", title:"Fauteuil relax push-back en tissu côtelé, repose-pieds", handle:"fauteuil-relax-push-back-cotele", descriptionHtml:"<p><strong>De l'assise droite à la sieste allongée, le fauteuil suit votre soirée d'une simple poussée du dos.</strong></p>\n<ul>\n<li>Inclinaison réglable de 90° à 160°</li>\n<li>Repose-pieds intégré, dossier rembourré</li>\n<li>Tissu côtelé en crème ou gris ardoise</li>\n<li>Charge maximale 150 kg, poches latérales</li>\n</ul>\n<p>Un fauteuil relax au format compact, habillé d'un tissu côtelé doux, pour le salon, la chambre ou le coin lecture.</p>\n<h3>Réglages et confort</h3>\n<p>Le mécanisme push-back règle l'inclinaison de 90° à 160° : droit pour lire, incliné pour un film, presque allongé pour une sieste.</p>\n<h3>Le dos soutenu, les jambes relevées</h3>\n<p>Le dossier rembourré accompagne le dos et la nuque. Le repose-pieds intégré se déplie pour allonger les jambes.</p>\n<h3>Une matière douce, deux coloris</h3>\n<p>Le tissu côtelé se choisit en crème, lumineux et chaleureux, ou en gris ardoise, plus graphique.</p>\n<h3>Tout à portée de main</h3>\n<p>Des poches latérales gardent télécommande, magazines ou téléphone près de vous. Les patins antidérapants tiennent sur tapis comme sur parquet.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>60 × 73 × 97 cm</td>\n</tr>\n<tr>\n<td>Longueur déplié</td>\n<td>155 cm</td>\n</tr>\n<tr>\n<td>Hauteur déplié</td>\n<td>75 cm</td>\n</tr>\n<tr>\n<td>Largeur d'assise</td>\n<td>44 cm</td>\n</tr>\n<tr>\n<td>Largeur du dossier</td>\n<td>54 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 155 cm de longueur au sol en position allongée.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu côtelé, 100 % polyester</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Fer et panneaux</td>\n</tr>\n<tr>\n<td>Inclinaison</td>\n<td>De 90° à 160°, push-back manuel</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Intégré</td>\n</tr>\n<tr>\n<td>Rangements</td>\n<td>Poches latérales</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Crème, gris ardoise</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu côtelé à l'aspirateur, embout brosse, dans le sens des côtes. Traitez une tache localement avec une éponge légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 24,5 kg. Le fauteuil est à assembler à réception.</p>\n<h2>FAQ</h2>\n<p><strong>1. Jusqu'où le fauteuil s'incline-t-il ?</strong><br>\nDe 90° à 160°, d'une simple poussée du dos.</p>\n<p><strong>2. Quels coloris sont disponibles ?</strong><br>\nCrème et gris ardoise, en tissu côtelé.</p>\n<p><strong>3. Quelle place prévoir ?</strong><br>\nIl mesure 60 × 73 cm au sol. Comptez 155 cm de longueur en position allongée.</p>\n<p><strong>4. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 150 kg.</p>\n<p><strong>5. Abîme-t-il le sol ?</strong><br>\nNon, ses patins antidérapants protègent tapis et parquets.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil relax côtelé avec repose-pieds | Bercelou", description:"Fauteuil relax push-back en tissu côtelé crème ou gris ardoise : inclinable de 90° à 160°, repose-pieds, poches latérales, 150 kg. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax"]}) { product { id handle } userErrors { field message } }
  x33_p: productUpdate(product:{id:"gid://shopify/Product/16616075886937", title:"Fauteuil suspendu sur pied en tissu imperméable, pliable", handle:"fauteuil-suspendu-tissu-sur-pied", descriptionHtml:"<p><strong>Une nacelle souple qui se balance au fil de la lecture, puis se replie à la fin de la saison.</strong></p>\n<ul>\n<li>Coque et coussin en polyester imperméable, appui-tête inclus</li>\n<li>Structure en acier, pied intégré, sans perçage</li>\n<li>Mécanisme de pliage pour ranger et déplacer facilement</li>\n<li>4 coloris : brun café, taupe, beige sable, anthracite</li>\n</ul>\n<p>Un fauteuil suspendu en forme de nacelle, avec son pied intégré, pour le salon, le balcon, la terrasse ou le jardin.</p>\n<h3>Une bascule douce</h3>\n<p>La nacelle suspendue par chaîne se balance doucement, pour lire, rêver ou se détendre.</p>\n<h3>On s'y love</h3>\n<p>La coque souple, garnie d'un coussin de confort et d'un appui-tête, épouse le dos et invite à rester.</p>\n<h3>Rangé en un instant</h3>\n<p>Le mécanisme de pliage permet de replier le fauteuil pour l'hiver ou de le déplacer facilement, idéal dans un petit appartement.</p>\n<h3>Une matière facile à vivre</h3>\n<p>Le revêtement en polyester est résistant, souple et imperméable. Un chiffon humide suffit à l'entretenir.</p>\n<h3>Quatre coloris doux</h3>\n<p>Brun café, taupe, beige sable ou anthracite : choisissez la teinte qui s'accorde à votre terrasse ou votre salon.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (l × P × H)</td>\n<td>94 × 107 × 196,5 cm</td>\n</tr>\n<tr>\n<td>Emprise du pied (P × l)</td>\n<td>108 × 94 cm</td>\n</tr>\n<tr>\n<td>Hauteur totale</td>\n<td>197 cm</td>\n</tr>\n<tr>\n<td>Assise (l × P)</td>\n<td>71 × 52 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez un emplacement d'environ 1,10 × 1 m et 2 m de hauteur sous plafond.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Structure</td>\n<td>Acier, pied intégré</td>\n</tr>\n<tr>\n<td>Coque et coussin</td>\n<td>Polyester imperméable</td>\n</tr>\n<tr>\n<td>Coussin</td>\n<td>Coussin de confort et appui-tête inclus</td>\n</tr>\n<tr>\n<td>Pliable</td>\n<td>Oui</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Salon, balcon, terrasse, jardin</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Brun café, taupe, beige sable, anthracite</td>\n</tr>\n<tr>\n<td>Contenu</td>\n<td>Structure, revêtement, coussin, chaînes de suspension, visserie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Nettoyez la coque et le coussin avec un chiffon humide. Pour un usage prolongé dehors, protégez le fauteuil d'une housse par temps de pluie ou de fort soleil.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 115 × 59 × 24 cm pour 21,6 kg. Livré complet avec la structure, le revêtement, le coussin, les chaînes et la visserie.</p>\n<h2>FAQ</h2>\n<p><strong>1. Faut-il le fixer au plafond ?</strong><br>\nNon, il est suspendu à son propre pied en acier.</p>\n<p><strong>2. Peut-il rester dehors ?</strong><br>\nSon revêtement est imperméable. Protégez-le d'une housse en cas de pluie ou de fort soleil prolongé.</p>\n<p><strong>3. Se range-t-il facilement ?</strong><br>\nOui, son mécanisme de pliage permet de le replier et de le déplacer.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\nLe pied occupe 108 × 94 cm au sol pour 197 cm de haut.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nBrun café, taupe, beige sable et anthracite.</p>\n<p><strong>6. Comment l'entretenir ?</strong><br>\nUn chiffon humide suffit pour la coque et le coussin.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil suspendu sur pied en tissu, pliable | Bercelou", description:"Fauteuil suspendu sur pied, coque et coussin en polyester imperméable, structure acier pliable, 4 coloris doux. Livraison offerte."}, productType:"Fauteuil cocon", vendor:"Bercelou", tags:["fauteuil-cocon", "fauteuil-relax-jardin"]}) { product { id handle } userErrors { field message } }

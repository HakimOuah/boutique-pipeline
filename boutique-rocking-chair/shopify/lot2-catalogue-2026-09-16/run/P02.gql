  x17_p: productUpdate(product:{id:"gid://shopify/Product/16616085061977", title:"Fauteuil enfant en velours rose avec pouf assorti", handle:"fauteuil-enfant-velours-rose-pouf", descriptionHtml:"<p><strong>Son fauteuil et son repose-pieds, comme celui des grands, pour lire au calme dans sa chambre.</strong></p>\n<ul>\n<li>Fauteuil et pouf assorti, en velours rose poudré</li>\n<li>Cadre en bois d'eucalyptus massif</li>\n<li>De 3 à 5 ans, charge jusqu'à 45 kg</li>\n<li>Seuls les quatre pieds sont à visser</li>\n</ul>\n<h3>Un fauteuil à sa taille</h3>\n<p>L'assise est à 27,5 cm du sol, pour les enfants de 3 à 5 ans. Votre enfant s'y installe seul, les pieds posés sur son pouf.</p>\n<h3>Comme les grands</h3>\n<p>Le pouf assorti de 35 × 30 cm prolonge le fauteuil : l'enfant allonge les jambes pour regarder un livre ou un dessin animé.</p>\n<h3>Tout doux</h3>\n<p>Le rembourrage extra épais est recouvert d'un tissu aspect velours, doux au toucher, avec un dossier arrondi et capitonné.</p>\n<h3>Il s'accorde à la chambre</h3>\n<p>Rose poudré et pieds en bois clair : une touche douce et minimaliste dans la chambre d'enfant.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fauteuil (largeur × profondeur × hauteur)</td>\n<td>51 × 51 × 50 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>27,5 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>34 × 36,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>22 cm</td>\n</tr>\n<tr>\n<td>Pouf (longueur × largeur × hauteur)</td>\n<td>35 × 30 × 25 cm</td>\n</tr>\n<tr>\n<td>Âge conseillé</td>\n<td>De 3 à 5 ans</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>45 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>52 × 52 × 38 cm, 8,4 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez environ 55 × 90 cm au sol avec le pouf placé devant le fauteuil.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu aspect velours</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse, rembourrage extra épais</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois d'eucalyptus massif</td>\n</tr>\n<tr>\n<td>Ensemble</td>\n<td>Fauteuil et pouf assorti</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>45 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Quatre pieds à visser</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Rose poudré</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le velours à l'aspirateur, embout tissu. Une tache se traite localement avec un chiffon légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Seuls les pieds sont à visser à réception.</p>\n<h2>FAQ</h2>\n<p><strong>1. À partir de quel âge ?</strong><br>\nIl est conseillé de 3 à 5 ans.</p>\n<p><strong>2. Le pouf est-il inclus ?</strong><br>\nOui, le pouf assorti de 35 × 30 × 25 cm est livré avec le fauteuil.</p>\n<p><strong>3. Quelle charge supporte le fauteuil ?</strong><br>\nJusqu'à 45 kg.</p>\n<p><strong>4. Faut-il le monter ?</strong><br>\nSeuls les quatre pieds sont à visser.</p>\n<p><strong>5. Le fauteuil se balance-t-il ?</strong><br>\nNon, il repose sur quatre pieds fixes en bois.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil enfant velours rose avec pouf | Bercelou", description:"Fauteuil enfant en velours rose poudré avec pouf assorti, cadre en eucalyptus massif, de 3 à 5 ans, charge 45 kg. Livraison offerte en France."}, productType:"Fauteuil enfant", vendor:"Bercelou", tags:["rocking-chair-enfant"]}) { product { id handle } userErrors { field message } }
  x18_p: productUpdate(product:{id:"gid://shopify/Product/16616075329881", title:"Fauteuil lounge moelleux en tissu côtelé, avec pouf", handle:"fauteuil-lounge-cotele-avec-pouf", descriptionHtml:"<p><strong>On s'y enfonce, on pose les pieds sur le pouf : le coin lecture le plus douillet du salon.</strong></p>\n<ul>\n<li>Fauteuil garni et pouf assorti, livrés ensemble</li>\n<li>Flanelle côtelée douce, garnissage épais en coton PP</li>\n<li>Dossier incurvé qui enveloppe le dos</li>\n<li>5 coloris doux : crème, gris, vert sauge, rose poudré, bleu nuit</li>\n</ul>\n<p>Un fauteuil lounge généreux, capitonné de flanelle côtelée, accompagné de son pouf. Il crée en un instant un coin lecture ou un coin sieste.</p>\n<h3>Un coin lecture en un instant</h3>\n<p>Installez-vous, posez les pieds sur le pouf, attrapez votre livre dans la poche latérale : la soirée commence.</p>\n<h3>Une assise moelleuse et enveloppante</h3>\n<p>Le garnissage épais en coton PP reste gonflé et moelleux. Le dossier incurvé épouse la courbe du dos.</p>\n<h3>Une matière douce au toucher</h3>\n<p>La flanelle côtelée est douce et résistante à l'usage quotidien. Cinq coloris doux s'accordent à tous les intérieurs.</p>\n<h3>Une structure stable</h3>\n<p>Le cadre en acier thermolaqué, renforcé d'un tube central, porte jusqu'à 113 kg. Les embouts antidérapants protègent le sol.</p>\n<h3>Un pouf, trois usages</h3>\n<p>Le pouf sert de repose-pieds, de siège d'appoint pour un invité ou de petite assise près du fauteuil.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fauteuil (L × P × H)</td>\n<td>80 × 64 × 95 cm</td>\n</tr>\n<tr>\n<td>Largeur du piètement</td>\n<td>70 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>51 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs</td>\n<td>65 cm</td>\n</tr>\n<tr>\n<td>Assise (L × P)</td>\n<td>45 × 60 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier au-dessus de l'assise</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Pouf (L × P × H)</td>\n<td>50 × 45 × 46 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>113 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez environ 1,20 m de profondeur pour le fauteuil et le pouf placés l'un devant l'autre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Flanelle côtelée</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Coton PP</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Acier thermolaqué, tube central de renfort</td>\n</tr>\n<tr>\n<td>Pouf</td>\n<td>Inclus</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Poche latérale</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Crème, gris, vert sauge, rose poudré, bleu nuit</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>113 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la flanelle à l'aspirateur, embout brosse, dans le sens des côtes. Traitez une tache localement avec une éponge légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis plat de 77,5 × 66 × 19 cm pour environ 16 kg. Le fauteuil et le pouf sont à assembler à réception.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le pouf est-il inclus ?</strong><br>\nOui, le pouf assorti est livré avec le fauteuil.</p>\n<p><strong>2. Le fauteuil s'incline-t-il ?</strong><br>\nNon, c'est un fauteuil lounge fixe au dossier incurvé, pensé pour se lover.</p>\n<p><strong>3. Quelle est la hauteur d'assise ?</strong><br>\nL'assise est à 51 cm du sol, les accoudoirs à 65 cm.</p>\n<p><strong>4. Quels coloris sont disponibles ?</strong><br>\nCrème, gris, vert sauge, rose poudré et bleu nuit.</p>\n<p><strong>5. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 113 kg.</p>\n<p><strong>6. Quelle place prévoir ?</strong><br>\nLe fauteuil mesure 80 cm de large et 64 cm de profondeur. Ajoutez le pouf de 45 cm devant.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil lounge côtelé moelleux et son pouf | Bercelou", description:"Fauteuil lounge moelleux en flanelle côtelée avec pouf assorti : dossier enveloppant, poche latérale, 5 coloris doux. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax"]}) { product { id handle } userErrors { field message } }
  x19_p: productUpdate(product:{id:"gid://shopify/Product/16616075821401", title:"Fauteuil œuf suspendu sur pied, rotin gris ou noir", handle:"fauteuil-oeuf-suspendu-rotin-gris", descriptionHtml:"<p><strong>Un cocon qui se balance doucement, posé où vous voulez, sans percer le plafond.</strong></p>\n<ul>\n<li>Pied en acier galvanisé, aucun perçage nécessaire</li>\n<li>Balancement à 360° grâce au ressort de suspension</li>\n<li>Hauteur d'assise réglable par deux chaînes</li>\n<li>Coussin et appui-tête déhoussables, tissu imperméable</li>\n</ul>\n<p>Un fauteuil œuf en rotin PE suspendu à son propre pied, pour le salon, le bureau, le balcon ou le jardin.</p>\n<h3>Une bascule douce</h3>\n<p>Le ressort de suspension offre un balancement doux dans toutes les directions : pour s'asseoir, s'allonger ou se bercer.</p>\n<h3>On s'y love</h3>\n<p>La coque en rotin PE tressé épouse le corps. Le coussin et l'appui-tête garnis de coton PP ajoutent du moelleux.</p>\n<h3>Posé où vous voulez</h3>\n<p>Le pied à quatre branches en tubes d'acier galvanisé de 42 mm, avec patins antidérapants, se passe de tout perçage.</p>\n<h3>Réglé à votre hauteur</h3>\n<p>Deux chaînes métalliques antirouille ajustent la hauteur de la nacelle.</p>\n<h3>Une matière facile à vivre</h3>\n<p>Les housses en polyester imperméable se retirent et se lavent.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Nacelle (l × H)</td>\n<td>90 × 107 cm</td>\n</tr>\n<tr>\n<td>Pied (l × P × H)</td>\n<td>105 × 105 × 195 cm</td>\n</tr>\n<tr>\n<td>Diamètre des tubes</td>\n<td>42 mm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez un carré d'au moins 1,10 m de côté et 2 m de hauteur sous plafond.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Nacelle</td>\n<td>Rotin PE tressé</td>\n</tr>\n<tr>\n<td>Pied</td>\n<td>Acier galvanisé, 4 branches, patins antidérapants</td>\n</tr>\n<tr>\n<td>Suspension</td>\n<td>Ressort et chaînes réglables</td>\n</tr>\n<tr>\n<td>Coussins</td>\n<td>Coussin d'assise et appui-tête, coton PP</td>\n</tr>\n<tr>\n<td>Housses</td>\n<td>Polyester imperméable, amovibles et lavables</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Intérieur et extérieur</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris, noir</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Retirez les housses pour les laver. Essuyez le rotin PE avec un chiffon humide et rentrez les coussins par temps de pluie.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 116 × 58 × 22 cm pour 21 kg.</p>\n<h2>FAQ</h2>\n<p><strong>1. Faut-il percer le plafond ?</strong><br>\nNon, le fauteuil est suspendu à son propre pied en acier.</p>\n<p><strong>2. Quelle place prévoir ?</strong><br>\nLe pied mesure 105 × 105 cm au sol pour 195 cm de haut. Prévoyez 2 m sous plafond.</p>\n<p><strong>3. Peut-on régler la hauteur ?</strong><br>\nOui, grâce aux deux chaînes de suspension.</p>\n<p><strong>4. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 150 kg.</p>\n<p><strong>5. Les coussins sont-ils lavables ?</strong><br>\nOui, les housses imperméables se retirent et se lavent.</p>\n<p><strong>6. Quels coloris sont disponibles ?</strong><br>\nGris ou noir.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil œuf suspendu sur pied, rotin gris | Bercelou", description:"Fauteuil œuf suspendu sur pied, sans perçage : rotin PE, coussins déhoussables imperméables, hauteur réglable, charge 150 kg. Livraison offerte."}, productType:"Fauteuil cocon", vendor:"Bercelou", tags:["fauteuil-cocon"]}) { product { id handle } userErrors { field message } }
  x20_p: productUpdate(product:{id:"gid://shopify/Product/16616075755865", title:"Fauteuil papasan pivotant en résine tressée, coussin crème", handle:"fauteuil-papasan-pivotant-jardin-creme", descriptionHtml:"<p><strong>Un nid rond où l'on se love, qui tourne vers le soleil ou la conversation.</strong></p>\n<ul>\n<li>Pivote à 360° sur une base tressée stable</li>\n<li>Grand coussin crème capitonné, housse déhoussable</li>\n<li>Résine tressée effet rotin, résistante aux UV et à la pluie</li>\n<li>Charge maximale 160 kg</li>\n</ul>\n<p>Un fauteuil papasan au style rétro revisité, pour la terrasse, le balcon, la véranda ou le salon.</p>\n<h3>On s'y love à plusieurs</h3>\n<p>Sa large coque ronde accueille un adulte en tailleur, ou un parent et un enfant pour une histoire.</p>\n<h3>Il pivote avec vous</h3>\n<p>Le fauteuil tourne à 360° pour suivre le soleil ou la conversation. Ses patins antidérapants le gardent stable pendant la rotation.</p>\n<h3>Une matière douce au toucher</h3>\n<p>Le grand coussin capitonné est garni de mousse et recouvert d'une housse en polyester de 220 g/m², déhoussable. Des liens le maintiennent en place.</p>\n<h3>Sur la terrasse</h3>\n<p>La résine tressée effet rotin résiste aux UV et à la pluie, sans entretien particulier.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × l × H)</td>\n<td>97 × 87 × 90 cm</td>\n</tr>\n<tr>\n<td>Assise (l)</td>\n<td>92 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>160 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez un cercle d'environ 1 m de diamètre pour la rotation.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Structure</td>\n<td>Métal époxy</td>\n</tr>\n<tr>\n<td>Tressage</td>\n<td>Résine PE effet rotin, gris</td>\n</tr>\n<tr>\n<td>Coussin</td>\n<td>Mousse, housse polyester 220 g/m², déhoussable, liens de fixation</td>\n</tr>\n<tr>\n<td>Rotation</td>\n<td>360°</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Intérieur et extérieur</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Coussin crème</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>160 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception, notice fournie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la résine tressée avec une brosse douce ou un chiffon humide. Retirez la housse du coussin pour la nettoyer et rentrez le coussin par temps de pluie.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 74 × 63 × 47 cm pour 17 kg. Le fauteuil est à assembler à réception, notice fournie.</p>\n<h2>FAQ</h2>\n<p><strong>1. Peut-il rester dehors ?</strong><br>\nLa résine tressée résiste aux UV et à la pluie. Rentrez le coussin par mauvais temps pour le garder beau.</p>\n<p><strong>2. Le fauteuil pivote-t-il ?</strong><br>\nOui, à 360°, avec des patins antidérapants pour rester stable.</p>\n<p><strong>3. La housse est-elle lavable ?</strong><br>\nElle est déhoussable, ce qui facilite son entretien.</p>\n<p><strong>4. Peut-on s'y installer à deux ?</strong><br>\nSa coque large accueille un adulte et un enfant, dans la limite de 160 kg.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\nIl mesure 97 × 87 cm : comptez environ 1 m de diamètre pour tourner librement.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil papasan pivotant, coussin crème | Bercelou", description:"Fauteuil papasan pivotant à 360° en résine tressée effet rotin, grand coussin crème déhoussable, intérieur et extérieur, 160 kg. Livraison offerte."}, productType:"Fauteuil cocon", vendor:"Bercelou", tags:["fauteuil-relax-jardin", "fauteuil-cocon"]}) { product { id handle } userErrors { field message } }
  x21_p: productUpdate(product:{id:"gid://shopify/Product/16616092926297", title:"Fauteuil pivotant 360° en bouclette, dossier sculpté", handle:"fauteuil-pivotant-360-bouclette", descriptionHtml:"<p><strong>Il tourne d'un geste vers le berceau, la fenêtre ou le canapé : le fauteuil qui suit vos moments calmes.</strong></p>\n<ul>\n<li>Pivote à 360° sur une base ronde de 48 cm</li>\n<li>Assise généreuse de 53 × 46 cm, à 44 cm du sol</li>\n<li>Bouclette douce, dossier sculpté ajouré</li>\n<li>Charge jusqu'à 150 kg, 5 coloris</li>\n</ul>\n<h3>Il tourne avec vous</h3>\n<p>Le fauteuil pivote à 360° : tournez-vous vers le berceau, la table de chevet ou la fenêtre sans vous lever. Pratique pendant une tétée, quand tout doit rester à portée.</p>\n<h3>Se relever en douceur</h3>\n<p>L'assise est à 44 cm du sol, une hauteur de chaise. Pour vous relever, pivotez face à l'espace libre, avancez-vous et prenez appui sur les accoudoirs rembourrés, à 57 cm du sol.</p>\n<h3>Une assise enveloppante</h3>\n<p>Le coussin d'assise de 20 cm d'épaisseur repose sur des ressorts en S et une mousse qui garde sa forme. Le dossier arrondi et les accoudoirs forment un cocon autour de vous.</p>\n<h3>Une matière douce et facile à vivre</h3>\n<p>La bouclette, douce au toucher et résistante à l'usure, habille tout le fauteuil, base comprise. Une brosse à poils souples suffit pour la dépoussiérer.</p>\n<h3>Il reste au salon après bébé</h3>\n<p>Un dossier sculpté en deux arches, une base ronde : ce fauteuil est une pièce de design pour le salon, la chambre ou le coin lecture.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>74 cm</td>\n</tr>\n<tr>\n<td>Largeur</td>\n<td>67 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>55 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>44 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>53 × 46 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier (depuis l'assise)</td>\n<td>30 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs (sol)</td>\n<td>57 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du coussin d'assise</td>\n<td>20 cm</td>\n</tr>\n<tr>\n<td>Diamètre de la base</td>\n<td>48 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Poids du fauteuil</td>\n<td>14,4 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>70 × 57 × 52 cm, 16,4 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez un cercle d'environ 80 cm de diamètre pour faire pivoter le fauteuil librement.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Bouclette</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse, ressorts en S</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois massif d'hévéa, contreplaqué, base en métal</td>\n</tr>\n<tr>\n<td>Rotation</td>\n<td>360°</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Rembourrés, sur cadre en fer</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception</td>\n</tr>\n<tr>\n<td>Coloris disponibles</td>\n<td>Blanc cassé, gris anthracite, ocre, terracotta, vert olive</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la bouclette avec une brosse à poils souples. Une tache se traite localement avec un chiffon légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à monter.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le fauteuil bascule-t-il ?</strong><br>\nNon, il pivote à 360° sur sa base ronde, sans bascule. Il reste stable pour s'asseoir et se relever.</p>\n<p><strong>2. Convient-il pour allaiter ?</strong><br>\nOui, pour se tourner vers le berceau et garder tout à portée. Son dossier enveloppant de 30 cm soutient le bas et le milieu du dos : ajoutez un coussin pour caler la nuque.</p>\n<p><strong>3. Quelle est la hauteur d'assise ?</strong><br>\n44 cm du sol, avec des accoudoirs à 57 cm pour prendre appui.</p>\n<p><strong>4. Quelle charge supporte-t-il ?</strong><br>\nJusqu'à 150 kg.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nBlanc cassé, gris anthracite, ocre, terracotta et vert olive, tous en bouclette.</p>\n<p><strong>6. Comment l'entretenir ?</strong><br>\nUne brosse à poils souples retire la poussière. Traitez une tache localement avec un chiffon légèrement humide.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil pivotant 360° en bouclette | Bercelou", description:"Fauteuil pivotant à 360° en bouclette, dossier sculpté ajouré, assise à 44 cm du sol, charge 150 kg. 5 coloris. Livraison offerte en France."}, productType:"Fauteuil d'allaitement", vendor:"Bercelou", tags:["fauteuil-allaitement"]}) { product { id handle } userErrors { field message } }
  x22_p: productUpdate(product:{id:"gid://shopify/Product/16616057307481", title:"Fauteuil pouf matelassé en bouclette sherpa", handle:"fauteuil-pouf-bouclette-sherpa-matelasse", descriptionHtml:"<p><strong>Un fauteuil bas tout en plis moelleux, pour s'enfoncer avec un livre au coin du salon.</strong></p>\n<ul>\n<li>Bouclette sherpa douce, surpiqûres matelassées</li>\n<li>Assise basse à 37,5 cm, dossier de 51 cm</li>\n<li>Base antidérapante, aucun montage</li>\n<li>Beige crème ou rose poudré</li>\n</ul>\n<h3>Un coin lecture qui enveloppe</h3>\n<p>Ses plis matelassés accueillent le dos et les jambes. On s'y installe à demi allongé, un livre ou une tasse à la main.</p>\n<h3>La bouclette qui réchauffe la pièce</h3>\n<p>La bouclette sherpa, douce au toucher, apporte la même chaleur que nos fauteuils teddy. Beige crème pour la lumière, rose poudré pour une chambre douce.</p>\n<h3>Une assise basse et généreuse</h3>\n<p>L'assise est à 37,5 cm du sol et le dossier monte à 51 cm : une posture détendue, idéale pour lire ou se poser.</p>\n<h3>Stable, sans outils</h3>\n<p>La base antidérapante le garde en place. Le fauteuil arrive prêt à l'emploi, sans montage.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>86 cm</td>\n</tr>\n<tr>\n<td>Hauteur totale</td>\n<td>75 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>37,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>51 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>100 × 30 × 29 cm, 12,8 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 90 cm de large et environ un mètre de profondeur pour allonger les jambes.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Bouclette sherpa</td>\n</tr>\n<tr>\n<td>Finition</td>\n<td>Surpiqûres matelassées</td>\n</tr>\n<tr>\n<td>Base</td>\n<td>Antidérapante</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Aucun</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Beige crème, rose poudré</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la bouclette à l'aspirateur, embout tissu, et aérez-la d'une brosse douce. Une tache se traite localement à l'eau tiède, en tamponnant.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive prêt à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. Faut-il le monter ?</strong><br>\nNon, il arrive prêt à l'emploi.</p>\n<p><strong>2. Est-il bas ?</strong><br>\nOui, l'assise est à 37,5 cm du sol, pour une posture détendue.</p>\n<p><strong>3. La bouclette est-elle douce ?</strong><br>\nOui, la bouclette sherpa est moelleuse au toucher.</p>\n<p><strong>4. Glisse-t-il au sol ?</strong><br>\nSa base antidérapante le garde en place.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nBeige crème et rose poudré.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil pouf matelassé en bouclette sherpa | Bercelou", description:"Fauteuil pouf bas matelassé en bouclette sherpa, assise à 37,5 cm, 86 cm de large, base antidérapante, sans montage. Beige ou rose poudré."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf-poire", "pouf"]}) { product { id handle } userErrors { field message } }
  x23_p: productUpdate(product:{id:"gid://shopify/Product/16616057241945", title:"Fauteuil pouf en fausse fourrure gris clair", handle:"fauteuil-pouf-fausse-fourrure-gris-clair", descriptionHtml:"<p><strong>Un fauteuil pouf enveloppant, avec dossier et accoudoirs, pour les soirées sous le plaid.</strong></p>\n<ul>\n<li>Dossier et accoudoirs qui enveloppent le dos et les bras</li>\n<li>Fausse fourrure gris clair, très douce</li>\n<li>Mousse haute densité, soutien stable</li>\n<li>Housse amovible, lavable, qui résiste aux taches</li>\n</ul>\n<h3>Les bras posés, le dos calé</h3>\n<p>Ses accoudoirs arrondis et son dossier enveloppent le corps. On s'y installe pour lire, regarder un film ou se poser.</p>\n<h3>Une fourrure douce comme un lapin</h3>\n<p>La fausse fourrure gris clair apporte une douceur immédiate et une lumière calme au salon ou à la chambre.</p>\n<h3>Un soutien qui ne s'affaisse pas</h3>\n<p>La mousse haute densité garde le fauteuil en forme et soutient le dos sur la durée.</p>\n<h3>Une housse qui se lave</h3>\n<p>La housse se retire et se lave. Elle résiste aux petites taches du quotidien.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>99 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>71 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>90 × 40 × 10 cm, 19,2 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez un mètre de large dans le coin prévu, et un peu d'espace devant pour allonger les jambes.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Fausse fourrure de lapin</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Housse</td>\n<td>Amovible, lavable, anti-taches</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Oui</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris clair</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Retirez la housse pour la laver. Entre deux lavages, brossez la fourrure en douceur pour lui garder son gonflant.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le fauteuil a-t-il des accoudoirs ?</strong><br>\nOui, des accoudoirs arrondis et un dossier qui enveloppent le corps.</p>\n<p><strong>2. La housse se retire-t-elle ?</strong><br>\nOui, elle est amovible et lavable.</p>\n<p><strong>3. Quelle place faut-il prévoir ?</strong><br>\nIl mesure 99 cm de large pour 71 cm de haut.</p>\n<p><strong>4. Est-il ferme ?</strong><br>\nSa mousse haute densité offre un soutien stable, moelleux en surface.</p>\n<p><strong>5. Convient-il à une chambre d'enfant ?</strong><br>\nIl trouve sa place dans une chambre comme au salon, pour lire ou se détendre.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil pouf en fausse fourrure gris clair | Bercelou", description:"Fauteuil pouf en fausse fourrure gris clair avec accoudoirs, mousse haute densité, housse amovible lavable. 99 cm de large. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf-poire", "pouf"]}) { product { id handle } userErrors { field message } }
  x24_p: productUpdate(product:{id:"gid://shopify/Product/16616057274713", title:"Grand fauteuil pouf en fausse fourrure, dossier arrondi", handle:"fauteuil-pouf-fourrure-dossier-arrondi", descriptionHtml:"<p><strong>Un fauteuil pouf généreux, sans montage, où l'on se love le dos bien soutenu.</strong></p>\n<ul>\n<li>Grand format : 123 cm de large, 111 cm de profondeur</li>\n<li>Dossier arrondi en côtes qui soutient le dos</li>\n<li>Assise à 41 cm du sol, charge jusqu'à 180 kg</li>\n<li>Fausse fourrure moelleuse, gris anthracite ou crème</li>\n</ul>\n<h3>Un dossier qui vous enveloppe</h3>\n<p>Les côtes arrondies du dossier épousent le dos et les épaules. On s'y installe pour lire, regarder un film ou se reposer.</p>\n<h3>Une assise à bonne hauteur</h3>\n<p>L'assise se trouve à 41 cm du sol : on s'y assoit et on s'en relève plus facilement que d'un pouf posé au ras du sol.</p>\n<h3>Une mousse qui tient la forme</h3>\n<p>Le garnissage en mousse haute densité garde sa tenue et soutient le corps, même pour un grand gabarit : charge jusqu'à 180 kg.</p>\n<h3>Une fourrure douce, deux teintes</h3>\n<p>La fausse fourrure, lisse et moelleuse, réchauffe le salon. Gris anthracite ou crème selon votre intérieur.</p>\n<h3>Aucun montage</h3>\n<p>Le fauteuil arrive déjà garni. Poignée de transport et dessous antidérapant facilitent son installation.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>123 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>111 cm</td>\n</tr>\n<tr>\n<td>Hauteur totale</td>\n<td>75 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>41 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier (depuis l'assise)</td>\n<td>35 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>180 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>19,5 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez 125 × 115 cm au sol, l'emprise d'un grand fauteuil.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Fausse fourrure</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Dessous</td>\n<td>Antidérapant</td>\n</tr>\n<tr>\n<td>Poignée</td>\n<td>Oui, à l'arrière</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris anthracite, crème</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Aucun, livré garni</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Brossez la fourrure en douceur pour lui garder son gonflant. Une tache se traite localement, à l'eau tiède, en tamponnant.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive compressé : tapotez-le et secouez-le légèrement, puis laissez-lui environ 72 heures pour retrouver sa forme.</p>\n<h2>FAQ</h2>\n<p><strong>1. Est-il facile de se relever ?</strong><br>\nL'assise est à 41 cm du sol, plus haute qu'un pouf classique, ce qui aide à se relever.</p>\n<p><strong>2. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 180 kg.</p>\n<p><strong>3. Faut-il le monter ou le remplir ?</strong><br>\nNon, il arrive garni. Laissez-lui environ 72 heures pour reprendre sa forme après ouverture.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\n123 cm de large pour 111 cm de profondeur et 75 cm de haut.</p>\n<p><strong>5. Quels coloris sont proposés ?</strong><br>\nGris anthracite et crème.</p>\n<p><strong>6. Glisse-t-il sur le parquet ?</strong><br>\nSon dessous antidérapant le garde en place.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Grand fauteuil pouf en fausse fourrure | Bercelou", description:"Grand fauteuil pouf en fausse fourrure, 123 × 111 × 75 cm, assise à 41 cm, charge 180 kg, dossier arrondi. Gris ou crème. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf-poire", "pouf"]}) { product { id handle } userErrors { field message } }
  x25_p: productUpdate(product:{id:"gid://shopify/Product/16616074936665", title:"Fauteuil relax en tissu aspect lin crème, repose-pieds", handle:"fauteuil-relax-aspect-lin-creme", descriptionHtml:"<p><strong>Un simple appui du dos et vos jambes se relèvent : le coin détente du salon, en crème doux.</strong></p>\n<ul>\n<li>Dossier inclinable jusqu'à 145°, repose-pieds qui se déplie en même temps</li>\n<li>Assise à ressorts ensachés et mousse haute densité</li>\n<li>Tissu aspect lin crème, doux et respirant</li>\n<li>Montage en 5 minutes environ, à deux</li>\n</ul>\n<p>Ce fauteuil relax manuel fait d'un coin de salon un vrai refuge pour la fin de journée. Vous vous installez, vous poussez légèrement du dos, et le repose-pieds se déplie sous vos jambes.</p>\n<h3>Réglages et confort</h3>\n<p>Le dossier s'incline jusqu'à 145° sous la simple pression du dos. Pour revenir en position assise, appuyez le repose-pieds vers le bas avec les jambes : il se verrouille.</p>\n<h3>Une assise moelleuse qui tient dans le temps</h3>\n<p>L'assise associe des ressorts ensachés à une mousse épaisse haute densité, pour un soutien souple et régulier pendant un film ou une sieste.</p>\n<h3>Une matière douce et facile à vivre</h3>\n<p>Le tissu aspect lin crème apporte une touche claire et chaleureuse. Il s'accorde aux salons naturels, scandinaves ou bohèmes.</p>\n<h3>Pensé pour les grands gabarits</h3>\n<p>Le fauteuil accueille les personnes jusqu'à 185 cm et supporte jusqu'à 120 kg, sur une structure en acier.</p>\n<h3>Tout à portée de main</h3>\n<p>Une poche latérale garde la télécommande ou un livre près de vous, sans vous relever.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions en position assise (L × P × H)</td>\n<td>73 × 86 × 100 cm</td>\n</tr>\n<tr>\n<td>Dimensions en position inclinée (L × P × H)</td>\n<td>73 × 158 × 74 cm</td>\n</tr>\n<tr>\n<td>Assise (L × P)</td>\n<td>51 × 56 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>46 cm</td>\n</tr>\n<tr>\n<td>Dossier (H × L)</td>\n<td>60 × 52 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du dossier</td>\n<td>25 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs au-dessus de l'assise</td>\n<td>11 cm</td>\n</tr>\n<tr>\n<td>Taille conseillée</td>\n<td>jusqu'à 185 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez 158 cm de profondeur au sol pour une inclinaison complète.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu aspect lin, 100 % polyester</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité, ressorts ensachés</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Acier et panneaux multiplis</td>\n</tr>\n<tr>\n<td>Inclinaison</td>\n<td>Jusqu'à 145°, manuelle (push-back)</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Intégré</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Crème</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Environ 5 minutes, à deux</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu à l'aspirateur, embout brosse. Traitez une tache localement avec une éponge légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 77 × 73 × 55 cm pour 27,5 kg. Le montage prend environ 5 minutes, idéalement à deux.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment incliner le fauteuil ?</strong><br>\nPoussez simplement du dos : le dossier s'incline jusqu'à 145° et le repose-pieds se déplie en même temps.</p>\n<p><strong>2. Comment revenir en position assise ?</strong><br>\nAppuyez le repose-pieds vers le bas avec les jambes, il se verrouille.</p>\n<p><strong>3. Quelle place prévoir ?</strong><br>\nLe fauteuil mesure 73 cm de large et 86 cm de profondeur assis. Comptez 158 cm de profondeur en position inclinée.</p>\n<p><strong>4. Convient-il aux grandes tailles ?</strong><br>\nIl est prévu pour les personnes jusqu'à 185 cm et supporte jusqu'à 120 kg.</p>\n<p><strong>5. Le fauteuil pivote-t-il ?</strong><br>\nNon, il reste fixe : c'est un fauteuil relax à inclinaison manuelle.</p>\n<p><strong>6. Le montage est-il long ?</strong><br>\nComptez environ 5 minutes, idéalement à deux.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil relax aspect lin crème, repose-pieds | Bercelou", description:"Fauteuil relax en tissu aspect lin crème : dossier inclinable jusqu'à 145°, repose-pieds intégré, ressorts ensachés. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax"]}) { product { id handle } userErrors { field message } }

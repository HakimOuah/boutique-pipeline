  x54_p: productUpdate(product:{id:"gid://shopify/Product/16616057110873", title:"Pouf géant convertible en lit, velours déhoussable", handle:"pouf-poire-geant-convertible-velours", descriptionHtml:"<p><strong>Un fauteuil pouf XXL pour lire le soir, qui se déplie en couchage d'appoint en un instant.</strong></p>\n<ul>\n<li>Fauteuil pouf de 112 cm, lit d'appoint de 190 × 135 cm</li>\n<li>Garnissage en morceaux de mousse, soutien ferme et moelleux</li>\n<li>Housse en velours lavable en machine, zip dissimulé</li>\n<li>Poche latérale pour livre ou téléphone, 7 coloris</li>\n</ul>\n<h3>Un coin lecture XXL</h3>\n<p>En position fauteuil, il mesure 112 cm de large pour 70 cm de haut : on s'y enfonce avec un livre, un enfant sur les genoux ou un plaid.</p>\n<h3>Un couchage d'appoint en un instant</h3>\n<p>Déplié, il devient un matelas de sol de 190 × 135 cm pour un ami de passage ou une soirée film.</p>\n<h3>Un soutien qui garde sa forme</h3>\n<p>Le garnissage en morceaux de mousse élastique soutient le dos et reprend sa forme, même après une longue soirée.</p>\n<h3>Une housse facile à vivre</h3>\n<p>La housse en velours, douce au toucher, se retire et passe en machine. Sa fermeture éclair est dissimulée et une poche latérale garde livre, tablette ou téléphone.</p>\n<h3>Sept teintes pour votre intérieur</h3>\n<p>Écru, taupe, gris, rose poudré, vert sapin, brun chocolat ou bleu roi.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position fauteuil (L × P × H)</td>\n<td>112 × 112 × 70 cm</td>\n</tr>\n<tr>\n<td>Position lit (L × l × H)</td>\n<td>190 × 135 × 20 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>43 × 43 × 37 cm, 15,5 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : mesurez votre coin avant l'achat, un carré de 112 cm en fauteuil et 190 × 135 cm une fois déplié.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Housse</td>\n<td>Velours, lavable en machine, fermeture éclair dissimulée</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Morceaux de mousse élastique</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Poche latérale</td>\n</tr>\n<tr>\n<td>Positions</td>\n<td>Fauteuil pouf ou lit d'appoint</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Écru, taupe, gris, rose poudré, vert sapin, brun chocolat, bleu roi</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Retirez la housse et lavez-la en machine. Laissez-la sécher à plat avant de la replacer sur le garnissage.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le pouf arrive compressé sous vide : glissez le garnissage dans la housse, aérez-le légèrement et fermez le zip. Il reprend son volume après déballage.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment passe-t-on du fauteuil au lit ?</strong><br>\nLe pouf se déplie en un matelas de sol de 190 × 135 cm, puis se replie en fauteuil de 112 cm.</p>\n<p><strong>2. La housse est-elle lavable ?</strong><br>\nOui, elle se retire et passe en machine.</p>\n<p><strong>3. Faut-il le remplir soi-même ?</strong><br>\nLe garnissage est fourni : à la livraison, vous le glissez dans la housse et fermez la fermeture éclair.</p>\n<p><strong>4. Pourquoi le colis est-il si petit ?</strong><br>\nLe pouf est compressé sous vide et reprend nettement de volume après ouverture. Mesurez bien la place prévue.</p>\n<p><strong>5. Garde-t-il sa forme ?</strong><br>\nLe garnissage en morceaux de mousse élastique reste stable, assis ou allongé.</p>\n<p><strong>6. Quels coloris sont proposés ?</strong><br>\nÉcru, taupe, gris, rose poudré, vert sapin, brun chocolat et bleu roi.</p>\n<p><strong>7. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Pouf géant convertible en lit, velours | Bercelou", description:"Pouf géant XXL convertible : fauteuil 112 × 70 cm ou lit 190 × 135 cm. Garnissage mousse, housse lavable en machine. 7 coloris. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf-poire", "pouf"]}) { product { id handle } userErrors { field message } }
  x55_p: productUpdate(product:{id:"gid://shopify/Product/16616057012569", title:"Pouf rond en velours côtelé moelleux, housse lavable", handle:"pouf-rond-velours-cotele-moelleux", descriptionHtml:"<p><strong>Le pouf souple qui se glisse sous vos pieds, se déplace d'une main et passe en machine.</strong></p>\n<ul>\n<li>Velours côtelé épais, garni de morceaux de mousse</li>\n<li>Housse zippée, lavable en machine</li>\n<li>Dessous antidérapant et poignée de transport</li>\n<li>Vert sapin, gris anthracite, bleu marine ou beige</li>\n</ul>\n<h3>Les jambes posées, le dos calé</h3>\n<p>À 35 cm de haut, ce pouf rond se place devant un fauteuil ou un canapé pour allonger les jambes en fin de journée.</p>\n<h3>Une housse qui passe en machine</h3>\n<p>La fermeture éclair sous le pouf libère la housse : un lavage en machine et elle retrouve sa fraîcheur.</p>\n<h3>Il reste en place</h3>\n<p>Son dessous antidérapant le garde stable sur le parquet. La poignée latérale permet de le déplacer d'une main.</p>\n<h3>Un moelleux qui tient</h3>\n<p>Le garnissage en morceaux de mousse soutient les jambes et reprend sa forme.</p>\n<h3>Quatre teintes pour le salon</h3>\n<p>Vert sapin, gris anthracite, bleu marine ou beige : le velours côtelé capte la lumière et réchauffe la pièce.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>35 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>36 × 31 × 20 cm, 5,2 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez un cercle de 50 cm devant le fauteuil.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Velours côtelé</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Morceaux de mousse</td>\n</tr>\n<tr>\n<td>Housse</td>\n<td>Zippée, lavable en machine</td>\n</tr>\n<tr>\n<td>Dessous</td>\n<td>Antidérapant</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Vert sapin, gris anthracite, bleu marine, beige</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Ouvrez la fermeture éclair, retirez le garnissage et lavez la housse en machine. Laissez-la sécher à plat avant de la remettre.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le pouf arrive garni et prêt à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. La housse se lave-t-elle ?</strong><br>\nOui, elle se retire grâce à la fermeture éclair et passe en machine.</p>\n<p><strong>2. Le pouf glisse-t-il sur le parquet ?</strong><br>\nSon dessous antidérapant le garde en place.</p>\n<p><strong>3. Quelle hauteur fait-il ?</strong><br>\n35 cm, pour 50 cm de diamètre.</p>\n<p><strong>4. Est-il ferme ou souple ?</strong><br>\nSouple et soutenant : il est garni de morceaux de mousse.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nVert sapin, gris anthracite, bleu marine et beige.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Pouf rond en velours côtelé, housse lavable | Bercelou", description:"Pouf rond en velours côtelé, 50 × 35 cm, garni de mousse, housse lavable en machine, base antidérapante. 4 coloris. Livraison offerte."}, productType:"Pouf", vendor:"Bercelou", tags:["pouf", "repose-pieds"]}) { product { id handle } userErrors { field message } }
  x56_p: productUpdate(product:{id:"gid://shopify/Product/16616057569625", title:"Repose-pieds incurvé en polaire bouclée grise", handle:"repose-pieds-banquette-polaire-grise", descriptionHtml:"<p><strong>Un repose-pieds tout en courbe pour allonger les jambes devant votre fauteuil.</strong></p>\n<ul>\n<li>Assise incurvée qui accueille les mollets</li>\n<li>Polaire berbère grise, douce et respirante</li>\n<li>Mousse haute densité de 12 cm</li>\n<li>Pieds en hêtre massif, charge 120 kg</li>\n</ul>\n<h3>Une courbe pour vos jambes</h3>\n<p>L'assise incurvée épouse les mollets. Placé devant un fauteuil relax ou un rocking chair, il prolonge le confort.</p>\n<h3>Une polaire toute douce</h3>\n<p>La polaire berbère grise, bouclée et respirante, fait écho aux fauteuils en bouclette et en teddy.</p>\n<h3>Un soutien qui dure</h3>\n<p>12 cm de mousse haute densité gardent leur tenue au fil des soirées.</p>\n<h3>Stable sur ses pieds en hêtre</h3>\n<p>Les pieds en hêtre massif, légèrement écartés, lui donnent une allure scandinave et une assise stable jusqu'à 120 kg. Il sert aussi de tabouret de coiffeuse.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>67 × 45 × 38 cm</td>\n</tr>\n<tr>\n<td>Épaisseur d'assise</td>\n<td>12 cm</td>\n</tr>\n<tr>\n<td>Hauteur des pieds</td>\n<td>24 cm</td>\n</tr>\n<tr>\n<td>Charge maximale recommandée</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>61 × 22 × 44 cm, 5,5 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez 70 × 50 cm devant le fauteuil.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Polaire berbère 100 % polyester</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Pieds</td>\n<td>Hêtre massif</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la polaire à l'aspirateur, embout tissu, et aérez-la d'une brosse douce. Une tache se traite localement à l'eau tiède.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Les pieds sont à fixer à réception.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quelle hauteur fait-il ?</strong><br>\n38 cm, avec une assise incurvée de 12 cm d'épaisseur.</p>\n<p><strong>2. Peut-on s'asseoir dessus ?</strong><br>\nOui, il supporte jusqu'à 120 kg et sert de tabouret d'appoint.</p>\n<p><strong>3. En quelle matière sont les pieds ?</strong><br>\nEn hêtre massif.</p>\n<p><strong>4. Faut-il le monter ?</strong><br>\nOui, un montage est nécessaire à réception.</p>\n<p><strong>5. Avec quel fauteuil l'associer ?</strong><br>\nIl complète un fauteuil relax, un rocking chair ou un fauteuil en bouclette.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Repose-pieds incurvé en polaire bouclée grise | Bercelou", description:"Repose-pieds incurvé en polaire berbère grise, 67 × 45 × 38 cm, mousse de 12 cm, pieds en hêtre massif, 120 kg. Livraison offerte."}, productType:"Repose-pieds", vendor:"Bercelou", tags:["repose-pieds", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }
  x57_p: productUpdate(product:{id:"gid://shopify/Product/16616057799001", title:"Repose-pieds carré en velours côtelé, housse lavable", handle:"repose-pieds-carre-velours-cotele", descriptionHtml:"<p><strong>Un pouf carré souple pour allonger les jambes, qui passe en machine et reste en place.</strong></p>\n<ul>\n<li>Velours côtelé épais, garni de morceaux de mousse</li>\n<li>Housse zippée, lavable en machine</li>\n<li>Dessous antidérapant et poignée de transport</li>\n<li>Vert sapin, bleu marine ou gris anthracite</li>\n</ul>\n<h3>Les jambes allongées devant le fauteuil</h3>\n<p>Son plateau carré de 50 cm accueille les deux jambes. À 35 cm de haut, il se place devant un fauteuil ou un canapé.</p>\n<h3>Une housse qui se lave</h3>\n<p>La fermeture éclair libère la housse, qui passe en machine.</p>\n<h3>Stable et facile à déplacer</h3>\n<p>Son dessous antidérapant le garde en place ; la poignée latérale permet de le déplacer d'une main.</p>\n<h3>Un moelleux qui revient</h3>\n<p>Le garnissage en morceaux de mousse soutient les jambes et reprend sa forme.</p>\n<h3>Trois teintes profondes</h3>\n<p>Vert sapin, bleu marine ou gris anthracite, pour réchauffer un salon clair.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>50 × 50 × 35 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>36 × 31 × 20 cm, 6,5 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : un carré de 50 cm devant le fauteuil.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Velours côtelé</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Morceaux de mousse</td>\n</tr>\n<tr>\n<td>Housse</td>\n<td>Zippée, lavable en machine</td>\n</tr>\n<tr>\n<td>Dessous</td>\n<td>Antidérapant</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Vert sapin, bleu marine, gris anthracite</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Ouvrez la fermeture éclair, retirez le garnissage et lavez la housse en machine. Laissez-la sécher à plat avant de la remettre.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le repose-pieds arrive garni et prêt à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. La housse est-elle lavable ?</strong><br>\nOui, elle se retire et passe en machine.</p>\n<p><strong>2. Quelles sont ses dimensions ?</strong><br>\n50 × 50 cm pour 35 cm de haut.</p>\n<p><strong>3. Glisse-t-il au sol ?</strong><br>\nNon, son dessous est antidérapant.</p>\n<p><strong>4. Existe-t-il en rond ?</strong><br>\nOui, notre pouf rond en velours côtelé moelleux reprend la même matière en 50 cm de diamètre.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nVert sapin, bleu marine et gris anthracite.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Repose-pieds carré en velours côtelé | Bercelou", description:"Repose-pieds carré en velours côtelé, 50 × 50 × 35 cm, garni de mousse, housse lavable, dessous antidérapant. 3 coloris. Livraison offerte."}, productType:"Repose-pieds", vendor:"Bercelou", tags:["repose-pieds", "pouf"]}) { product { id handle } userErrors { field message } }
  x58_p: productUpdate(product:{id:"gid://shopify/Product/16616057766233", title:"Repose-pieds cube aspect lin crème, poche latérale", handle:"repose-pieds-cube-lin-creme-poche", descriptionHtml:"<p><strong>Le petit cube qui garde le livre du soir à portée de main, à côté du fauteuil.</strong></p>\n<ul>\n<li>Poche latérale de 35 × 20 cm pour livre ou télécommande</li>\n<li>Dessus capitonné à boutons, tissu aspect lin crème</li>\n<li>Livré monté, charge jusqu'à 120 kg</li>\n<li>Léger et compact : 35 cm de côté</li>\n</ul>\n<h3>L'essentiel à portée de main</h3>\n<p>Sa poche latérale garde le livre du soir, la télécommande ou un carnet. Pratique à côté d'un fauteuil d'allaitement ou de lecture.</p>\n<h3>Les pieds posés à bonne hauteur</h3>\n<p>À 35 cm de haut, il accueille vos pieds devant le fauteuil, ou sert de petit siège quand il le faut.</p>\n<h3>Un cube doux et lumineux</h3>\n<p>Le tissu aspect lin crème et le dessus capitonné à boutons s'accordent aux intérieurs clairs.</p>\n<h3>Prêt à l'emploi</h3>\n<p>Aucun assemblage : il se pose et se déplace d'une main. Ses patins antidérapants protègent le sol.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>35 × 35 × 35 cm</td>\n</tr>\n<tr>\n<td>Poche latérale</td>\n<td>35 × 20 cm</td>\n</tr>\n<tr>\n<td>Hauteur des pieds</td>\n<td>5 cm</td>\n</tr>\n<tr>\n<td>Charge maximale recommandée</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>37 × 37 × 37 cm, 4 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : un carré de 35 cm, contre le fauteuil, poche côté assise.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu aspect lin 100 % polyester</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Structure et pieds</td>\n<td>Hévéa et eucalyptus, patins antidérapants</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Crème</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Aucun</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu à l'aspirateur, embout tissu. Une tache se traite localement, à l'eau tiède et au savon doux.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le repose-pieds arrive prêt à l'emploi.</p>\n<h2>FAQ</h2>\n<p><strong>1. Que peut-on glisser dans la poche ?</strong><br>\nUn livre, une télécommande, un carnet : la poche mesure 35 × 20 cm.</p>\n<p><strong>2. Faut-il le monter ?</strong><br>\nNon, aucun assemblage n'est requis.</p>\n<p><strong>3. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 120 kg.</p>\n<p><strong>4. Quelle hauteur fait-il ?</strong><br>\n35 cm.</p>\n<p><strong>5. Glisse-t-il au sol ?</strong><br>\nSes patins antidérapants le gardent en place.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Repose-pieds cube crème avec poche latérale | Bercelou", description:"Repose-pieds cube 35 cm aspect lin crème, poche latérale pour livre ou télécommande, 120 kg, sans montage. Livraison offerte en France."}, productType:"Repose-pieds", vendor:"Bercelou", tags:["repose-pieds", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }
  x59_p: productUpdate(product:{id:"gid://shopify/Product/16616057536857", title:"Repose-pieds vintage capitonné aspect lin beige", handle:"repose-pieds-vintage-lin-beige", descriptionHtml:"<p><strong>Le repose-pieds à l'allure d'autrefois qui complète votre fauteuil pour les longues tétées.</strong></p>\n<ul>\n<li>Assise capitonnée en tissu aspect lin respirant</li>\n<li>Coussin en mousse épaisse</li>\n<li>Pieds en bois sculpté, style vintage</li>\n<li>Format de 40 × 40 cm, hauteur 43 cm</li>\n</ul>\n<h3>Les pieds surélevés pendant la tétée</h3>\n<p>Placé devant votre fauteuil d'allaitement, il garde vos pieds surélevés et vos genoux à bonne hauteur pour soutenir bébé.</p>\n<h3>Un tissu qui respire</h3>\n<p>Le tissu aspect lin, respirant, habille une mousse épaisse. Le capitonnage ajoute du relief.</p>\n<h3>Des pieds sculptés, une allure classique</h3>\n<p>Les pieds en bois sculpté donnent au repose-pieds une allure vintage, qui s'accorde aux chambres et aux salons de caractère.</p>\n<h3>Un tabouret d'appoint</h3>\n<p>À 43 cm de haut, il sert aussi de petit siège dans une entrée ou devant une coiffeuse.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × P × H)</td>\n<td>40 × 40 × 43 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>54 × 15 × 42 cm, 5,9 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : un carré de 40 cm devant le fauteuil suffit.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu aspect lin, beige</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse épaisse</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois, pieds sculptés</td>\n</tr>\n<tr>\n<td>Finition</td>\n<td>Assise capitonnée</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Selon la notice fournie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu à l'aspirateur, embout tissu. Une tache se traite localement, à l'eau tiède et au savon doux. Le bois s'essuie avec un chiffon sec.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le repose-pieds est à assembler selon la notice fournie.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quelle hauteur fait-il ?</strong><br>\n43 cm, pour une assise de 40 × 40 cm.</p>\n<p><strong>2. Convient-il à un fauteuil d'allaitement ?</strong><br>\nOui, il surélève les pieds devant le fauteuil pendant la tétée.</p>\n<p><strong>3. Faut-il le monter ?</strong><br>\nOui, un assemblage est à prévoir selon la notice.</p>\n<p><strong>4. Le tissu est-il du vrai lin ?</strong><br>\nC'est un tissu d'aspect lin, respirant.</p>\n<p><strong>5. Peut-on s'asseoir dessus ?</strong><br>\nOui, il sert aussi de tabouret d'appoint.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Puis-je le retourner ?</strong><br>\nVous disposez de 14 jours après réception. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Repose-pieds vintage capitonné aspect lin | Bercelou", description:"Repose-pieds vintage capitonné, tissu aspect lin beige, pieds en bois sculpté, 40 × 40 × 43 cm. Au pied du fauteuil d'allaitement. Livraison offerte."}, productType:"Repose-pieds", vendor:"Bercelou", tags:["repose-pieds", "accessoires-rocking-chair"]}) { product { id handle } userErrors { field message } }
  x60_p: productUpdate(product:{id:"gid://shopify/Product/16616075297113", title:"Rocking chair en acacia, dossier haut et coussins beiges", handle:"rocking-chair-acacia-coussins-beige", descriptionHtml:"<p><strong>Un café, un livre, une bascule lente : le fauteuil de la terrasse couverte et du porche.</strong></p>\n<ul>\n<li>Dossier haut de 63 cm pour soutenir le dos et la nuque</li>\n<li>Coussins beiges déhoussables, housses déperlantes zippées</li>\n<li>Acacia au veinage naturel, charge maximale 160 kg</li>\n<li>Patins réglables pour les sols irréguliers</li>\n</ul>\n<p>Un rocking chair en bois d'acacia clair habillé de coussins beiges, pour une terrasse, un balcon ou un porche.</p>\n<h3>Une bascule douce</h3>\n<p>Le fauteuil glisse doucement d'avant en arrière, un mouvement lent qui aide à décompresser en fin de journée.</p>\n<h3>Vos bras et votre dos bien soutenus</h3>\n<p>Le dossier monte à 63 cm et soutient le dos et la nuque pendant les longues lectures. Les accoudoirs en bois accueillent les bras.</p>\n<h3>Une assise moelleuse</h3>\n<p>Les coussins sont garnis de mousse et de coton PP. L'assise se trouve entre 42,5 et 44,5 cm du sol.</p>\n<h3>Une matière facile à vivre</h3>\n<p>Les housses en polyester déperlant se retirent grâce à leurs fermetures éclair dissimulées, pour un lavage simple.</p>\n<h3>Sur la terrasse</h3>\n<p>Solide et stable, l'acacia supporte 160 kg. Les patins réglables des arceaux compensent un sol légèrement irrégulier.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (l × P × H)</td>\n<td>60 × 89 × 107 cm</td>\n</tr>\n<tr>\n<td>Assise (l × P)</td>\n<td>48 × 46,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>42,5 à 44,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>63 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>160 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 89 cm de profondeur au sol et laissez environ 50 cm derrière pour une bascule libre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Structure</td>\n<td>Bois d'acacia</td>\n</tr>\n<tr>\n<td>Coussins</td>\n<td>Mousse et coton PP, housses polyester déperlantes zippées</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Réglables</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Porche, terrasse couverte, balcon, jardin</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Bois naturel, coussins beiges</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>160 kg</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Retirez les housses pour les laver. Pour un usage prolongé dehors, installez le fauteuil sous un abri ou protégez-le d'une housse, et rentrez les coussins par temps de pluie.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 94 × 72 × 23 cm pour 12,5 kg.</p>\n<h2>FAQ</h2>\n<p><strong>1. Les housses sont-elles lavables ?</strong><br>\nElles sont déhoussables grâce à des fermetures éclair dissimulées, pour un lavage simple.</p>\n<p><strong>2. Peut-il rester dehors ?</strong><br>\nIl est idéal sur un porche ou une terrasse couverte. Rentrez les coussins par temps de pluie.</p>\n<p><strong>3. Quelle est la hauteur d'assise ?</strong><br>\nEntre 42,5 et 44,5 cm du sol.</p>\n<p><strong>4. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 160 kg.</p>\n<p><strong>5. Et si mon sol n'est pas plat ?</strong><br>\nLes patins réglables des arceaux compensent un sol légèrement irrégulier.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair en acacia, coussins beiges | Bercelou", description:"Rocking chair en acacia avec dossier haut de 63 cm et coussins beiges déhoussables déperlants, charge 160 kg, patins réglables. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-exterieur", "fauteuil-a-bascule"]}) { product { id handle } userErrors { field message } }
  x61_p: productUpdate(product:{id:"gid://shopify/Product/16616075395417", title:"Rocking chair Adirondack en acacia massif", handle:"rocking-chair-adirondack-acacia", descriptionHtml:"<p><strong>La silhouette Adirondack, un bois chaleureux et une bascule lente pour profiter du jardin.</strong></p>\n<ul>\n<li>Acacia massif, bois dur dense et robuste</li>\n<li>Dossier haut légèrement incliné, à lattes</li>\n<li>Accoudoirs larges pour poser une tasse ou un livre</li>\n<li>Bascule douce et apaisante</li>\n</ul>\n<p>Le style Adirondack rencontre le rocking chair : un fauteuil en acacia massif pour le jardin, le patio ou le balcon.</p>\n<h3>Une bascule douce</h3>\n<p>Les arceaux en bois offrent un balancement doux et régulier, parfait après une longue journée.</p>\n<h3>Vos bras et votre dos bien soutenus</h3>\n<p>Le dossier haut, légèrement incliné, accompagne le dos. Les accoudoirs larges accueillent les bras, une tasse ou un livre.</p>\n<h3>Une matière naturelle</h3>\n<p>L'acacia massif est un bois dur, dense et durable. Sa teinte chaude s'accorde aux jardins fleuris comme aux terrasses en bois.</p>\n<h3>Sur la terrasse</h3>\n<p>Posez-le près d'une petite table pour un coin café ou lecture en plein air.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (l × P × H)</td>\n<td>75 × 105 × 90 cm</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 105 cm de profondeur au sol et un peu d'espace derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Acacia massif</td>\n</tr>\n<tr>\n<td>Style</td>\n<td>Adirondack à bascule</td>\n</tr>\n<tr>\n<td>Assise</td>\n<td>Lattes de bois, sans coussin</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Acacia naturel</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Jardin, patio, balcon</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception, instructions fournies</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le bois avec une brosse douce. Pour garder sa beauté, protégez le fauteuil d'une housse imperméable et rentrez-le l'hiver.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 102 × 54 × 14 cm pour 13,6 kg. Le fauteuil est à assembler, instructions fournies.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le fauteuil est-il en bois massif ?</strong><br>\nOui, en acacia massif, un bois dur dense et robuste.</p>\n<p><strong>2. Peut-il rester dehors ?</strong><br>\nIl est conçu pour le jardin. Protégez-le d'une housse imperméable pour préserver son aspect.</p>\n<p><strong>3. Un coussin est-il fourni ?</strong><br>\nNon, l'assise est en lattes de bois. Un coussin d'assise peut compléter le confort.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\nIl mesure 75 cm de large et 105 cm de profondeur.</p>\n<p><strong>5. Le montage est-il simple ?</strong><br>\nOui, des instructions sont fournies pour faciliter l'assemblage.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair Adirondack en acacia massif | Bercelou", description:"Rocking chair Adirondack en acacia massif : dossier haut légèrement incliné, accoudoirs larges, bascule douce pour le jardin. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-exterieur", "fauteuil-a-bascule"]}) { product { id handle } userErrors { field message } }
  x62_p: productUpdate(product:{id:"gid://shopify/Product/16616075460953", title:"Rocking chair Adirondack noir en PEHD, repose-pieds", handle:"rocking-chair-adirondack-noir-repose-pieds", descriptionHtml:"<p><strong>Quatre fauteuils en un : Adirondack fixe ou à bascule, avec ou sans repose-pieds, dehors toute l'année.</strong></p>\n<ul>\n<li>Repose-pieds escamotable, rangé sous l'assise</li>\n<li>Base à bascule amovible : se transforme en Adirondack pliable</li>\n<li>PEHD et visserie inox 304, sans entretien</li>\n<li>Porte-verre et porte-gobelet sur les accoudoirs larges</li>\n</ul>\n<p>Un fauteuil Adirondack pensé pour la terrasse : il se balance, s'allonge grâce à son repose-pieds et se replie quand vous le rangez.</p>\n<h3>Quatre usages en un fauteuil</h3>\n<p>Adirondack fixe, Adirondack avec repose-pieds, rocking chair ou rocking chair avec repose-pieds : retirez la base à bascule ou tirez le repose-pieds selon l'envie.</p>\n<h3>Les jambes à l'horizontale</h3>\n<p>Le repose-pieds intégré se tire pour soutenir les jambes, puis se range sous l'assise quand vous n'en avez pas besoin.</p>\n<h3>Sur la terrasse, en toute saison</h3>\n<p>Le PEHD et la visserie en inox 304 résistent à la décoloration, aux fissures et à la pourriture. Le fauteuil reste dehors avec peu d'entretien.</p>\n<h3>Vos bras et votre dos bien soutenus</h3>\n<p>Le dossier extra-haut accompagne la nuque, les accoudoirs extra-larges accueillent les bras et vos boissons.</p>\n<h3>Un montage rapide</h3>\n<p>Le fauteuil arrive préassemblé à 80 %. Comptez environ 30 minutes avec la visserie et les instructions fournies.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur</td>\n<td>105 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>84 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs</td>\n<td>66 cm</td>\n</tr>\n<tr>\n<td>Profondeur d'assise</td>\n<td>46 cm</td>\n</tr>\n<tr>\n<td>Largeur du dossier</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Repose-pieds (L × l)</td>\n<td>47 × 42 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>172 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez environ 50 cm supplémentaires devant le fauteuil quand le repose-pieds est tiré.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>PEHD (polyéthylène haute densité)</td>\n</tr>\n<tr>\n<td>Visserie</td>\n<td>Inox 304</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Intégré, escamotable</td>\n</tr>\n<tr>\n<td>Base à bascule</td>\n<td>Amovible</td>\n</tr>\n<tr>\n<td>Pliable</td>\n<td>Oui, sans la base à bascule</td>\n</tr>\n<tr>\n<td>Accessoires</td>\n<td>Porte-verre à pied et porte-gobelet</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Noir</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>172 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Préassemblé à 80 %, environ 30 minutes</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Nettoyez le PEHD à l'eau savonneuse avec une éponge, rincez et laissez sécher. Aucun traitement ni peinture n'est nécessaire.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 95 × 55 × 25 cm pour 27,5 kg. Montage d'environ 30 minutes, visserie et instructions fournies.</p>\n<h2>FAQ</h2>\n<p><strong>1. Peut-on l'utiliser sans la bascule ?</strong><br>\nOui, la base à bascule se retire : le fauteuil devient un Adirondack classique, pliable.</p>\n<p><strong>2. Comment fonctionne le repose-pieds ?</strong><br>\nTirez-le de sous l'assise pour allonger les jambes, puis repoussez-le pour le ranger.</p>\n<p><strong>3. Peut-il rester dehors toute l'année ?</strong><br>\nLe PEHD et l'inox 304 résistent à la décoloration, aux fissures et à la pourriture : il demande peu d'entretien.</p>\n<p><strong>4. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 172 kg.</p>\n<p><strong>5. Le montage est-il long ?</strong><br>\nEnviron 30 minutes : le fauteuil est préassemblé à 80 %.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair Adirondack noir, repose-pieds | Bercelou", description:"Rocking chair Adirondack noir en PEHD, repose-pieds escamotable, base à bascule amovible, porte-verres, charge 172 kg. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-exterieur", "rocking-chair-repose-pieds"]}) { product { id handle } userErrors { field message } }
  x63_p: productUpdate(product:{id:"gid://shopify/Product/16616075690329", title:"Rocking chair de jardin en métal noir et toile", handle:"rocking-chair-jardin-metal-noir", descriptionHtml:"<p><strong>Une silhouette épurée et une bascule douce pour les fins d'après-midi au jardin.</strong></p>\n<ul>\n<li>Acier thermolaqué traité contre la rouille</li>\n<li>Assise et dossier haut en toile respirante</li>\n<li>Base incurvée pour une bascule douce et stable</li>\n<li>Charge maximale 150 kg</li>\n</ul>\n<p>Un rocking chair de jardin au dessin contemporain, pour la terrasse, le balcon, la pelouse ou le bord de piscine.</p>\n<h3>Une bascule douce</h3>\n<p>La base incurvée offre un mouvement de bascule régulier et maîtrisé, sans basculer.</p>\n<h3>Sur la terrasse</h3>\n<p>Le cadre en acier reçoit un traitement cataphorèse puis un thermolaquage : il résiste à la rouille, aux intempéries et à l'usage quotidien.</p>\n<h3>Le dos soutenu</h3>\n<p>L'assise et le haut dossier en toile tendue suivent la forme du dos et des hanches, pour lire ou discuter dehors.</p>\n<h3>Un style qui s'accorde</h3>\n<p>Noir et sobre, il se marie avec un salon de jardin moderne. Placez-en deux autour d'une table basse pour un coin conversation.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (l × P × H)</td>\n<td>59,5 × 102 × 92,5 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez un peu plus de 1 m de profondeur au sol pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Structure</td>\n<td>Acier thermolaqué, traitement anticorrosion</td>\n</tr>\n<tr>\n<td>Assise et dossier</td>\n<td>Toile respirante</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Noir et gris foncé</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Terrasse, balcon, jardin, bord de piscine</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Nettoyez la structure et la toile avec une éponge et de l'eau savonneuse, rincez et laissez sécher. Rangez le fauteuil à l'abri l'hiver.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 10 kg. Le rocking chair est à assembler à réception.</p>\n<h2>FAQ</h2>\n<p><strong>1. Peut-il rester dehors ?</strong><br>\nOui, son acier thermolaqué est traité contre la rouille et les intempéries. Rangez-le à l'abri l'hiver pour prolonger sa durée de vie.</p>\n<p><strong>2. Est-il stable ?</strong><br>\nSa base incurvée offre une bascule contrôlée et stable.</p>\n<p><strong>3. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 150 kg.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\nIl mesure 59,5 cm de large et 102 cm de profondeur.</p>\n<p><strong>5. Faut-il le monter ?</strong><br>\nOui, il s'assemble à réception.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair de jardin en métal noir et toile | Bercelou", description:"Rocking chair de jardin en acier thermolaqué noir et toile respirante : bascule douce, dossier haut, charge 150 kg. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["fauteuil-relax-jardin", "rocking-chair-exterieur"]}) { product { id handle } userErrors { field message } }
}
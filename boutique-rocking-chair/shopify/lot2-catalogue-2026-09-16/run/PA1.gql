  a8_p: productUpdate(product:{id:"gid://shopify/Product/16616085913945", title:"Rocking chair classique en bois blanc, dossier à lattes", handle:"rocking-chair-bois-blanc-dossier-a-lattes", descriptionHtml:"<p><strong>Le rocking chair de toujours, tout en bois blanc : pour la véranda, le coin lecture ou la chambre, au rythme d'une bascule lente.</strong></p>\n<ul>\n<li>Bois massif, finition peinte blanche mate</li>\n<li>Dossier très haut à lattes, où la tête se pose</li>\n<li>Assise large et galbée, accoudoirs larges</li>\n<li>Format généreux : 115 cm de haut</li>\n</ul>\n<h3>Un coin lecture en un instant</h3>\n<p>Sa silhouette traditionnelle à lattes s'installe dans une véranda lumineuse, un coin lecture ou une chambre, pour les pauses au calme.</p>\n<h3>Le dos et la tête soutenus</h3>\n<p>Le dossier à lattes monte à 115 cm du sol : la tête s'y repose pendant que vous vous balancez.</p>\n<h3>Une assise large et galbée</h3>\n<p>L'assise de 55 × 54 cm est profilée pour accompagner le corps. Les accoudoirs larges accueillent les bras, une tasse ou un livre ouvert.</p>\n<h3>Une bascule ample</h3>\n<p>Les longs patins de 86 cm donnent un balancement lent et régulier, à apprécier sur un sol plan.</p>\n<h3>Tout en bois</h3>\n<p>Le fauteuil est fabriqué en bois massif, avec une finition polyuréthane mate qui garde son blanc net au fil des saisons.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>69 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>86 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>115 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>47,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur de l'accoudoir (sol)</td>\n<td>68,5 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>55 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>54 cm</td>\n</tr>\n<tr>\n<td>Accoudoirs (longueur × largeur)</td>\n<td>54 × 8,5 cm</td>\n</tr>\n<tr>\n<td>Longueur des patins</td>\n<td>86 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>10 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 86 cm de profondeur au sol et un dégagement derrière pour la bascule ; installez le fauteuil sur un sol plan.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Bois massif, finition polyuréthane mate</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Blanc</td>\n</tr>\n<tr>\n<td>Dossier</td>\n<td>Haut, à lattes</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Larges, en bois</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Montage simple, environ 10 à 15 minutes</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Essuyez le bois avec un chiffon doux trempé dans l'eau, sans détergent. Évitez le soleil direct prolongé et les sources de chaleur.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive en colis plat et se monte en 10 à 15 minutes environ.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le fauteuil est-il en bois ?</strong><br>\nOui, en bois massif, avec une finition polyuréthane mate blanche.</p>\n<p><strong>2. Le dossier soutient-il la tête ?</strong><br>\nOui, le dossier à lattes monte à 115 cm du sol.</p>\n<p><strong>3. À quelle hauteur sont l'assise et les accoudoirs ?</strong><br>\nL'assise est à 47,5 cm du sol et les accoudoirs à 68,5 cm.</p>\n<p><strong>4. Peut-on s'asseoir sur les accoudoirs ?</strong><br>\nNon, pour votre sécurité, ne vous asseyez pas sur les accoudoirs et utilisez le fauteuil sur un sol plan.</p>\n<p><strong>5. Le montage est-il long ?</strong><br>\nComptez environ 10 à 15 minutes.</p>\n<p><strong>6. Quel poids supporte-t-il ?</strong><br>\nLa charge maximale recommandée est de 136 kg.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair en bois blanc, dossier à lattes | Bercelou", description:"Rocking chair classique en bois massif peint en blanc : dossier haut à lattes, assise large, accoudoirs larges. Véranda ou coin lecture. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["chaise-a-bascule"]}) { product { id handle } userErrors { field message } }
  a9_p: productUpdate(product:{id:"gid://shopify/Product/16616075985241", title:"Rocking chair en bouclette blanche, cadre en bois ouvert", handle:"rocking-chair-bouclette-blanche-cadre-bois-ouvert", descriptionHtml:"<p><strong>Un cadre en bois aux lignes nettes, une bouclette toute douce : le rocking chair scandinave qui se glisse partout.</strong></p>\n<ul>\n<li>Tissu effet laine bouclée blanc crème, doux au toucher</li>\n<li>Cadre ouvert et patins en bois d'hévéa</li>\n<li>Coussin d'assise de 14,5 cm, mousse épaisse</li>\n<li>Format compact 60 × 81 cm, charge 150 kg</li>\n</ul>\n<h3>Une matière douce et chaleureuse</h3>\n<p>Le revêtement effet laine bouclée apporte du relief et de la douceur : on s'y installe pour les moments cocooning, un plaid sur les genoux.</p>\n<h3>Des lignes scandinaves</h3>\n<p>Le cadre rectangulaire en bois d'hévéa encadre l'assise sans l'alourdir. Le fauteuil apporte une touche vintage au salon, à la chambre ou au bureau.</p>\n<h3>Une bascule douce</h3>\n<p>Les patins en bois vous balancent en douceur, d'une position assise à une position plus inclinée, de 90° à 135°.</p>\n<h3>Un format qui trouve sa place</h3>\n<p>Avec 60 cm de large et 81 cm de profondeur, il se loge dans un coin de chambre ou à côté d'une bibliothèque.</p>\n<h3>Il reste au salon après bébé</h3>\n<p>Pensé aussi pour les moments d'allaitement, il devient ensuite le fauteuil de lecture du salon.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>60 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>81 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>71 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>46 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>53 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Épaisseur de l'assise</td>\n<td>14,5 cm</td>\n</tr>\n<tr>\n<td>Dossier (largeur × hauteur)</td>\n<td>48 × 38 cm</td>\n</tr>\n<tr>\n<td>Hauteur de l'accoudoir (sol)</td>\n<td>65 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>15,3 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 81 cm de profondeur au sol et environ 50 cm de dégagement derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu effet laine bouclée (100 % polyester), blanc crème</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse épaisse</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois d'hévéa, cadre et patins</td>\n</tr>\n<tr>\n<td>Bascule</td>\n<td>De 90° à 135°</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À monter soi-même, notice fournie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>La bouclette se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter. Le bois s'essuie avec un chiffon doux et sec.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à monter, notice fournie.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le fauteuil est-il compact ?</strong><br>\nOui : 60 cm de large, 81 cm de profondeur et 71 cm de haut.</p>\n<p><strong>2. À quelle hauteur sont l'assise et les accoudoirs ?</strong><br>\nL'assise est à 46 cm du sol et les accoudoirs à 65 cm.</p>\n<p><strong>3. Le dossier est-il haut ?</strong><br>\nC'est un dossier bas de style lounge, de 38 cm de haut, pour une assise détendue.</p>\n<p><strong>4. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 150 kg.</p>\n<p><strong>5. La bouclette est-elle douce ?</strong><br>\nLe revêtement effet laine bouclée est doux et agréable au toucher.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair bouclette blanche, cadre bois | Bercelou", description:"Rocking chair en tissu effet laine bouclée blanc crème, cadre ouvert en hévéa, bascule de 90° à 135°, 150 kg. Compact : 60 × 81 cm. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-design-scandinave"]}) { product { id handle } userErrors { field message } }
  a10_p: productUpdate(product:{id:"gid://shopify/Product/16616085160281", title:"Rocking chair en bouclette crème capitonnée, avec pouf", handle:"rocking-chair-bouclette-creme-avec-pouf", descriptionHtml:"<p><strong>Le fauteuil cocon et son pouf assorti : on s'installe, on allonge les jambes et on se laisse bercer.</strong></p>\n<ul>\n<li>Pouf repose-pieds assorti, inclus</li>\n<li>Bouclette crème douce, dossier capitonné</li>\n<li>Assise épaisse de 14 cm, dossier de 70 cm de large</li>\n<li>Bascule douce jusqu'à 105°, charge 120 kg</li>\n</ul>\n<h3>Les jambes allongées, enfin</h3>\n<p>Le pouf assorti mesure 56 × 43 cm : posez-y les pieds pour une vraie position de détente, ou utilisez-le comme assise d'appoint.</p>\n<h3>Une bascule douce en fin de journée</h3>\n<p>Les patins en bois accompagnent un balancement tranquille jusqu'à 105°. Le rythme idéal pour lire, bercer ou simplement souffler.</p>\n<h3>Une assise qui enveloppe</h3>\n<p>L'assise de 14 cm associe mousse haute résilience et garnissage ouate. Le dossier de 70 cm de large et 61 cm de haut vous accueille des épaules aux reins.</p>\n<h3>Vos bras bien posés</h3>\n<p>Les accoudoirs rembourrés se trouvent à 67,5 cm du sol. L'assise est à 52 cm : on s'assoit et on se relève sans se laisser tomber.</p>\n<h3>La pièce douce du salon</h3>\n<p>Capitonnage en carrés, bouclette crème, bois clair et métal noir : le fauteuil réchauffe un salon, une chambre ou un bureau.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fauteuil (largeur × profondeur × hauteur)</td>\n<td>72 × 97 × 100 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>52 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>48 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>56 cm</td>\n</tr>\n<tr>\n<td>Dossier (largeur × hauteur)</td>\n<td>70 × 61 cm</td>\n</tr>\n<tr>\n<td>Épaisseur de l'assise</td>\n<td>14 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du dossier</td>\n<td>11 cm</td>\n</tr>\n<tr>\n<td>Hauteur de l'accoudoir (sol)</td>\n<td>67,5 cm</td>\n</tr>\n<tr>\n<td>Pouf (largeur × profondeur × hauteur)</td>\n<td>56 × 43 × 41 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg (fauteuil), 120 kg (pouf)</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>20,7 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : le fauteuil occupe 97 cm de profondeur ; ajoutez la place du pouf devant lui et environ 50 cm derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Bouclette (70 % polyester, 30 % acrylique), crème</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute résilience et ouate</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Métal et panneau multicouche, patins en bois</td>\n</tr>\n<tr>\n<td>Inclus</td>\n<td>Fauteuil à bascule et pouf repose-pieds</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Oui, rembourrés</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler, notice fournie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>La bouclette se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil et son pouf arrivent à assembler, notice fournie.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le pouf est-il vendu avec le fauteuil ?</strong><br>\nOui, le pouf repose-pieds assorti est inclus. Il mesure 56 × 43 × 41 cm.</p>\n<p><strong>2. L'assise est-elle confortable longtemps ?</strong><br>\nL'assise fait 14 cm d'épaisseur, en mousse haute résilience et ouate, avec un dossier de 11 cm.</p>\n<p><strong>3. À quelle hauteur sont l'assise et les accoudoirs ?</strong><br>\nL'assise est à 52 cm du sol et les accoudoirs à 67,5 cm.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\nLe fauteuil mesure 72 cm de large et 97 cm de profondeur. Comptez la place du pouf devant et environ 50 cm derrière.</p>\n<p><strong>5. Quel poids supporte-t-il ?</strong><br>\n120 kg pour le fauteuil et 120 kg pour le pouf.</p>\n<p><strong>6. Le montage est-il fourni ?</strong><br>\nLe fauteuil s'assemble à réception, notice fournie.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair bouclette crème avec pouf | Bercelou", description:"Rocking chair en bouclette crème capitonnée et son pouf assorti : assise de 14 cm, dossier large, 120 kg. Livraison offerte en France."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["fauteuil-a-bascule", "rocking-chair-repose-pieds"]}) { product { id handle } userErrors { field message } }
  a11_p: productUpdate(product:{id:"gid://shopify/Product/16616086176089", title:"Rocking chair effet lin crème, cadre en bois clair", handle:"rocking-chair-effet-lin-creme-bois-clair", descriptionHtml:"<p><strong>Une assise large et profonde, un cadre en bois clair : le fauteuil lounge pour lire, faire la sieste ou bercer bébé.</strong></p>\n<ul>\n<li>Cadre et patins en bois d'hévéa, teinte naturelle</li>\n<li>Assise épaisse de 17,5 cm, dossier de 12,5 cm</li>\n<li>Coussin lombaire à housse amovible</li>\n<li>Bascule douce de 10° vers l'avant et l'arrière, 120 kg</li>\n</ul>\n<h3>Un fauteuil pour toute la maison</h3>\n<p>Chambre de bébé, sieste, lecture ou télévision : ce rocking chair lounge trouve sa place partout, avec son cadre en bois clair et son tissu crème.</p>\n<h3>Une assise profonde et moelleuse</h3>\n<p>L'assise de 58 × 56 cm repose sur un coussin de 17,5 cm d'épaisseur ; le dossier ajoute 12,5 cm de rembourrage.</p>\n<h3>Le dos bien soutenu</h3>\n<p>Le coussin lombaire de 49 × 31 cm se cale contre le dossier. Sa housse s'enlève pour un nettoyage facile.</p>\n<h3>Une bascule douce</h3>\n<p>Les patins en bois courbé basculent de 10° vers l'avant et 10° vers l'arrière. Un patin antidérapant évite que le fauteuil ne glisse.</p>\n<h3>Vos bras bien posés</h3>\n<p>Les accoudoirs en bois, larges et ouverts, encadrent l'assise à 44 cm du sol.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>64,5 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>92 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>81,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>44 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>58 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>56 cm</td>\n</tr>\n<tr>\n<td>Épaisseur de l'assise</td>\n<td>17,5 cm</td>\n</tr>\n<tr>\n<td>Dossier (largeur × hauteur)</td>\n<td>58 × 41 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du dossier</td>\n<td>12,5 cm</td>\n</tr>\n<tr>\n<td>Accoudoirs (longueur × hauteur)</td>\n<td>55 × 18 cm</td>\n</tr>\n<tr>\n<td>Coussin lombaire</td>\n<td>49 × 31 × 14 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>21,7 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 92 cm de profondeur au sol et environ 50 cm de dégagement derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu effet lin (100 % polyester), crème</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois d'hévéa peint et panneau multicouche</td>\n</tr>\n<tr>\n<td>Inclus</td>\n<td>Coussin lombaire à housse amovible</td>\n</tr>\n<tr>\n<td>Bascule</td>\n<td>10° avant, 10° arrière</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>La housse du coussin lombaire s'enlève pour le nettoyage. Le tissu du fauteuil se dépoussière à l'aspirateur, embout tissu ; traitez une tache localement, à l'eau tiède.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à assembler.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le coussin lombaire est-il inclus ?</strong><br>\nOui, il mesure 49 × 31 × 14 cm et sa housse s'enlève.</p>\n<p><strong>2. L'assise est-elle épaisse ?</strong><br>\nLe coussin d'assise fait 17,5 cm et celui du dossier 12,5 cm.</p>\n<p><strong>3. À quelle hauteur est l'assise ?</strong><br>\nÀ 44 cm du sol.</p>\n<p><strong>4. De combien bascule-t-il ?</strong><br>\nDe 10° vers l'avant et de 10° vers l'arrière.</p>\n<p><strong>5. Convient-il à une chambre de bébé ?</strong><br>\nOui, il est pensé pour la chambre de bébé comme pour la sieste, la lecture ou la télévision.</p>\n<p><strong>6. Quelle place prévoir ?</strong><br>\n64,5 cm de large, 92 cm de profondeur et 81,5 cm de haut. Laissez environ 50 cm derrière pour la bascule.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair effet lin crème, bois clair | Bercelou", description:"Rocking chair lounge en tissu effet lin crème, cadre en hévéa, assise de 17,5 cm, coussin lombaire déhoussable. 120 kg. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-bois-rotin"]}) { product { id handle } userErrors { field message } }
  a12_p: productUpdate(product:{id:"gid://shopify/Product/16616075952473", title:"Rocking chair en lin crème et bois teinte noyer, avec pouf", handle:"rocking-chair-lin-creme-cadre-noyer-avec-pouf", descriptionHtml:"<p><strong>Le charme mid-century d'un cadre en bois apparent, et un pouf assorti pour allonger les jambes le soir.</strong></p>\n<ul>\n<li>Cadre en bois d'hévéa massif, teinte noyer</li>\n<li>Pouf assorti inclus : repose-pieds, table d'appoint ou assise</li>\n<li>Coussins épais en mousse haute densité et ressorts</li>\n<li>Bascule douce sur 40°, charge 150 kg</li>\n</ul>\n<h3>Un coin lecture en un instant</h3>\n<p>Le cadre en bois apparent, le dossier capitonné de boutons et le tissu crème composent un fauteuil de lecture au caractère mid-century.</p>\n<h3>Une bascule douce</h3>\n<p>Le fauteuil se balance sur un angle de 40°, sur des patins en feutre antidérapants. Ses pieds réglables le gardent bien stable sur votre sol.</p>\n<h3>Une assise moelleuse et tenue</h3>\n<p>L'assise de 20 cm associe mousse haute densité et ressorts : elle reste souple sans s'affaisser. Le dossier haut soutient la nuque, le dos et les reins.</p>\n<h3>Un pouf, trois usages</h3>\n<p>Le pouf assorti accueille vos pieds, sert de table d'appoint pour la tasse de thé ou d'assise pour un invité. Il supporte jusqu'à 80 kg.</p>\n<h3>Tout à portée de main</h3>\n<p>La poche amovible sur le côté garde magazines, lunettes et télécommande.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Épaisseur du coussin d'assise</td>\n<td>20 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du coussin du pouf</td>\n<td>14 cm</td>\n</tr>\n<tr>\n<td>Angle de bascule</td>\n<td>40°</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg (fauteuil), 80 kg (pouf)</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>18,5 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez la place du pouf devant le fauteuil et environ 50 cm derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu coton et lin, crème</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité et ressorts</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois d'hévéa massif, teinte noyer</td>\n</tr>\n<tr>\n<td>Inclus</td>\n<td>Fauteuil à bascule et pouf assorti</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Bois, courbés</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Poche latérale amovible</td>\n</tr>\n<tr>\n<td>Pieds</td>\n<td>Patins en feutre antidérapants, pieds réglables</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg (fauteuil), 80 kg (pouf)</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le tissu se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter. Le bois s'essuie avec un chiffon doux et sec.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil et son pouf arrivent à assembler.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le pouf est-il inclus ?</strong><br>\nOui, le pouf assorti est livré avec le fauteuil. Il supporte jusqu'à 80 kg.</p>\n<p><strong>2. De quel bois est fait le cadre ?</strong><br>\nEn bois d'hévéa massif, teinté noyer, pour le fauteuil comme pour le pouf.</p>\n<p><strong>3. Le fauteuil risque-t-il d'abîmer mon parquet ?</strong><br>\nLes patins en feutre antidérapants protègent le sol, et les pieds réglables gardent le fauteuil stable.</p>\n<p><strong>4. L'assise est-elle confortable ?</strong><br>\nLe coussin d'assise mesure 20 cm d'épaisseur, en mousse haute densité avec des ressorts.</p>\n<p><strong>5. Quel poids supporte-t-il ?</strong><br>\n150 kg pour le fauteuil, 80 kg pour le pouf.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair lin crème, bois noyer et pouf | Bercelou", description:"Rocking chair mid-century en tissu coton-lin crème, cadre en hévéa massif teinte noyer, pouf assorti, assise à ressorts. 150 kg. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-bois-rotin", "rocking-chair-repose-pieds"]}) { product { id handle } userErrors { field message } }
  a13_p: productUpdate(product:{id:"gid://shopify/Product/16616085487961", title:"Rocking chair lounge effet lin, dossier réglable", handle:"rocking-chair-lounge-effet-lin-dossier-reglable", descriptionHtml:"<p><strong>Assis pour lire, allongé pour la sieste : un rocking chair moelleux qui suit toutes vos pauses.</strong></p>\n<ul>\n<li>Dossier réglable d'une pression, jusqu'à la position à plat</li>\n<li>Coussins épais de 20 cm, tissu effet lin respirant</li>\n<li>Assise basse façon lounge, large de 57 cm</li>\n<li>Patins en bois clair et patin antidérapant allongé</li>\n</ul>\n<h3>Réglages et confort</h3>\n<p>D'une simple pression, le dossier passe de la position assise droite à la position allongée. Lecture, sieste ou pause détente : choisissez votre angle.</p>\n<h3>Des coussins moelleux</h3>\n<p>L'assise et le dossier sont garnis de mousse élastique haute densité et habillés d'un tissu texturé effet lin. Les accoudoirs larges et le dossier galbé accompagnent tout le corps.</p>\n<h3>Une assise lounge</h3>\n<p>L'assise basse, à 29 cm du sol, invite à s'étirer et à se détendre, comme dans un fauteuil de salon cosy.</p>\n<h3>Une bascule douce et stable</h3>\n<p>Les patins élargis en bois clair et la structure en métal noir renforcé offrent un balancement stable. Le patin antidérapant allongé améliore l'adhérence au sol.</p>\n<h3>Des lignes épurées</h3>\n<p>Tissu blanc cassé, coque gris mat, bois clair : le fauteuil s'accorde aux intérieurs scandinaves, du salon au coin lecture.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>62 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>90,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>61 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>29 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>57 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du coussin d'assise</td>\n<td>20 cm</td>\n</tr>\n<tr>\n<td>Poids du fauteuil</td>\n<td>17,9 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>19 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 90,5 cm de profondeur au sol et un dégagement derrière le fauteuil pour abaisser le dossier.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu texturé effet lin, blanc cassé</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse élastique haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Métal noir renforcé, panneau de fibres, coque latérale gris mat</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Bois clair, patin antidérapant allongé</td>\n</tr>\n<tr>\n<td>Dossier</td>\n<td>Réglable, jusqu'à la position à plat</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler, notice et outil fournis</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le tissu se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter. La coque gris mat s'essuie avec un chiffon humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à assembler, avec sa notice et l'outil de montage.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment régler le dossier ?</strong><br>\nD'une simple pression : le dossier passe de la position droite à la position allongée.</p>\n<p><strong>2. L'assise est-elle basse ?</strong><br>\nOui, elle est à 29 cm du sol, une assise lounge pensée pour se détendre.</p>\n<p><strong>3. Les coussins sont-ils épais ?</strong><br>\nLe coussin d'assise mesure 20 cm d'épaisseur, en mousse élastique haute densité.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\n62 cm de large pour 90,5 cm de profondeur. Gardez un dégagement derrière pour abaisser le dossier.</p>\n<p><strong>5. Que contient le colis ?</strong><br>\nLe fauteuil, une notice de montage et un outil d'assemblage.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair lounge effet lin, dossier réglable | Bercelou", description:"Rocking chair lounge en tissu effet lin blanc cassé : dossier réglable jusqu'à plat, coussins épais de 20 cm, patins en bois clair. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-design-scandinave"]}) { product { id handle } userErrors { field message } }
  a14_p: productUpdate(product:{id:"gid://shopify/Product/16616086110553", title:"Rocking chair mid-century kaki, cadre en bois foncé", handle:"rocking-chair-mid-century-kaki-bois-fonce", descriptionHtml:"<p><strong>Des lignes vintage, des coussins épais couleur terre : le fauteuil de lecture qui donne du caractère au salon.</strong></p>\n<ul>\n<li>Cadre et patins en bois foncé, style mid-century</li>\n<li>Coussins d'assise et de dossier en mousse haute densité</li>\n<li>Soutien lombaire intégré au dossier</li>\n<li>Accoudoirs rembourrés, assise à 50 cm du sol</li>\n</ul>\n<h3>Un coin lecture en un instant</h3>\n<p>Le cadre en bois foncé et les coussins kaki composent un fauteuil de lecture au style mid-century, à sa place au salon, dans la chambre ou la véranda.</p>\n<h3>Une assise moelleuse</h3>\n<p>L'assise et le dossier sont garnis de mousse haute densité : on s'y enfonce avec plaisir en fin de journée.</p>\n<h3>Le dos bien soutenu</h3>\n<p>Le coussin de dossier intègre un soutien lombaire qui accompagne le bas du dos pendant la lecture.</p>\n<h3>Vos bras bien posés</h3>\n<p>Les accoudoirs rembourrés se trouvent à 60 cm du sol et l'assise à 50 cm : une assise à hauteur de chaise, où l'on prend appui pour se relever.</p>\n<h3>Une bascule douce</h3>\n<p>Les longs patins en bois foncé donnent au fauteuil un balancement tranquille.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>74 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>88 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Hauteur de l'accoudoir (sol)</td>\n<td>60 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>60 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>51 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du coussin d'assise</td>\n<td>10 cm</td>\n</tr>\n<tr>\n<td>Coussin de dossier (largeur × hauteur)</td>\n<td>58 × 45 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'accoudoir</td>\n<td>9 cm</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>12,7 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 88 cm de profondeur au sol et environ 50 cm de dégagement derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu kaki</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Cadre et patins en bois foncé</td>\n</tr>\n<tr>\n<td>Dossier</td>\n<td>Soutien lombaire intégré</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Rembourrés</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage simple, sans outil supplémentaire</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le tissu se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter. Le bois s'essuie avec un chiffon doux et sec.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil s'assemble simplement, le contenu du colis est détaillé.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quel style pour ce fauteuil ?</strong><br>\nUn style mid-century : cadre en bois foncé apparent, lignes droites et coussins épais couleur kaki.</p>\n<p><strong>2. À quelle hauteur sont l'assise et les accoudoirs ?</strong><br>\nL'assise est à 50 cm du sol, les accoudoirs à 60 cm.</p>\n<p><strong>3. Le dossier soutient-il le bas du dos ?</strong><br>\nOui, le coussin de dossier intègre un soutien lombaire.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\n74 cm de large pour 88 cm de profondeur. Laissez environ 50 cm derrière pour la bascule.</p>\n<p><strong>5. Faut-il des outils pour le monter ?</strong><br>\nL'assemblage est simple et ne demande pas d'outil supplémentaire dans la plupart des cas.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair mid-century kaki, bois foncé | Bercelou", description:"Rocking chair mid-century : cadre en bois foncé, coussins épais kaki en mousse haute densité, soutien lombaire intégré. Livraison offerte en France."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-bois-rotin"]}) { product { id handle } userErrors { field message } }
  a15_p: productUpdate(product:{id:"gid://shopify/Product/16616085553497", title:"Rocking chair en teddy crème, accoudoirs en bois", handle:"rocking-chair-teddy-creme-accoudoirs-bois", descriptionHtml:"<p><strong>La douceur du teddy, la chaleur du bois clair : un rocking chair pour se poser au calme, du salon à la chambre.</strong></p>\n<ul>\n<li>Velours teddy crème, doux au toucher</li>\n<li>Cadre, accoudoirs et patins en bois d'hévéa</li>\n<li>Assise épaisse de 15 cm, dossier galbé de 18 cm</li>\n<li>Bande de feutre antidérapante sous les patins</li>\n</ul>\n<h3>Une matière douce et chaleureuse</h3>\n<p>Le velours teddy crème habille l'assise et le dossier : une matière moelleuse pour les soirées sous un plaid.</p>\n<h3>Le dos bien soutenu</h3>\n<p>Le dossier galbé de 65 cm de haut et 18 cm d'épaisseur accompagne la courbe du dos, jusqu'à l'appui-tête.</p>\n<h3>Une assise généreuse</h3>\n<p>L'assise mesure 60 cm de large et 57 cm de profondeur, avec un coussin de 15 cm d'épaisseur.</p>\n<h3>Une bascule douce</h3>\n<p>Les patins incurvés en bois d'hévéa, garnis d'une bande de feutre antidérapante, offrent un balancement régulier et protègent votre sol.</p>\n<h3>Le bois clair au salon</h3>\n<p>Accoudoirs lisses et cadre apparent en bois naturel : le fauteuil apporte une note scandinave au salon comme à la chambre.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>65 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>90 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>98 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>60 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>57 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>44 à 53 cm</td>\n</tr>\n<tr>\n<td>Épaisseur de l'assise</td>\n<td>15 cm</td>\n</tr>\n<tr>\n<td>Dossier (largeur × hauteur)</td>\n<td>59 × 65 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du dossier</td>\n<td>18 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>19,5 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 90 cm de profondeur au sol et environ 50 cm de dégagement derrière le fauteuil.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Velours teddy (100 % polyester), crème</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois d'hévéa</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>En bois, lisses</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Bande de feutre antidérapante</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler, notice fournie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le teddy se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter. Le bois s'essuie avec un chiffon doux et sec.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à assembler, notice fournie.</p>\n<h2>FAQ</h2>\n<p><strong>1. Les accoudoirs sont-ils en bois ?</strong><br>\nOui, les accoudoirs lisses et le cadre sont en bois d'hévéa.</p>\n<p><strong>2. L'assise est-elle confortable ?</strong><br>\nElle mesure 60 × 57 cm avec un coussin de 15 cm d'épaisseur, et le dossier galbé fait 18 cm d'épaisseur.</p>\n<p><strong>3. À quelle hauteur est l'assise ?</strong><br>\nEntre 44 et 53 cm du sol selon la position de bascule.</p>\n<p><strong>4. Le fauteuil abîme-t-il le sol ?</strong><br>\nLes patins sont garnis d'une bande de feutre antidérapante qui protège le sol.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\n65 cm de large, 90 cm de profondeur et 98 cm de haut. Laissez environ 50 cm derrière pour la bascule.</p>\n<p><strong>6. Quel poids supporte-t-il ?</strong><br>\nLa charge maximale recommandée est de 120 kg.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair teddy crème, accoudoirs bois | Bercelou", description:"Rocking chair en velours teddy crème, cadre et accoudoirs en bois d'hévéa, assise de 15 cm, dossier galbé. 120 kg. Livraison offerte en France."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-bois-rotin"]}) { product { id handle } userErrors { field message } }

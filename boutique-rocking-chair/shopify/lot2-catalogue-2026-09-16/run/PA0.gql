  a0_p: productUpdate(product:{id:"gid://shopify/Product/16616085782873", title:"Chaise à bascule rétro en similicuir cognac, bois foncé", handle:"chaise-a-bascule-retro-similicuir-cognac", descriptionHtml:"<p><strong>Un similicuir cognac surpiqué, un cadre en bois teinte noyer : la chaise à bascule vintage qui se nettoie d'un coup d'éponge.</strong></p>\n<ul>\n<li>Similicuir cognac doux, facile à nettoyer</li>\n<li>Cadre et accoudoirs en bois massif, teinte noyer</li>\n<li>Dossier à surpiqûres verticales, coussins en mousse haute densité</li>\n<li>Bascule douce sur 40°, charge maximale 136 kg</li>\n</ul>\n<h3>Un style rétro chaleureux</h3>\n<p>Le similicuir cognac surpiqué et le cadre en bois teinte noyer donnent au fauteuil une allure vintage, à sa place au salon, dans la chambre ou le bureau.</p>\n<h3>Une matière facile à vivre</h3>\n<p>Le similicuir est doux au toucher et se nettoie d'un simple chiffon : un atout avec des enfants ou pour les tétées.</p>\n<h3>Une assise confortable</h3>\n<p>Les coussins en mousse haute densité restent confortables pendant les longues pauses. L'assise de 55 × 55 cm se trouve à 47 cm du sol.</p>\n<h3>Vos bras bien posés</h3>\n<p>Les accoudoirs en bois massif, lisses et droits, offrent un appui naturel pour s'installer et se relever.</p>\n<h3>Une bascule douce</h3>\n<p>Les pieds incurvés en bois massif vous balancent sur un angle de 40°, un mouvement apaisant pour lire ou bercer.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>62,5 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>86 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>88 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>47 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>55 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>55 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>56 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du coussin d'assise</td>\n<td>8 cm</td>\n</tr>\n<tr>\n<td>Angle de bascule</td>\n<td>40°</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>17 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 86 cm de profondeur au sol et environ 50 cm de dégagement derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Similicuir (PU) mat, cognac</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois massif, teinte noyer</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Bois massif</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Livré à plat, notice illustrée</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le similicuir s'essuie avec un chiffon doux légèrement humide. Le bois se dépoussière avec un chiffon sec.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. La chaise arrive à plat, à assembler avec la notice illustrée fournie.</p>\n<h2>FAQ</h2>\n<p><strong>1. Est-ce du cuir ?</strong><br>\nNon, c'est un similicuir (PU) mat, doux au toucher et facile à nettoyer.</p>\n<p><strong>2. À quelle hauteur est l'assise ?</strong><br>\nÀ 47 cm du sol, avec une assise de 55 × 55 cm.</p>\n<p><strong>3. De combien bascule-t-elle ?</strong><br>\nLes pieds incurvés offrent un balancement sur 40°.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\n62,5 cm de large, 86 cm de profondeur et 88 cm de haut. Laissez environ 50 cm derrière.</p>\n<p><strong>5. Quel poids supporte-t-elle ?</strong><br>\nLa charge maximale est de 136 kg.</p>\n<p><strong>6. Le montage est-il simple ?</strong><br>\nLa chaise est livrée à plat avec une notice détaillée et illustrée.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Chaise à bascule rétro similicuir cognac | Bercelou", description:"Chaise à bascule rétro en similicuir cognac, cadre en bois massif teinte noyer, assise à 47 cm, bascule sur 40°, 136 kg. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["chaise-a-bascule"]}) { product { id handle } userErrors { field message } }
  a1_p: productUpdate(product:{id:"gid://shopify/Product/16616085258585", title:"Fauteuil à bascule effet lin, à oreilles, avec repose-pieds", handle:"fauteuil-a-bascule-effet-lin-avec-repose-pieds", descriptionHtml:"<p><strong>Un dossier haut à oreilles, une assise large et son repose-pieds : le fauteuil des biberons de nuit et des lectures du dimanche.</strong></p>\n<ul>\n<li>Repose-pieds assorti, inclus</li>\n<li>Dossier haut à oreilles, entièrement rembourré</li>\n<li>Assise large de 60 cm, accoudoirs enveloppants</li>\n<li>Patins en hêtre, charge maximale 130 kg</li>\n</ul>\n<h3>Pour les tétées de nuit</h3>\n<p>Assise large, dossier haut et accoudoirs : le fauteuil vous accueille pour allaiter ou donner le biberon, dans la chambre de bébé comme au salon.</p>\n<h3>Les jambes allongées</h3>\n<p>Le repose-pieds assorti de 45 × 37 cm se place devant vous pour détendre les jambes pendant la tétée ou la lecture.</p>\n<h3>Le dos bien soutenu</h3>\n<p>Le dossier à oreilles, large de 63 cm et haut de 60 cm, soutient le dos jusqu'aux épaules.</p>\n<h3>Une bascule douce</h3>\n<p>Les pieds incurvés en hêtre vous balancent d'avant en arrière. Des patins protègent votre sol.</p>\n<h3>Il reste au salon après bébé</h3>\n<p>Son tissu effet lin et sa silhouette à oreilles lui donnent le charme d'un fauteuil d'antan, qui garde sa place au salon.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fauteuil (largeur × profondeur × hauteur)</td>\n<td>64 × 89 × 90 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>43 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>60 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>49 cm</td>\n</tr>\n<tr>\n<td>Coussin d'assise</td>\n<td>59 × 47 × 7 cm</td>\n</tr>\n<tr>\n<td>Dossier (largeur × hauteur)</td>\n<td>63 × 60 cm</td>\n</tr>\n<tr>\n<td>Repose-pieds (largeur × profondeur × hauteur)</td>\n<td>45 × 37 × 31 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>130 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>14,5 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 89 cm de profondeur pour le fauteuil, la place du repose-pieds devant lui et environ 50 cm derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu effet lin (100 % polyester)</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Acier, patins en bois de hêtre</td>\n</tr>\n<tr>\n<td>Inclus</td>\n<td>Fauteuil à bascule et repose-pieds</td>\n</tr>\n<tr>\n<td>Coloris disponibles</td>\n<td>Crème, gris</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>130 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage simple à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le tissu se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil et son repose-pieds arrivent à assembler.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le repose-pieds est-il fourni ?</strong><br>\nOui, il est livré avec le fauteuil et mesure 45 × 37 × 31 cm.</p>\n<p><strong>2. Le fauteuil convient-il pour allaiter ?</strong><br>\nOui : assise large, dossier haut à oreilles et accoudoirs en font un fauteuil adapté à la chambre de bébé.</p>\n<p><strong>3. À quelle hauteur est l'assise ?</strong><br>\nÀ 43 cm du sol.</p>\n<p><strong>4. Quels coloris sont disponibles ?</strong><br>\nCrème et gris.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\nLe fauteuil mesure 64 × 89 × 90 cm. Ajoutez la place du repose-pieds devant et environ 50 cm derrière.</p>\n<p><strong>6. Quel poids supporte-t-il ?</strong><br>\nLa charge maximale est de 130 kg.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil à bascule effet lin et repose-pieds | Bercelou", description:"Fauteuil à bascule à oreilles en tissu effet lin, dossier haut, repose-pieds assorti, patins en hêtre, 130 kg. Crème ou gris. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-design-scandinave", "rocking-chair-repose-pieds"]}) { product { id handle } userErrors { field message } }
  a2_p: productUpdate(product:{id:"gid://shopify/Product/16616085455193", title:"Fauteuil à bascule inclinable en velours côtelé terracotta", handle:"fauteuil-a-bascule-inclinable-velours-cotele-terracotta", descriptionHtml:"<p><strong>Assis pour lire, incliné pour la sieste, les jambes allongées : un seul fauteuil pour tous vos moments de détente.</strong></p>\n<ul>\n<li>Dossier inclinable en 4 positions, de 100° à 160°</li>\n<li>Repose-pieds qui se tire et se range sous l'assise</li>\n<li>Coussin lombaire amovible et poches sur les accoudoirs</li>\n<li>Grande assise, charge maximale 160 kg</li>\n</ul>\n<h3>Réglages et confort</h3>\n<p>Choisissez l'angle du dossier : 100° pour la télévision, 120° pour lire, 140° pour se reposer, 160° pour la sieste. Le repose-pieds se tire pour allonger les jambes.</p>\n<h3>Une grande assise enveloppante</h3>\n<p>Le fauteuil mesure 78 cm de large : l'assise généreuse accueille toutes les silhouettes et toutes les positions, jambes repliées comprises.</p>\n<h3>Le dos bien calé</h3>\n<p>Le coussin lombaire amovible se glisse au creux des reins, ou se serre contre soi pendant une pause.</p>\n<h3>Tout à portée de main</h3>\n<p>Les deux accoudoirs en métal portent de grandes pochettes pour la télécommande, le téléphone ou le roman en cours.</p>\n<h3>Une bascule douce sur patins en bois</h3>\n<p>La structure en métal renforcé repose sur des patins en bois massif : le balancement reste doux et stable.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>78 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>89 cm</td>\n</tr>\n<tr>\n<td>Emprise au sol (profondeur × largeur)</td>\n<td>87 × 88 cm</td>\n</tr>\n<tr>\n<td>Inclinaison du dossier</td>\n<td>100° à 160°, 4 positions</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>160 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>20,5 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez la longueur du repose-pieds déployé devant le fauteuil et un dégagement derrière pour incliner le dossier.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Velours côtelé épais, terracotta</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité (assise, dossier, repose-pieds)</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Métal renforcé, patins en bois massif</td>\n</tr>\n<tr>\n<td>Dossier</td>\n<td>Inclinable, 4 positions</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Coulissant, intégré</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Pochettes sur les deux accoudoirs</td>\n</tr>\n<tr>\n<td>Inclus</td>\n<td>Coussin lombaire amovible</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>160 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler, visserie et notice fournies</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le velours côtelé se dépoussière à l'aspirateur, embout tissu, dans le sens des côtes. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Les coussins arrivent compressés : dépliez-les et laissez-les reprendre leur volume avant l'assemblage. Visserie et notice illustrée fournies.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment régler le dossier ?</strong><br>\nLe dossier s'incline en 4 positions, de 100° à 160°, de la position lecture à la position sieste.</p>\n<p><strong>2. Le repose-pieds est-il intégré ?</strong><br>\nOui. Il se tire depuis l'avant de l'assise pour allonger les jambes, puis se range.</p>\n<p><strong>3. Le fauteuil convient-il aux grands gabarits ?</strong><br>\nL'assise est large et profonde, et la structure supporte jusqu'à 160 kg.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\nL'emprise au sol est de 87 × 88 cm, repose-pieds rangé. Ajoutez sa longueur devant et un dégagement derrière pour incliner le dossier.</p>\n<p><strong>5. Pourquoi les coussins sont-ils plats à la réception ?</strong><br>\nIls voyagent compressés. Dépliez-les et laissez-les reprendre leur volume avant de monter le fauteuil.</p>\n<p><strong>6. Le montage est-il fourni ?</strong><br>\nToute la visserie et une notice illustrée pas à pas sont dans le colis.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil à bascule inclinable côtelé terracotta | Bercelou", description:"Fauteuil à bascule en velours côtelé terracotta : dossier inclinable 4 positions, repose-pieds coulissant, coussin lombaire, 160 kg. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["fauteuil-a-bascule", "rocking-chair-repose-pieds"]}) { product { id handle } userErrors { field message } }
  a3_p: productUpdate(product:{id:"gid://shopify/Product/16616056422745", title:"Fauteuil à bascule à oreilles en tissu, avec tabouret", handle:"fauteuil-a-bascule-oreilles-tissu-avec-tabouret", descriptionHtml:"<p><strong>Un dossier haut à oreilles, un tabouret assorti pour les jambes : le fauteuil de détente qui donne de la couleur au salon.</strong></p>\n<ul>\n<li>Tabouret repose-pieds assorti, inclus</li>\n<li>Dossier haut à oreilles, surpiqûres en carreaux</li>\n<li>Assise à 47,5 cm, accoudoirs à 60,5 cm du sol</li>\n<li>2 coloris : bleu, noir</li>\n</ul>\n<h3>Les jambes allongées</h3>\n<p>Le tabouret de 47 × 31 cm se place devant le fauteuil : posez-y les pieds pour lire ou regarder un film.</p>\n<h3>Une bascule douce et stable</h3>\n<p>La structure en acier repose sur de longs patins en bois d'hévéa massif, qui gardent le fauteuil stable pendant le balancement.</p>\n<h3>Une assise à bonne hauteur</h3>\n<p>L'assise est à 47,5 cm du sol et les accoudoirs à 60,5 cm : on s'y installe et on prend appui pour se relever.</p>\n<h3>Un confort rembourré</h3>\n<p>La mousse, recouverte d'un tissu doux au toucher, garnit l'assise, le dossier à oreilles et le tabouret.</p>\n<h3>Deux teintes pour le salon</h3>\n<p>Bleu pour un salon apaisé, noir pour un intérieur graphique.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fauteuil (largeur × profondeur × hauteur)</td>\n<td>61 × 78 × 98 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>47 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>53,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>47,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur de l'accoudoir (sol)</td>\n<td>60,5 cm</td>\n</tr>\n<tr>\n<td>Tabouret (largeur × profondeur × hauteur)</td>\n<td>47 × 31 × 37,5 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>110 kg par siège</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 78 cm de profondeur pour le fauteuil, la place du tabouret devant lui et environ 50 cm derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu (100 % polyester)</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Acier, patins et pieds du tabouret en bois d'hévéa massif</td>\n</tr>\n<tr>\n<td>Inclus</td>\n<td>Fauteuil à bascule et tabouret</td>\n</tr>\n<tr>\n<td>Coloris disponibles</td>\n<td>Bleu, noir</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>110 kg par siège</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le tissu se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter. Éloignez le fauteuil des flammes et des sources de chaleur intense.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil et son tabouret arrivent à assembler.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le tabouret est-il inclus ?</strong><br>\nOui, le tabouret assorti est livré avec le fauteuil. Il mesure 47 × 31 × 37,5 cm.</p>\n<p><strong>2. Quels coloris sont disponibles ?</strong><br>\nBleu et noir.</p>\n<p><strong>3. À quelle hauteur sont l'assise et les accoudoirs ?</strong><br>\nL'assise est à 47,5 cm du sol, les accoudoirs à 60,5 cm.</p>\n<p><strong>4. Le fauteuil est-il stable ?</strong><br>\nSes longs patins en bois massif et sa structure en acier le gardent stable pendant la bascule.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\nLe fauteuil mesure 61 × 78 × 98 cm. Ajoutez la place du tabouret devant et environ 50 cm derrière.</p>\n<p><strong>6. Quel poids supporte-t-il ?</strong><br>\n110 kg par siège, pour le fauteuil comme pour le tabouret.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil à bascule à oreilles et tabouret | Bercelou", description:"Fauteuil à bascule à oreilles en tissu et son tabouret : accoudoirs à 60,5 cm, assise à 47,5 cm, 110 kg. Bleu ou noir. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-design-scandinave", "rocking-chair-repose-pieds"]}) { product { id handle } userErrors { field message } }
  a4_p: productUpdate(product:{id:"gid://shopify/Product/16616085684569", title:"Fauteuil à bascule teddy caramel, repose-pieds escamotable", handle:"fauteuil-a-bascule-teddy-caramel-repose-pieds", descriptionHtml:"<p><strong>Un fauteuil chaleureux qui berce, soutient le dos et sort son repose-pieds quand vous voulez allonger les jambes.</strong></p>\n<ul>\n<li>Repose-pieds qui se tire sous l'assise</li>\n<li>Dossier haut à coutures verticales, coussin d'assise épais</li>\n<li>Poche latérale pour garder l'essentiel à portée de main</li>\n<li>Base à bascule en bois, charge maximale 136 kg</li>\n</ul>\n<h3>Pour les tétées de nuit</h3>\n<p>Le dossier haut accompagne le dos et les épaules, la base en bois berce en douceur. Tirez le repose-pieds et installez-vous pour la nuit.</p>\n<h3>Les jambes allongées</h3>\n<p>Le repose-pieds se déploie depuis l'avant de l'assise, puis se range d'un geste : le fauteuil reste compact le reste du temps.</p>\n<h3>Vos bras bien posés</h3>\n<p>Les accoudoirs lisses et rembourrés offrent un appui confortable pendant la tétée ou la lecture.</p>\n<h3>Une matière chaude et douce</h3>\n<p>Le teddy caramel apporte une touche chaleureuse, douce au toucher, qui s'accorde au bois clair de la base.</p>\n<h3>Il reste au salon après bébé</h3>\n<p>Lignes nettes, ton caramel, bois naturel : le fauteuil devient ensuite le coin lecture du salon.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>99 cm</td>\n</tr>\n<tr>\n<td>Largeur</td>\n<td>63 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>48 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>48 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>66 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>22,4 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : laissez devant le fauteuil la place du repose-pieds déployé et environ 50 cm derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Teddy effet velours, caramel</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Base à bascule en bois</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Escamotable, sous l'assise</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Rembourrés, lisses</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Poche latérale</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le teddy se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à assembler.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment fonctionne le repose-pieds ?</strong><br>\nIl se tire depuis l'avant de l'assise pour soutenir les jambes, puis se range dessous.</p>\n<p><strong>2. Le fauteuil convient-il pour allaiter ?</strong><br>\nOui : dossier haut, accoudoirs rembourrés, poche latérale et bascule douce en font un fauteuil pensé pour la chambre de bébé.</p>\n<p><strong>3. Quelle est sa taille ?</strong><br>\n99 cm de haut pour 63 cm de large, avec une assise de 48 × 48 cm.</p>\n<p><strong>4. Quel poids supporte-t-il ?</strong><br>\nLa charge maximale est de 136 kg.</p>\n<p><strong>5. Quelle couleur exacte ?</strong><br>\nUn teddy caramel, chaud et lumineux, associé à une base en bois clair.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil à bascule teddy caramel, repose-pieds | Bercelou", description:"Fauteuil à bascule en teddy caramel : repose-pieds escamotable, dossier haut, poche latérale, base en bois, 136 kg. Livraison offerte en France."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["fauteuil-a-bascule", "rocking-chair-repose-pieds"]}) { product { id handle } userErrors { field message } }
  a5_p: productUpdate(product:{id:"gid://shopify/Product/16616085127513", title:"Fauteuil à bascule en teddy gris clair, dossier haut", handle:"fauteuil-a-bascule-teddy-gris-poches-laterales", descriptionHtml:"<p><strong>Un dossier qui soutient la tête, des bras bien posés et tout le nécessaire à portée de main, du berceau au coin lecture.</strong></p>\n<ul>\n<li>Dossier haut avec appui-tête rembourré</li>\n<li>Accoudoirs larges et moelleux, à 68 cm du sol</li>\n<li>Poche latérale pour le biberon, le livre ou la télécommande</li>\n<li>Base à bascule en bois massif, charge maximale 136 kg</li>\n</ul>\n<h3>Pour les tétées de nuit</h3>\n<p>Installez-vous dans un dossier haut qui accompagne la tête, la nuque et les épaules. La base en bois massif offre une bascule douce pour bercer bébé et vous poser vous-même.</p>\n<h3>Vos bras et votre dos bien soutenus</h3>\n<p>Les accoudoirs pleins et rembourrés se trouvent à 68 cm du sol et mesurent 21,5 cm de large : vos bras s'y posent sans effort pendant toute la tétée.</p>\n<h3>Tout à portée de main</h3>\n<p>Une grande poche sur le côté garde le biberon, le téléphone ou l'histoire du soir. Vous n'avez plus à vous relever pour attraper l'essentiel.</p>\n<h3>Une assise à bonne hauteur</h3>\n<p>L'assise est à 49 cm du sol, avec 48,5 cm de profondeur. Pour vous relever, avancez-vous au bord, arrêtez la bascule avec les pieds et prenez appui sur les accoudoirs.</p>\n<h3>Il reste au salon après bébé</h3>\n<p>Teddy gris clair, lignes nettes et bois naturel : le fauteuil trouve sa place dans le salon ou la chambre, pour lire ou se détendre en fin de journée.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>104 cm</td>\n</tr>\n<tr>\n<td>Largeur</td>\n<td>63 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>73 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>49 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>49 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>48,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>66 cm</td>\n</tr>\n<tr>\n<td>Hauteur de l'accoudoir (sol)</td>\n<td>68 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'accoudoir</td>\n<td>21,5 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>19 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez 73 cm de profondeur au sol et environ 50 cm de dégagement derrière le fauteuil pour une bascule libre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu teddy doux, gris clair</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Base à bascule en bois massif</td>\n</tr>\n<tr>\n<td>Dossier</td>\n<td>Haut, avec appui-tête rembourré</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Pleins et rembourrés</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Poche latérale</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage simple à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le teddy se dépoussière à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à assembler, en un seul colis.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le dossier soutient-il la tête ?</strong><br>\nOui. Le fauteuil mesure 104 cm de haut et son dossier se termine par un appui-tête rembourré.</p>\n<p><strong>2. Les accoudoirs conviennent-ils pour allaiter ?</strong><br>\nIls sont pleins, rembourrés, larges de 21,5 cm et placés à 68 cm du sol : vos bras s'y posent naturellement pendant la tétée.</p>\n<p><strong>3. Comment me relever avec bébé dans les bras ?</strong><br>\nL'assise est à 49 cm du sol. Avancez-vous au bord, arrêtez la bascule avec les pieds et appuyez-vous sur les accoudoirs pleins.</p>\n<p><strong>4. Quelle place dois-je prévoir ?</strong><br>\nLe fauteuil occupe 63 cm de large pour 73 cm de profondeur. Laissez environ 50 cm derrière lui pour basculer librement.</p>\n<p><strong>5. Quel poids le fauteuil supporte-t-il ?</strong><br>\nLa charge maximale est de 136 kg.</p>\n<p><strong>6. Le montage est-il compliqué ?</strong><br>\nLe fauteuil s'assemble simplement à réception.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil à bascule teddy gris, dossier haut | Bercelou", description:"Fauteuil à bascule en teddy gris clair : dossier haut, accoudoirs à 68 cm, poches latérales, base en bois massif, 136 kg. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["fauteuil-a-bascule"]}) { product { id handle } userErrors { field message } }
  a6_p: productUpdate(product:{id:"gid://shopify/Product/16616085324121", title:"Fauteuil à bascule XXL, coussin capitonné épais", handle:"fauteuil-a-bascule-xxl-coussin-capitonne", descriptionHtml:"<p><strong>Une assise extra-large où l'on se love en tailleur, un plaid sur les genoux, pour les soirées qui durent.</strong></p>\n<ul>\n<li>Assise extra-large, coussin de 97 cm de large</li>\n<li>Coussin capitonné épais, tout en rondeur</li>\n<li>Structure en métal noir, bascule douce</li>\n<li>3 coloris : terracotta, écru, gris anthracite</li>\n</ul>\n<h3>Un cocon pour s'y lover</h3>\n<p>La coque large accueille un coussin capitonné de 97 cm : assis en tailleur, allongé de biais ou blotti sous un plaid, vous trouvez votre position.</p>\n<h3>Un coin lecture en un instant</h3>\n<p>Posez-le près d'une fenêtre ou d'une bibliothèque : le fauteuil devient le rendez-vous du livre, du thé et de la sieste du dimanche.</p>\n<h3>Une bascule douce</h3>\n<p>La structure en métal noir porte l'assise sur deux arceaux : le balancement reste lent et apaisant.</p>\n<h3>Un tissu doux au quotidien</h3>\n<p>Le coussin est habillé d'un tissu doux, pensé pour la vie de famille, chat ou chien compris.</p>\n<h3>Trois coloris qui réchauffent la pièce</h3>\n<p>Terracotta pour une touche chaude, écru pour la douceur, gris anthracite pour un salon plus graphique.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Coussin (largeur × profondeur, une fois regonflé)</td>\n<td>97 × 70 cm</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>12,9 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez environ 1 m de large et un dégagement derrière le fauteuil pour une bascule libre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu doux</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Métal noir</td>\n</tr>\n<tr>\n<td>Coussin</td>\n<td>Capitonné, épais</td>\n</tr>\n<tr>\n<td>Coloris disponibles</td>\n<td>Terracotta, écru, gris anthracite</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage simple à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le coussin à l'aspirateur, embout tissu. Traitez une tache localement, à l'eau tiède, en tamponnant sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le coussin arrive compressé sous vide : sortez-le de son emballage et laissez-le reprendre son volume environ 2 jours avant de l'utiliser. Le fauteuil s'assemble simplement.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le fauteuil est-il vraiment spacieux ?</strong><br>\nOui. Le coussin mesure 97 cm de large pour 70 cm de profondeur une fois regonflé : on peut s'y asseoir en tailleur.</p>\n<p><strong>2. Pourquoi le coussin paraît-il plat à la réception ?</strong><br>\nIl voyage compressé sous vide. Laissez-lui environ 2 jours pour retrouver tout son volume.</p>\n<p><strong>3. Quels coloris sont disponibles ?</strong><br>\nTerracotta, écru et gris anthracite.</p>\n<p><strong>4. Le tissu convient-il si j'ai un animal ?</strong><br>\nLe coussin est habillé d'un tissu doux prévu pour la vie de famille, animaux compris.</p>\n<p><strong>5. Le montage est-il compliqué ?</strong><br>\nNon, le fauteuil s'assemble simplement à réception.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil à bascule XXL, coussin capitonné | Bercelou", description:"Fauteuil à bascule XXL : coque large, coussin capitonné épais de 97 cm, structure métal noir. Terracotta, écru ou gris anthracite. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["fauteuil-a-bascule"]}) { product { id handle } userErrors { field message } }
  a7_p: productUpdate(product:{id:"gid://shopify/Product/16616085979481", title:"Rocking chair en acier noir, coussin côtelé écru", handle:"rocking-chair-acier-noir-coussin-cotele-ecru", descriptionHtml:"<p><strong>Une ligne graphique en acier noir, un coussin moelleux qui enveloppe : le rocking chair lounge du salon moderne.</strong></p>\n<ul>\n<li>Structure en acier noir, lignes graphiques</li>\n<li>Coussin matelassé épais, effet velours côtelé écru</li>\n<li>Coussin amovible pour un entretien facile</li>\n<li>Patins antidérapants qui protègent le sol</li>\n</ul>\n<h3>Un coin lecture en un instant</h3>\n<p>Posez-le face à la fenêtre : le coussin épais et la position lounge invitent à la lecture, au repos ou à la sieste.</p>\n<h3>Un coussin qui enveloppe</h3>\n<p>Le coussin matelassé, effet velours côtelé écru, couvre l'assise et le dossier d'un seul tenant, avec 8 cm d'épaisseur.</p>\n<h3>Une bascule douce</h3>\n<p>Les longs arceaux en acier offrent un balancement apaisant. Les patins antidérapants protègent votre sol pendant le mouvement.</p>\n<h3>Un style graphique</h3>\n<p>Le contraste de l'acier noir et du coussin écru s'accorde aux intérieurs modernes, du salon à la chambre.</p>\n<h3>Du salon au balcon</h3>\n<p>La structure noire résiste bien aux intempéries : le fauteuil peut aussi profiter d'un balcon ou d'une véranda, coussin rentré après usage.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur</td>\n<td>82 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>116 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>38 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>54 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier</td>\n<td>56 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du coussin</td>\n<td>8 cm</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>11,1 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 116 cm de profondeur au sol et un dégagement derrière pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Structure</td>\n<td>Acier, finition noire</td>\n</tr>\n<tr>\n<td>Coussin</td>\n<td>Matelassé, épais, effet velours côtelé écru, amovible</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Antidérapants</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Intérieur ; balcon ou terrasse avec coussin rentré</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler, visserie et notice illustrée fournies</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le coussin s'enlève pour le nettoyage. Dépoussiérez-le à l'aspirateur et traitez une tache localement, à l'eau tiède. La structure s'essuie avec un chiffon humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive en colis plat, avec toute la visserie et une notice illustrée.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le coussin s'enlève-t-il ?</strong><br>\nOui, il est amovible pour faciliter l'entretien.</p>\n<p><strong>2. Peut-on l'utiliser dehors ?</strong><br>\nLa structure en acier noir résiste bien aux intempéries. Rentrez le coussin après usage pour le garder net.</p>\n<p><strong>3. L'assise est-elle basse ?</strong><br>\nOui, elle est à 38 cm du sol, une position lounge pour se détendre.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\nLe fauteuil mesure 116 cm de profondeur au sol pour 82 cm de haut. Gardez un dégagement derrière pour la bascule.</p>\n<p><strong>5. Le fauteuil raye-t-il le sol ?</strong><br>\nLes patins antidérapants protègent le sol pendant la bascule.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Rocking chair acier noir, coussin côtelé écru | Bercelou", description:"Rocking chair lounge à structure en acier noir et coussin matelassé côtelé écru, épais et amovible. Salon, chambre ou balcon. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["rocking-chair-design-scandinave"]}) { product { id handle } userErrors { field message } }

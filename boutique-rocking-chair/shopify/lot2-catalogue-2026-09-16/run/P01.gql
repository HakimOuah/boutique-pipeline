  x9_p: productUpdate(product:{id:"gid://shopify/Product/16616092664153", title:"Fauteuil à bascule en velours côtelé, repose-pieds intégré", handle:"fauteuil-a-bascule-velours-cotele-repose-pieds-integre", descriptionHtml:"<p><strong>Assis pour la tétée, dossier incliné pour souffler, jambes allongées pour la sieste : un seul fauteuil pour trois positions.</strong></p>\n<ul>\n<li>Repose-pieds extensible, rangé sous l'assise</li>\n<li>Dossier réglable sur 3 positions</li>\n<li>Coussin lombaire et sac de rangement inclus</li>\n<li>Structure en bois massif, charge jusqu'à 150 kg</li>\n</ul>\n<h3>Pour les tétées de nuit</h3>\n<p>Installez-vous, tirez le repose-pieds et bercez bébé : le fauteuil accompagne les tétées au calme, dans la chambre d'enfant comme au salon.</p>\n<h3>Réglages et confort</h3>\n<p>Le dossier se règle sur trois positions : droit pour allaiter ou lire, incliné pour vous reposer, plus bas encore pour étendre les jambes. Le repose-pieds sort de sous l'assise et se replie quand vous n'en avez plus besoin.</p>\n<h3>Vos bras et votre dos bien soutenus</h3>\n<p>Le coussin lombaire assorti soutient le bas du dos pendant les longues séances. Les accoudoirs en bois massif encadrent l'assise, et le sac latéral se fixe à gauche ou à droite pour garder un livre, une tablette ou les petites affaires de bébé.</p>\n<h3>Une matière douce et facile à vivre</h3>\n<p>Le velours côtelé écru, à fines côtes, est doux au toucher et respirant. Le siège et le dossier sont garnis de mousse haute densité, avec un dossier matelassé qui répartit l'appui.</p>\n<h3>Il reste au salon après bébé</h3>\n<p>Accoudoirs en bois teinté, velours côtelé et lignes rétro : le fauteuil devient ensuite le coin lecture du salon.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>92 cm</td>\n</tr>\n<tr>\n<td>Largeur</td>\n<td>70 cm</td>\n</tr>\n<tr>\n<td>Profondeur (repose-pieds rentré)</td>\n<td>80 cm</td>\n</tr>\n<tr>\n<td>Profondeur (repose-pieds sorti)</td>\n<td>114 cm</td>\n</tr>\n<tr>\n<td>Longueur en position allongée</td>\n<td>134 cm</td>\n</tr>\n<tr>\n<td>Hauteur en position allongée</td>\n<td>74 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>46 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>54 cm</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>36 × 22 cm</td>\n</tr>\n<tr>\n<td>Coussin lombaire</td>\n<td>51 × 22 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>84 × 22 × 66 cm, 19 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez 134 cm de longueur pour profiter de la position allongée, et 50 cm de dégagement derrière le fauteuil pour la bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Velours côtelé écru</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois massif</td>\n</tr>\n<tr>\n<td>Dossier</td>\n<td>Réglable sur 3 positions</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Extensible et repliable</td>\n</tr>\n<tr>\n<td>Accessoires</td>\n<td>Coussin lombaire, sac de rangement latéral</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le velours côtelé à l'aspirateur, embout tissu, dans le sens des côtes. Une tache se traite localement avec un chiffon légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à monter.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment fonctionne le repose-pieds ?</strong><br>\nIl se tire de sous l'assise pour soutenir les jambes, puis se replie. Repose-pieds sorti, le fauteuil mesure 114 cm de profondeur.</p>\n<p><strong>2. Le dossier est-il réglable ?</strong><br>\nOui, sur trois positions : assise droite, repos et position allongée.</p>\n<p><strong>3. Quelle est la hauteur d'assise ?</strong><br>\n46 cm du sol. Pour vous relever avec bébé, repliez le repose-pieds, avancez-vous et prenez appui sur les accoudoirs en bois.</p>\n<p><strong>4. Quelle charge le fauteuil supporte-t-il ?</strong><br>\nJusqu'à 150 kg, grâce à sa structure en bois massif.</p>\n<p><strong>5. Quels accessoires sont fournis ?</strong><br>\nUn coussin lombaire assorti de 51 × 22 cm et un sac de rangement qui se fixe à gauche ou à droite.</p>\n<p><strong>6. Quelle place prévoir ?</strong><br>\n70 cm de large pour 80 cm de profondeur, jusqu'à 134 cm en position allongée. Laissez 50 cm derrière pour la bascule.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil à bascule velours côtelé, repose-pieds | Bercelou", description:"Fauteuil à bascule en velours côtelé écru : repose-pieds extensible, dossier 3 positions, coussin lombaire, charge 150 kg. Livraison offerte."}, productType:"Fauteuil à bascule", vendor:"Bercelou", tags:["fauteuil-allaitement", "rocking-chair-repose-pieds", "fauteuil-a-bascule"]}) { product { id handle } userErrors { field message } }
  x10_p: productUpdate(product:{id:"gid://shopify/Product/16616092729689", title:"Fauteuil d'allaitement bouclette blanche, repose-pieds, USB", handle:"fauteuil-allaitement-bouclette-blanche-usb", descriptionHtml:"<p><strong>Jambes allongées, téléphone en charge, bébé bercé : tout est prévu pour les longues tétées de nuit.</strong></p>\n<ul>\n<li>Repose-pieds extensible, rangé sous l'assise</li>\n<li>Ports USB et USB-C dans l'accoudoir, poche de chaque côté</li>\n<li>Dossier haut capitonné de 62,5 cm, assise à 50 cm du sol</li>\n<li>Structure en bois massif, charge jusqu'à 136 kg</li>\n</ul>\n<h3>Pour les tétées de nuit</h3>\n<p>La bascule en bois massif oscille d'environ 30° de chaque côté, avec une butée qui limite le basculement. Le mouvement reste régulier et doux pour accompagner l'endormissement de bébé.</p>\n<h3>Vos bras et votre dos bien soutenus</h3>\n<p>Le dossier capitonné remonte à 62,5 cm au-dessus de l'assise, pour les épaules et la nuque. Les accoudoirs arrondis, à 67 cm du sol, entourent vos bras, et l'assise de 49 cm de large accueille confortablement.</p>\n<h3>Les jambes au repos</h3>\n<p>Le repose-pieds, habillé de la même bouclette, glisse hors de l'assise sur un cadre en métal. Vous passez de la position assise aux jambes allongées en un geste, puis le rangez.</p>\n<h3>Tout à portée de main</h3>\n<p>Chaque accoudoir porte une poche en tissu pour le téléphone, un livre ou une télécommande. L'accoudoir intègre aussi des ports USB et USB-C : reliez le câble du fauteuil à un adaptateur secteur USB (non fourni) et rechargez votre téléphone sans vous lever.</p>\n<h3>Il reste au salon après bébé</h3>\n<p>Bouclette blanc lait et bois naturel : le fauteuil s'accorde aux intérieurs scandinaves et épurés, et devient le fauteuil de lecture du salon.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>102 cm</td>\n</tr>\n<tr>\n<td>Largeur</td>\n<td>66,5 cm</td>\n</tr>\n<tr>\n<td>Profondeur (repose-pieds rentré)</td>\n<td>72,5 cm</td>\n</tr>\n<tr>\n<td>Profondeur (repose-pieds sorti)</td>\n<td>121,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier (depuis l'assise)</td>\n<td>62,5 cm</td>\n</tr>\n<tr>\n<td>Largeur du dossier</td>\n<td>51,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>49 × 49,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs (sol)</td>\n<td>67 cm</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>33 × 20,5 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Poids du fauteuil</td>\n<td>19,2 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>74 × 67 × 43 cm, 21,7 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 121,5 cm de profondeur repose-pieds sorti et 50 cm de dégagement derrière pour la bascule. Prévoyez une prise à proximité pour la recharge USB.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Bouclette blanche</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse épaisse haute élasticité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois massif, repose-pieds sur cadre métal</td>\n</tr>\n<tr>\n<td>Bascule</td>\n<td>Environ 30° de chaque côté, butée anti-basculement</td>\n</tr>\n<tr>\n<td>Repose-pieds</td>\n<td>Extensible</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Une poche sur chaque accoudoir</td>\n</tr>\n<tr>\n<td>Recharge</td>\n<td>Ports USB et USB-C dans l'accoudoir, alimentation par câble USB sur adaptateur secteur non fourni</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>136 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Assemblage à réception</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Blanc</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Retirez la poussière de la bouclette avec une brosse adhésive ou un chiffon humide. Une tache se traite localement, sans passage en machine.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à monter.</p>\n<h2>FAQ</h2>\n<p><strong>1. Comment fonctionne la recharge USB ?</strong><br>\nLes ports USB et USB-C se trouvent dans l'accoudoir. Le fauteuil est relié par un câble USB à brancher sur un adaptateur secteur USB, non fourni.</p>\n<p><strong>2. Le fauteuil est-il électrique ?</strong><br>\nNon, la bascule et le repose-pieds sont manuels. Seuls les ports de recharge ont besoin d'être alimentés.</p>\n<p><strong>3. Pourrai-je me relever avec bébé dans les bras ?</strong><br>\nL'assise est à 50 cm du sol et les accoudoirs à 67 cm. Rangez le repose-pieds, avancez-vous au bord et prenez appui sur les accoudoirs.</p>\n<p><strong>4. Quelle charge le fauteuil supporte-t-il ?</strong><br>\nJusqu'à 136 kg, sur une structure en bois massif.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\n66,5 cm de large pour 72,5 cm de profondeur, 121,5 cm repose-pieds sorti. Ajoutez 50 cm derrière pour la bascule.</p>\n<p><strong>6. Comment entretenir la bouclette blanche ?</strong><br>\nUne brosse adhésive ou un chiffon humide suffit pour la poussière. Traitez une tache localement, sans machine.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil d'allaitement bouclette blanche, USB | Bercelou", description:"Fauteuil à bascule d'allaitement en bouclette blanche : repose-pieds extensible, ports USB et USB-C, poches, charge 136 kg. Livraison offerte."}, productType:"Fauteuil d'allaitement", vendor:"Bercelou", tags:["fauteuil-allaitement", "rocking-chair-repose-pieds", "fauteuil-a-bascule"]}) { product { id handle } userErrors { field message } }
  x11_p: productUpdate(product:{id:"gid://shopify/Product/16616092631385", title:"Fauteuil d'allaitement en bouclette avec pouf et appui-tête", handle:"fauteuil-allaitement-bouclette-pouf-appui-tete", descriptionHtml:"<p><strong>Les jambes posées sur le pouf, la tête calée, le dos soutenu : l'ensemble complet pour les longues tétées.</strong></p>\n<ul>\n<li>Pouf assorti de 46,5 × 34 cm pour poser les jambes</li>\n<li>Appui-tête et coussin lombaire, pour la nuque et le bas du dos</li>\n<li>Dossier enveloppant de 59,5 cm, charge jusqu'à 150 kg</li>\n<li>Montage en 10 à 15 minutes, outils fournis</li>\n</ul>\n<h3>Pour les tétées de nuit</h3>\n<p>Le fauteuil et son pouf forment un vrai coin d'allaitement : vous vous installez, vous allongez les jambes et vous bercez bébé en douceur sur les pieds à bascule en bois d'hévéa.</p>\n<h3>Vos bras et votre dos bien soutenus</h3>\n<p>Le dossier ailé remonte à 59,5 cm au-dessus de l'assise. Un appui-tête cale la nuque et un coussin lombaire comble le creux du bas du dos. Les accoudoirs rembourrés enveloppent vos bras.</p>\n<h3>Les jambes au repos</h3>\n<p>Le pouf assorti, haut de 40,5 cm, se place devant le fauteuil pour surélever les jambes pendant la tétée. Il se glisse ailleurs dans la pièce quand vous n'en avez pas besoin.</p>\n<h3>Une bouclette douce au toucher</h3>\n<p>La bouclette écrue habille le fauteuil et le pouf. Elle recouvre une mousse haute densité qui reste moelleuse et ferme pendant les longues soirées.</p>\n<h3>Il reste au salon après bébé</h3>\n<p>Cadre métal noir, pieds à bascule en bois clair, bouclette écrue : l'ensemble s'intègre au salon pour lire, se détendre ou se poser le soir.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>92,5 cm</td>\n</tr>\n<tr>\n<td>Largeur</td>\n<td>75 cm</td>\n</tr>\n<tr>\n<td>Profondeur au sol</td>\n<td>75 cm</td>\n</tr>\n<tr>\n<td>Largeur aux accoudoirs</td>\n<td>77 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier (depuis l'assise)</td>\n<td>59,5 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>41,5 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>55 cm</td>\n</tr>\n<tr>\n<td>Pouf (largeur × profondeur × hauteur)</td>\n<td>46,5 × 34 × 40,5 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du coussin du pouf</td>\n<td>9 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Taille d'utilisateur conseillée</td>\n<td>jusqu'à 178 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>76 × 40 × 68 cm, 18 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez environ 75 × 77 cm au sol pour le fauteuil, la place du pouf devant, et 50 cm de dégagement derrière pour une bascule libre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Bouclette écrue</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Cadre en métal, pieds à bascule en bois d'hévéa</td>\n</tr>\n<tr>\n<td>Accessoires</td>\n<td>Pouf assorti, appui-tête, coussin lombaire</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Oui, rembourrés</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Poche latérale</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Antidérapants</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>150 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>10 à 15 minutes, outils fournis</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Écru</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez la bouclette à l'aspirateur, embout tissu. Une tache se traite localement, à l'eau tiède, avec un chiffon doux.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive à monter, en 10 à 15 minutes avec les outils fournis.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le pouf est-il inclus ?</strong><br>\nOui, le pouf assorti en bouclette est livré avec le fauteuil. Il mesure 46,5 × 34 cm pour 40,5 cm de haut.</p>\n<p><strong>2. Le dossier soutient-il la tête ?</strong><br>\nLe dossier remonte à 59,5 cm au-dessus de l'assise et reçoit un appui-tête pour caler la nuque. Un coussin lombaire soutient aussi le bas du dos.</p>\n<p><strong>3. Quelle charge le fauteuil supporte-t-il ?</strong><br>\nJusqu'à 150 kg, pour une taille d'utilisateur conseillée jusqu'à 178 cm.</p>\n<p><strong>4. Le montage est-il compliqué ?</strong><br>\nComptez 10 à 15 minutes, avec les outils fournis.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\nLe fauteuil occupe 75 × 77 cm au sol pour 92,5 cm de haut. Ajoutez la place du pouf devant et 50 cm derrière pour la bascule.</p>\n<p><strong>6. Le fauteuil abîme-t-il le parquet ?</strong><br>\nLes pieds à bascule en bois reçoivent des patins antidérapants qui protègent le sol et évitent que le fauteuil ne glisse.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil d'allaitement bouclette et pouf | Bercelou", description:"Fauteuil à bascule d'allaitement en bouclette écrue avec pouf assorti, appui-tête et coussin lombaire. Charge 150 kg. Livraison offerte en France."}, productType:"Fauteuil d'allaitement", vendor:"Bercelou", tags:["fauteuil-allaitement", "rocking-chair-repose-pieds", "fauteuil-a-bascule"]}) { product { id handle } userErrors { field message } }
  x12_p: productUpdate(product:{id:"gid://shopify/Product/16616092598617", title:"Fauteuil à bascule d'allaitement capitonné, poches latérales", handle:"fauteuil-allaitement-capitonne-poches", descriptionHtml:"<p><strong>Un dossier haut qui soutient le dos, une assise haute pour vous relever plus facilement, et tout le nécessaire des tétées à portée de main.</strong></p>\n<ul>\n<li>Dossier capitonné de 64 cm, pour soutenir le haut du dos</li>\n<li>Assise à 53 cm du sol, pour vous relever avec bébé dans les bras</li>\n<li>Poches latérales pour le biberon, le téléphone ou un livre</li>\n<li>Pieds à bascule en bois d'hévéa, avec patins antidérapants</li>\n</ul>\n<h3>Pour les tétées de nuit</h3>\n<p>Installez-vous dans un dossier haut et un coussin d'assise moelleux. La bascule douce sur pieds en bois accompagne l'endormissement de bébé, pendant que vous restez bien calée.</p>\n<h3>Vos bras et votre dos bien soutenus</h3>\n<p>Le dossier capitonné remonte à 64 cm au-dessus de l'assise et mesure 51 cm de large : le haut du dos et les épaules reposent contre lui pendant toute la tétée. Les accoudoirs pleins et arrondis accueillent vos avant-bras.</p>\n<h3>Se relever en douceur</h3>\n<p>L'assise se trouve à 53 cm du sol, une hauteur qui aide à se relever. Avancez-vous au bord, arrêtez la bascule avec les pieds et prenez appui sur les accoudoirs pleins.</p>\n<h3>Tout à portée de main</h3>\n<p>Une poche sur le côté garde le biberon, le téléphone, la télécommande ou un livre, sans avoir à vous lever.</p>\n<h3>Il reste au salon après bébé</h3>\n<p>Gris anthracite, gris clair ou écru en bouclette : le fauteuil garde sa place dans la chambre ou le salon bien après les tétées de nuit, pour lire ou se poser le soir.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hauteur totale</td>\n<td>86 cm</td>\n</tr>\n<tr>\n<td>Hauteur du dossier (depuis l'assise)</td>\n<td>64 cm</td>\n</tr>\n<tr>\n<td>Largeur du dossier</td>\n<td>51 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>53 cm</td>\n</tr>\n<tr>\n<td>Largeur de l'assise</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Profondeur de l'assise</td>\n<td>49,5 cm</td>\n</tr>\n<tr>\n<td>Emprise au sol (largeur × profondeur)</td>\n<td>66 × 65 cm</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>74 × 55 × 46 cm, 25 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez environ 65 cm de profondeur au sol et 50 cm de dégagement derrière le fauteuil pour une bascule libre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu rembourré (bouclette pour le coloris écru)</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Bois, pieds à bascule en bois d'hévéa</td>\n</tr>\n<tr>\n<td>Dossier</td>\n<td>Haut, capitonné</td>\n</tr>\n<tr>\n<td>Rangement</td>\n<td>Poches latérales</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Antidérapants</td>\n</tr>\n<tr>\n<td>Coloris disponibles</td>\n<td>Gris anthracite, gris clair, écru</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu à l'aspirateur, embout tissu. Une tache se traite localement avec un chiffon légèrement humide, sans frotter.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 74 × 55 × 46 cm pour 25 kg.</p>\n<h2>FAQ</h2>\n<p><strong>1. Pourrai-je me relever avec bébé dans les bras ?</strong><br>\nL'assise est à 53 cm du sol, une hauteur qui facilite le lever. Avancez-vous au bord de l'assise, arrêtez la bascule et prenez appui sur les accoudoirs pleins.</p>\n<p><strong>2. Le dossier soutient-il bien le dos ?</strong><br>\nLe dossier capitonné remonte à 64 cm au-dessus de l'assise, sur 51 cm de large : il soutient le dos jusqu'aux épaules.</p>\n<p><strong>3. À quoi servent les poches latérales ?</strong><br>\nElles gardent à portée de main le biberon, un lange, le téléphone ou un livre pendant la tétée.</p>\n<p><strong>4. Quelle place prévoir ?</strong><br>\nLe fauteuil occupe 66 × 65 cm au sol pour 86 cm de haut. Laissez 50 cm derrière lui pour une bascule libre.</p>\n<p><strong>5. Quels coloris sont disponibles ?</strong><br>\nGris anthracite et gris clair en tissu doux, ou écru en bouclette.</p>\n<p><strong>6. Le fauteuil abîme-t-il le sol ?</strong><br>\nLes pieds à bascule en bois d'hévéa sont équipés de patins antidérapants qui protègent le sol et stabilisent la bascule.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil d'allaitement capitonné à bascule | Bercelou", description:"Fauteuil à bascule d'allaitement capitonné : dossier de 64 cm, assise à 53 cm du sol, poches latérales. 3 coloris. Livraison offerte en France."}, productType:"Fauteuil d'allaitement", vendor:"Bercelou", tags:["fauteuil-allaitement", "fauteuil-a-bascule"]}) { product { id handle } userErrors { field message } }
  x13_p: productUpdate(product:{id:"gid://shopify/Product/16616074838361", title:"Fauteuil cocon sur pieds en rotin naturel, avec pouf", handle:"fauteuil-cocon-rotin-naturel-avec-pouf", descriptionHtml:"<p><strong>Une bulle tressée, des coussins moelleux et un pouf pour allonger les jambes : votre coin à soi, dedans comme dehors.</strong></p>\n<ul>\n<li>Fauteuil cocon et pouf assorti, livrés ensemble</li>\n<li>Coussins crème épais, maintenus par des liens</li>\n<li>Rotin PE résistant aux UV et à l'eau</li>\n<li>Pouf 3 en 1 : repose-pieds, table d'appoint ou siège, jusqu'à 120 kg</li>\n</ul>\n<p>Un fauteuil cocon posé sur pieds, tressé en rotin PE couleur naturelle, avec son pouf assorti. Il crée un coin lecture ou café sur la terrasse, le balcon ou au salon.</p>\n<h3>On s'y love</h3>\n<p>La coque haute de 147 cm enveloppe l'assise. Les coussins épais garnis de coton PP invitent à rester longtemps.</p>\n<h3>Les jambes posées</h3>\n<p>Le pouf assorti sert de repose-pieds, de petite table pour un plateau ou de siège d'appoint pour un invité. Il supporte jusqu'à 120 kg.</p>\n<h3>Sur la terrasse</h3>\n<p>Le rotin PE résiste aux UV, à l'eau et aux intempéries modérées. La structure en acier thermolaqué et les patins réglables gardent l'ensemble stable.</p>\n<h3>Des coussins qui restent en place</h3>\n<p>Des liens de fixation retiennent les coussins quand vous vous asseyez ou vous adossez.</p>\n<h3>Une matière naturelle et lumineuse</h3>\n<p>Le tressage couleur naturelle et les coussins crème apportent une touche bohème à un intérieur clair.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fauteuil (L × l × H)</td>\n<td>76 × 65 × 147 cm</td>\n</tr>\n<tr>\n<td>Assise (l × P)</td>\n<td>60 × 54 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>38 cm</td>\n</tr>\n<tr>\n<td>Pouf (L × l × H)</td>\n<td>66 × 42 × 41 cm</td>\n</tr>\n<tr>\n<td>Charge maximale du pouf</td>\n<td>120 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez environ 1,20 m de profondeur pour le fauteuil et le pouf placés l'un devant l'autre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tressage</td>\n<td>Rotin PE, résistant aux UV et à l'eau</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Acier thermolaqué, patins réglables</td>\n</tr>\n<tr>\n<td>Coussins</td>\n<td>Garnissage coton PP, liens de fixation</td>\n</tr>\n<tr>\n<td>Pouf</td>\n<td>Inclus</td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>Intérieur et extérieur</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Rotin naturel, coussins crème</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Environ 1 heure, seul, instructions fournies</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tressage avec une brosse douce ou un chiffon humide. Rentrez les coussins par temps de pluie.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Colis de 83 × 62 × 42 cm pour 18,5 kg. Montage en une heure environ, seul, avec les instructions fournies.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le pouf est-il inclus ?</strong><br>\nOui, le pouf assorti est livré avec le fauteuil cocon.</p>\n<p><strong>2. Peut-il aller dehors ?</strong><br>\nOui, le rotin PE résiste aux UV et à l'eau. Rentrez les coussins par temps de pluie.</p>\n<p><strong>3. Le fauteuil est-il suspendu ?</strong><br>\nNon, il repose sur quatre pieds en acier, sans chaîne ni perçage.</p>\n<p><strong>4. Quelle est la hauteur d'assise ?</strong><br>\nL'assise est à 38 cm du sol, pour 60 × 54 cm de surface.</p>\n<p><strong>5. Le montage est-il long ?</strong><br>\nComptez environ une heure, seul, avec les instructions fournies.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil cocon en rotin naturel et son pouf | Bercelou", description:"Fauteuil cocon sur pieds en rotin PE naturel avec pouf assorti, coussins crème épais, intérieur et extérieur. Livraison offerte."}, productType:"Fauteuil cocon", vendor:"Bercelou", tags:["fauteuil-cocon"]}) { product { id handle } userErrors { field message } }
  x14_p: productUpdate(product:{id:"gid://shopify/Product/16616084799833", title:"Fauteuil enfant en mousse et teddy gris, avec poignée", handle:"fauteuil-enfant-mousse-teddy-gris", descriptionHtml:"<p><strong>Son petit fauteuil tout doux, qu'il emmène lui-même du coin lecture à la salle de jeux.</strong></p>\n<ul>\n<li>Tout en mousse haute densité, sans structure rigide</li>\n<li>Housse teddy grise, déhoussable et lavable en machine</li>\n<li>Poignée pour le déplacer facilement</li>\n<li>Aucun montage</li>\n</ul>\n<h3>Un fauteuil à sa taille</h3>\n<p>Avec 41 cm de haut, ce petit fauteuil club est pensé pour les enfants dès 3 ans. L'assise de 41 cm de large laisse la place de s'installer avec un livre ou une peluche.</p>\n<h3>Tout doux, tout en mousse</h3>\n<p>Le fauteuil est entièrement en mousse haute densité, recouverte d'une housse en polaire teddy grise, douce au toucher. Dossier épais et accoudoirs arrondis entourent l'enfant.</p>\n<h3>Une housse qui passe en machine</h3>\n<p>La housse se retire par sa fermeture éclair et se lave en machine : chocolat, feutres et petits accidents ne sont plus un souci.</p>\n<h3>Il le déplace tout seul</h3>\n<p>Léger, avec sa poignée sur le dossier, le fauteuil suit l'enfant de la chambre au salon. Sa base antidérapante le garde en place.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>62 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>41 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>41 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>41 × 32 cm</td>\n</tr>\n<tr>\n<td>Âge conseillé</td>\n<td>Dès 3 ans</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : un coin de 70 × 50 cm suffit, idéal au pied d'une bibliothèque basse.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Garnissage</td>\n<td>Mousse haute densité</td>\n</tr>\n<tr>\n<td>Housse</td>\n<td>Polaire teddy grise, déhoussable, lavable en machine</td>\n</tr>\n<tr>\n<td>Poignée</td>\n<td>Oui, sur le dossier</td>\n</tr>\n<tr>\n<td>Base</td>\n<td>Antidérapante</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Aucun</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Retirez la housse et lavez-la en machine. Laissez-la sécher à plat avant de la remettre.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive compressé : sortez-le de son emballage et laissez-le reprendre sa forme pendant 48 heures.</p>\n<h2>FAQ</h2>\n<p><strong>1. À partir de quel âge ?</strong><br>\nLe fauteuil est conseillé dès 3 ans.</p>\n<p><strong>2. La housse se lave-t-elle ?</strong><br>\nOui, elle se retire et se lave en machine.</p>\n<p><strong>3. Faut-il le monter ?</strong><br>\nNon. Il arrive compressé et reprend sa forme en 48 heures après ouverture.</p>\n<p><strong>4. Mon enfant peut-il le déplacer seul ?</strong><br>\nOui, il est léger et possède une poignée sur le dossier.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\n62 cm de large pour 41 cm de profondeur et 41 cm de haut.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil enfant en mousse teddy gris | Bercelou", description:"Fauteuil enfant tout en mousse, housse teddy grise déhoussable et lavable en machine, poignée de transport, sans montage. Livraison offerte."}, productType:"Fauteuil enfant", vendor:"Bercelou", tags:["rocking-chair-enfant"]}) { product { id handle } userErrors { field message } }
  x15_p: productUpdate(product:{id:"gid://shopify/Product/16616084898137", title:"Fauteuil enfant nuage en tissu blanc, pieds effet bois", handle:"fauteuil-enfant-nuage-blanc", descriptionHtml:"<p><strong>Un petit nuage tout doux, à sa hauteur, pour regarder un livre comme les grands.</strong></p>\n<ul>\n<li>Forme de nuage arrondie, accoudoirs enveloppants</li>\n<li>Assise à 23 cm du sol, à la taille des tout-petits</li>\n<li>De 18 mois à 3 ans, charge jusqu'à 40 kg</li>\n<li>Tissu doux, pieds inclinés effet bois clair</li>\n</ul>\n<h3>Un fauteuil à sa taille</h3>\n<p>L'assise de 35 × 34 cm est posée à 23 cm du sol : votre enfant s'y assoit et en descend seul. Le fauteuil est conseillé de 18 mois à 3 ans.</p>\n<h3>Une forme douce</h3>\n<p>Les accoudoirs en nuage arrondis et le dossier haut entourent l'enfant, sans angle marqué. L'assise rembourrée de mousse est recouverte d'un tissu doux au toucher.</p>\n<h3>Pour lire et se poser</h3>\n<p>Dans la chambre ou la salle de jeux, c'est son coin à lui pour feuilleter un album, regarder un dessin animé ou câliner sa peluche.</p>\n<h3>Il s'accorde à la chambre</h3>\n<p>Tissu blanc et pieds inclinés effet bois clair : un style scandinave qui se marie à la chambre d'enfant, près de votre fauteuil d'allaitement.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>46 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>51 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>55 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>23 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>35 × 34 cm</td>\n</tr>\n<tr>\n<td>Dossier (largeur × hauteur)</td>\n<td>35 × 32 cm</td>\n</tr>\n<tr>\n<td>Accoudoirs (longueur × hauteur)</td>\n<td>50,5 × 23 cm</td>\n</tr>\n<tr>\n<td>Âge conseillé</td>\n<td>De 18 mois à 3 ans</td>\n</tr>\n<tr>\n<td>Charge maximale conseillée</td>\n<td>40 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>52 × 35 × 31 cm, 7,2 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : un espace de 50 × 60 cm suffit, dans un coin lecture ou au pied du lit.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Tissu 100 % polyester</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Panneau multicouche</td>\n</tr>\n<tr>\n<td>Pieds</td>\n<td>Polypropylène effet bois, inclinés</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Montage simple</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Blanc</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le tissu à l'aspirateur, embout tissu. Une tache se traite localement avec un chiffon légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le fauteuil arrive avec un montage simple.</p>\n<h2>FAQ</h2>\n<p><strong>1. À partir de quel âge ?</strong><br>\nIl est conseillé de 18 mois à 3 ans.</p>\n<p><strong>2. Quelle charge supporte-t-il ?</strong><br>\n40 kg au maximum, selon la charge conseillée.</p>\n<p><strong>3. Quelle est la hauteur d'assise ?</strong><br>\n23 cm du sol, pour que l'enfant s'y installe seul.</p>\n<p><strong>4. Les pieds sont-ils en bois ?</strong><br>\nIls sont en polypropylène à effet bois clair, inclinés vers l'extérieur.</p>\n<p><strong>5. Le montage est-il compliqué ?</strong><br>\nNon, le montage est simple.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil enfant nuage blanc, style scandinave | Bercelou", description:"Fauteuil enfant en forme de nuage, tissu blanc doux et pieds effet bois, de 18 mois à 3 ans, charge 40 kg, assise à 23 cm. Livraison offerte."}, productType:"Fauteuil enfant", vendor:"Bercelou", tags:["rocking-chair-enfant"]}) { product { id handle } userErrors { field message } }
  x16_p: productUpdate(product:{id:"gid://shopify/Product/16616093024601", title:"Fauteuil enfant en teddy écru, oreilles d'ours", handle:"fauteuil-enfant-teddy-oreilles-ours", descriptionHtml:"<p><strong>Un petit fauteuil tout doux, avec deux oreilles d'ours, pour faire de la chambre un nid.</strong></p>\n<ul>\n<li>Teddy écru doux et respirant</li>\n<li>Dossier arrondi à oreilles d'ours</li>\n<li>Assise à 27 cm du sol, charge jusqu'à 45 kg</li>\n<li>Pieds en hévéa à visser, montage en 5 minutes</li>\n</ul>\n<h3>Un fauteuil à sa taille</h3>\n<p>L'assise de 47 × 33 cm est posée à 27 cm du sol : l'enfant s'y installe et en descend seul pour lire, jouer ou se reposer.</p>\n<h3>Tout doux</h3>\n<p>Une mousse qui garde sa forme, recouverte d'un teddy doux et respirant : le fauteuil reste confortable toute la journée.</p>\n<h3>Deux oreilles d'ours</h3>\n<p>Le dossier arrondi se termine par deux oreilles d'ours discrètes, sans imprimé : un clin d'œil tendre qui décore la chambre.</p>\n<h3>Il le déplace tout seul</h3>\n<p>Léger, le fauteuil se déplace facilement d'une pièce à l'autre. Ses formes arrondies, sans angle vif, s'intègrent à la chambre comme à la salle de jeux.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur</td>\n<td>47 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>43 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>53 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise (sol)</td>\n<td>27 cm</td>\n</tr>\n<tr>\n<td>Assise (largeur × profondeur)</td>\n<td>47 × 33 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>45 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>47 × 43 × 53 cm, 4,4 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : un coin de 50 × 50 cm suffit, près d'une étagère à livres ou au pied du lit.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revêtement</td>\n<td>Polaire teddy écrue</td>\n</tr>\n<tr>\n<td>Garnissage</td>\n<td>Mousse</td>\n</tr>\n<tr>\n<td>Pieds</td>\n<td>Bois d'hévéa, à visser</td>\n</tr>\n<tr>\n<td>Accoudoirs</td>\n<td>Non</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>45 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Environ 5 minutes</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Écru</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez le teddy à l'aspirateur, embout tissu. Une tache se traite localement avec un chiffon légèrement humide.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Vissez les quatre pieds en bois à réception, en 5 minutes environ.</p>\n<h2>FAQ</h2>\n<p><strong>1. Faut-il le monter ?</strong><br>\nSeuls les pieds en bois d'hévéa sont à visser, en 5 minutes environ.</p>\n<p><strong>2. Quelle charge supporte-t-il ?</strong><br>\nJusqu'à 45 kg.</p>\n<p><strong>3. Quelle est la hauteur d'assise ?</strong><br>\n27 cm du sol, pour une assise de 47 × 33 cm.</p>\n<p><strong>4. A-t-il des accoudoirs ?</strong><br>\nNon, c'est un petit fauteuil sans accoudoirs, avec un dossier arrondi.</p>\n<p><strong>5. Quelle place prévoir ?</strong><br>\n47 cm de large pour 43 cm de profondeur et 53 cm de haut.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Fauteuil enfant teddy à oreilles d'ours | Bercelou", description:"Fauteuil enfant en teddy écru à oreilles d'ours, pieds en hévéa, assise à 27 cm du sol, charge 45 kg, montage en 5 minutes. Livraison offerte."}, productType:"Fauteuil enfant", vendor:"Bercelou", tags:["rocking-chair-enfant"]}) { product { id handle } userErrors { field message } }

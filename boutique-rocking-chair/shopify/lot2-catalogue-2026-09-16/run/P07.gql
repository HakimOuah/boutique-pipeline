  x64_p: productUpdate(product:{id:"gid://shopify/Product/16616092500313", title:"Table d'appoint en bambou, hauteur réglable et pivotante", handle:"table-d-appoint-bambou-hauteur-reglable", descriptionHtml:"<p><strong>De 42 à 82 cm, le plateau en bambou se règle à la hauteur de votre fauteuil et tourne sur lui-même.</strong></p>\n<ul>\n<li>Hauteur réglable de 42 à 82 cm</li>\n<li>Plateau en bambou pivotant à 360°</li>\n<li>Rainures pour tablette, stylo et verre</li>\n<li>Base fine qui se glisse sous le canapé ou le lit</li>\n</ul>\n<p>Cette table d'appoint en C, en bambou et fer noir, s'adapte à votre assise : réglez sa hauteur, tournez le plateau, et gardez livre, tasse ou tablette à portée de main.</p>\n<h3>À la bonne hauteur pour vos bras</h3>\n<p>Réglez le plateau entre 42 et 82 cm : il se place à hauteur d'accoudoir ou au-dessus de vos genoux, pour lire ou poser un biberon sans vous pencher.</p>\n<h3>Un plateau qui tourne</h3>\n<p>Le plateau pivote à 360° : orientez-le vers vous, vers le canapé ou vers le lit, sans déplacer la table.</p>\n<h3>Tout a sa place</h3>\n<p>Des rainures accueillent une tablette ou un téléphone, un stylo et un verre à pied ; de légers rebords retiennent ce que vous posez.</p>\n<h3>Bambou clair et fer noir</h3>\n<p>Le bambou poncé, poli et verni s'associe au fer noir : une touche naturelle qui s'accorde au rotin et au bois clair.</p>\n<h3>Stable et discrète</h3>\n<p>La base fine et large se glisse sous le canapé ou le lit ; des patins antidérapants la maintiennent en place.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Plateau</td>\n<td>40 × 22 cm</td>\n</tr>\n<tr>\n<td>Hauteur réglable</td>\n<td>42 à 82 cm</td>\n</tr>\n<tr>\n<td>Base</td>\n<td>36 × 22 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>40 kg</td>\n</tr>\n<tr>\n<td>Poids net</td>\n<td>1,7 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>42 × 30 × 4,5 cm, 1,9 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : la base de 36 × 22 cm se glisse sous un canapé ou un lit ; à côté d'un rocking chair, laissez la bascule libre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>Bambou et fer</td>\n</tr>\n<tr>\n<td>Finition</td>\n<td>Poncée, polie et peinte</td>\n</tr>\n<tr>\n<td>Plateau</td>\n<td>Pivotant à 360°, rainures et rebords</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>Réglable de 42 à 82 cm</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Antidérapants</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Bambou naturel et noir</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Simple, accessoires fournis</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Essuyez la poussière avec un chiffon humide. Le fer traité limite la rouille et la corrosion.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. La table arrive en kit plat avec ses accessoires de montage et un schéma.</p>\n<h2>FAQ</h2>\n<p><strong>1. Entre quelles hauteurs se règle-t-elle ?</strong><br>\nDe 42 à 82 cm.</p>\n<p><strong>2. Le plateau tourne-t-il ?</strong><br>\nOui, il pivote à 360°.</p>\n<p><strong>3. Quelle charge supporte-t-elle ?</strong><br>\nJusqu'à 40 kg au total.</p>\n<p><strong>4. Quelle est la taille du plateau ?</strong><br>\n40 × 22 cm, avec des rainures pour tablette, stylo et verre.</p>\n<p><strong>5. Est-elle facile à monter ?</strong><br>\nOui, la structure est simple et tous les accessoires sont fournis.</p>\n<p><strong>6. Glisse-t-elle sur le sol ?</strong><br>\nNon, des patins antidérapants la maintiennent en place.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Table d'appoint bambou réglable en hauteur | Bercelou", description:"Table d'appoint en C en bambou et fer noir, hauteur réglable de 42 à 82 cm, plateau pivotant à 360°. Charge 40 kg. Livraison offerte."}, productType:"Table d'appoint", vendor:"Bercelou", tags:["table-d-appoint"]}) { product { id handle } userErrors { field message } }
  x65_p: productUpdate(product:{id:"gid://shopify/Product/16616092369241", title:"Table d'appoint en C à roulettes, plateau rond effet bois", handle:"table-d-appoint-en-c-a-roulettes", descriptionHtml:"<p><strong>Elle se glisse sous l'accoudoir et approche votre plateau exactement où il faut.</strong></p>\n<ul>\n<li>Forme en C qui se glisse sous le fauteuil ou le canapé</li>\n<li>Plateau rond à rebord de 3 cm, rien ne glisse</li>\n<li>4 roulettes, dont 2 avec frein</li>\n<li>Base basse pour ranger livres et magazines</li>\n</ul>\n<p>Cette table d'appoint en C approche son plateau rond au-dessus de votre assise. Sur roulettes, elle se déplace d'un geste et se bloque en place.</p>\n<h3>Le plateau au-dessus de vos genoux</h3>\n<p>Grâce à sa forme en C, la base passe sous le fauteuil, le canapé ou le lit : votre tasse, votre téléphone ou votre livre restent juste à côté.</p>\n<h3>Un rebord qui retient</h3>\n<p>Le plateau rond est bordé d'un rebord de 3 cm : ce que vous posez reste en place, même quand vous la déplacez.</p>\n<h3>Mobile, puis stable</h3>\n<p>Quatre roulettes permettent de la rouler de la chambre au salon ; deux freins la bloquent une fois installée.</p>\n<h3>Deux niveaux de rangement</h3>\n<p>La base rectangulaire accueille les livres, un plaid plié ou une boîte à couches.</p>\n<h3>Un effet bois chaleureux</h3>\n<p>Le plateau et la base effet bois naturel, associés à l'arche noire, s'intègrent à un salon moderne.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur × profondeur</td>\n<td>40 × 40 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>60 cm</td>\n</tr>\n<tr>\n<td>Diamètre du plateau</td>\n<td>40 cm</td>\n</tr>\n<tr>\n<td>Hauteur du rebord</td>\n<td>3 cm</td>\n</tr>\n<tr>\n<td>Base (largeur × profondeur)</td>\n<td>40 × 30 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>5 kg</td>\n</tr>\n<tr>\n<td>Poids net</td>\n<td>4,08 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>54 × 44 × 14 cm, 4,3 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : à 60 cm de haut, le plateau arrive au niveau de l'accoudoir d'un fauteuil ou d'un canapé ; la base de 40 × 30 cm se glisse sous une assise dégagée.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>MDF stratifié effet bois, arche en fer noir</td>\n</tr>\n<tr>\n<td>Niveaux</td>\n<td>2</td>\n</tr>\n<tr>\n<td>Roulettes</td>\n<td>4, dont 2 avec frein</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>5 kg</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Bois naturel et noir</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler, trous pré-percés, schéma et accessoires fournis</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Le plateau résiste à l'eau : essuyez-le avec un chiffon humide, puis séchez.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. La table arrive en kit avec les roulettes, le schéma de montage et la visserie ; les trous sont pré-percés.</p>\n<h2>FAQ</h2>\n<p><strong>1. La table passe-t-elle sous mon fauteuil ?</strong><br>\nSa base mesure 40 × 30 cm : vérifiez l'espace libre sous l'assise ou le pied de votre fauteuil.</p>\n<p><strong>2. Quelle charge supporte-t-elle ?</strong><br>\nJusqu'à 5 kg : une tasse, un livre, une tablette ou une lampe légère.</p>\n<p><strong>3. Peut-on la bloquer ?</strong><br>\nOui, deux des quatre roulettes ont un frein.</p>\n<p><strong>4. Quelle est sa hauteur ?</strong><br>\n60 cm, avec un plateau rond de 40 cm.</p>\n<p><strong>5. Le montage est-il simple ?</strong><br>\nOui : trous pré-percés, schéma et visserie fournis.</p>\n<p><strong>6. Convient-elle à un rocking chair ?</strong><br>\nPlacez-la à côté du fauteuil plutôt que dessous, pour laisser la bascule libre.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Table d'appoint en C à roulettes, effet bois | Bercelou", description:"Table d'appoint en C à roulettes, plateau rond à rebord et base de rangement. 40 × 40 × 60 cm, 2 roues à frein. Livraison offerte."}, productType:"Table d'appoint", vendor:"Bercelou", tags:["table-d-appoint"]}) { product { id handle } userErrors { field message } }
  x66_p: productUpdate(product:{id:"gid://shopify/Product/16616092467545", title:"Table d'appoint en C, bois rustique et métal noir", handle:"table-d-appoint-en-c-bois-rustique-metal", descriptionHtml:"<p><strong>Un bout de canapé fin qui se glisse sous l'assise et approche le café, le livre ou la tablette.</strong></p>\n<ul>\n<li>Base en C qui se glisse sous le canapé ou le fauteuil</li>\n<li>Plateau effet bois rustique, structure métal noir mat</li>\n<li>Compacte : 40 × 25 × 50 cm, 2,3 kg</li>\n<li>Supporte jusqu'à 15 kg</li>\n</ul>\n<p>Cette table d'appoint en C associe un plateau effet bois rustique à une structure en métal noir mat. Sa base ouverte passe sous l'assise pour approcher le plateau de vous.</p>\n<h3>Le plateau là où vous en avez besoin</h3>\n<p>La base en C passe sous le canapé, le fauteuil ou le lit : le plateau vient se placer juste à côté de vous.</p>\n<h3>Pensée pour les petits espaces</h3>\n<p>Avec 25 cm de profondeur, elle se faufile dans les coins étroits où une table classique ne rentre pas.</p>\n<h3>Solide et légère</h3>\n<p>La structure en métal supporte jusqu'à 15 kg, pour un poids de 2,3 kg : elle se déplace d'une main.</p>\n<h3>Protège vos sols</h3>\n<p>Des patins sous la base améliorent la stabilité et évitent les rayures sur parquet, stratifié ou carrelage.</p>\n<h3>Un style industriel doux</h3>\n<p>Le bois rustique réchauffe le noir mat : la table s'accorde à un salon contemporain.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Longueur</td>\n<td>40 cm</td>\n</tr>\n<tr>\n<td>Profondeur</td>\n<td>25 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>15 kg</td>\n</tr>\n<tr>\n<td>Poids</td>\n<td>2,3 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : à 50 cm de haut, elle convient aux canapés et fauteuils à assise basse ; vérifiez que la base peut passer sous votre assise.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Plateau</td>\n<td>Effet bois rustique, facile à nettoyer</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>Métal noir mat renforcé</td>\n</tr>\n<tr>\n<td>Forme</td>\n<td>En C</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Oui, protection des sols</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>15 kg</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Bois rustique et noir</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Rapide, à assembler</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Essuyez le plateau avec un chiffon humide, puis séchez.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. La table arrive en kit, à assembler en quelques minutes.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quelle charge supporte-t-elle ?</strong><br>\nJusqu'à 15 kg : ordinateur portable, tablette, livres ou plateau de goûter.</p>\n<p><strong>2. Quelles sont ses dimensions ?</strong><br>\n40 cm de long, 25 cm de profondeur et 50 cm de haut.</p>\n<p><strong>3. Se glisse-t-elle sous tous les canapés ?</strong><br>\nSa base doit pouvoir passer sous l'assise : vérifiez l'espace libre sous votre canapé ou fauteuil.</p>\n<p><strong>4. Abîme-t-elle le sol ?</strong><br>\nNon, des patins protègent parquet, stratifié et carrelage.</p>\n<p><strong>5. Le montage est-il long ?</strong><br>\nNon, la table s'assemble en quelques minutes.</p>\n<p><strong>6. Convient-elle à un rocking chair ?</strong><br>\nPlacez-la à côté du fauteuil plutôt que sous l'assise, pour laisser la bascule libre.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Table d'appoint en C, bois rustique et métal | Bercelou", description:"Table d'appoint en C 40 × 25 × 50 cm, plateau effet bois rustique sur structure métal noir, charge 15 kg. Se glisse sous le canapé."}, productType:"Table d'appoint", vendor:"Bercelou", tags:["table-d-appoint"]}) { product { id handle } userErrors { field message } }
  x67_p: productUpdate(product:{id:"gid://shopify/Product/16616092434777", title:"Table d'appoint ronde 3 plateaux, chêne foncé et métal", handle:"table-d-appoint-ronde-3-plateaux-chene-fonce", descriptionHtml:"<p><strong>Trois niveaux pour la lampe, les livres et la veilleuse, à côté du fauteuil.</strong></p>\n<ul>\n<li>Trois plateaux ronds pour ranger et exposer</li>\n<li>Effet chêne foncé et pieds en métal tourné</li>\n<li>46 × 46 × 60 cm, format table de chevet</li>\n<li>Montage simple, notice fournie</li>\n</ul>\n<p>Cette table d'appoint ronde superpose trois plateaux effet chêne foncé sur des pieds en métal noir tourné. Elle accueille la lampe de lecture en haut et les livres en dessous.</p>\n<h3>Un coin lecture organisé</h3>\n<p>Posez la lampe et votre tasse sur le plateau du haut, rangez livres, carnets ou veilleuse sur les deux niveaux inférieurs.</p>\n<h3>Un charme vintage</h3>\n<p>L'effet bois rustique et les pieds en métal tourné apportent une touche vintage à un salon ou une chambre.</p>\n<h3>Le bon format près du fauteuil</h3>\n<p>Avec 60 cm de haut, le plateau supérieur arrive à hauteur d'accoudoir : tout reste à portée de main.</p>\n<h3>Robuste au quotidien</h3>\n<p>Structure métal et plateaux en MDF : une table stable, à resserrer de temps en temps pour garder sa tenue.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Largeur × profondeur</td>\n<td>46 × 46 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>60 cm</td>\n</tr>\n<tr>\n<td>Plateaux</td>\n<td>3</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>6,9 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : comptez 46 cm de diamètre au sol ; placez-la à côté du fauteuil, en dehors de la zone de bascule.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matière</td>\n<td>MDF effet chêne foncé, métal noir</td>\n</tr>\n<tr>\n<td>Plateaux</td>\n<td>3, ronds</td>\n</tr>\n<tr>\n<td>Pieds</td>\n<td>Métal tourné, style colonne</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Chêne foncé et noir</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler par un adulte, notice fournie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Dépoussiérez les plateaux avec un chiffon doux légèrement humide. Vérifiez et resserrez les vis de temps en temps pour garder une table bien stable.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. La table arrive en kit avec sa notice ; le montage se fait par un adulte.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quelles sont les dimensions ?</strong><br>\n46 × 46 cm pour 60 cm de haut.</p>\n<p><strong>2. Combien de plateaux ?</strong><br>\nTrois plateaux ronds superposés.</p>\n<p><strong>3. Peut-elle servir de table de chevet ?</strong><br>\nOui, ses 60 cm de haut et ses trois niveaux conviennent à une chambre.</p>\n<p><strong>4. Le montage est-il fourni avec une notice ?</strong><br>\nOui, la notice est fournie. Le montage doit être fait par un adulte.</p>\n<p><strong>5. Comment garder la table stable ?</strong><br>\nResserrez les vis de temps en temps.</p>\n<p><strong>6. En quelle matière est-elle ?</strong><br>\nPlateaux en MDF effet chêne foncé, structure en métal noir.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Table d'appoint ronde 3 plateaux, chêne foncé | Bercelou", description:"Table d'appoint ronde à 3 plateaux effet chêne foncé et pieds en métal tourné, 46 × 46 × 60 cm. Rangement livres et lampe."}, productType:"Table d'appoint", vendor:"Bercelou", tags:["table-d-appoint"]}) { product { id handle } userErrors { field message } }
  x68_p: productUpdate(product:{id:"gid://shopify/Product/16616092336473", title:"Table d'appoint ronde blanche, pieds bois, Ø 50 cm", handle:"table-d-appoint-ronde-blanche-pieds-bois", descriptionHtml:"<p><strong>La petite table scandinave qui garde votre tasse et votre livre à portée du fauteuil.</strong></p>\n<ul>\n<li>Plateau rond de 50 cm, blanc, bords lisses</li>\n<li>Trois pieds en bois clair, style scandinave</li>\n<li>Hauteur basse de 40 cm, idéale au pied du fauteuil</li>\n<li>Montage en 5 minutes, sans outil</li>\n</ul>\n<p>Cette table d'appoint ronde au plateau blanc et aux pieds en bois clair se glisse près du rocking chair ou du canapé. Sa ligne scandinave allège la pièce.</p>\n<h3>Tout à portée de main</h3>\n<p>Tasse de tisane, biberon, livre du soir : le plateau de 50 cm garde l'essentiel près de vous pendant que vous bercez.</p>\n<h3>Un style scandinave lumineux</h3>\n<p>Le blanc du plateau et le bois clair des pieds s'accordent aux rocking chairs en bouclette, en rotin ou en bois.</p>\n<h3>Un plateau facile à nettoyer</h3>\n<p>La peinture à l'eau offre une surface lisse, sans arête vive, qui se nettoie d'un coup de chiffon.</p>\n<h3>Stable sur trois pieds</h3>\n<p>Le trépied assure un bon appui au sol, pour une table qui reste bien en place.</p>\n<h3>Montée en 5 minutes</h3>\n<p>Vissez les trois pieds sous le plateau, sans outil : la table est prête.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Diamètre du plateau</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Hauteur</td>\n<td>40 cm</td>\n</tr>\n<tr>\n<td>Épaisseur du plateau</td>\n<td>2 cm</td>\n</tr>\n<tr>\n<td>Poids du colis</td>\n<td>2,1 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : à 40 cm de haut, elle se place à côté d'un fauteuil bas ou devant un canapé ; comptez 50 cm de diamètre au sol.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Plateau</td>\n<td>MDF, peinture à l'eau blanche</td>\n</tr>\n<tr>\n<td>Pieds</td>\n<td>Bois, 3 pieds</td>\n</tr>\n<tr>\n<td>Forme</td>\n<td>Ronde</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Blanc et bois clair</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Pieds à visser, environ 5 minutes, sans outil</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Nettoyez le plateau avec un chiffon doux légèrement humide, puis séchez. Évitez les produits abrasifs.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. La table arrive en kit : les trois pieds se vissent à la main sous le plateau, en 5 minutes environ.</p>\n<h2>FAQ</h2>\n<p><strong>1. Quelle est la hauteur de la table ?</strong><br>\n40 cm, pour un plateau de 50 cm de diamètre.</p>\n<p><strong>2. Le montage est-il compliqué ?</strong><br>\nNon : vissez les trois pieds sous le plateau, sans outil, en 5 minutes environ.</p>\n<p><strong>3. En quelle matière est-elle ?</strong><br>\nPlateau en MDF à peinture à l'eau blanche, pieds en bois.</p>\n<p><strong>4. Peut-on la placer à côté d'un rocking chair ?</strong><br>\nOui, sa hauteur basse convient à un fauteuil bas ; laissez la bascule libre de chaque côté.</p>\n<p><strong>5. Le plateau se nettoie-t-il facilement ?</strong><br>\nOui, sa surface lisse se nettoie avec un chiffon humide.</p>\n<p><strong>6. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Table d'appoint ronde blanche, pieds bois | Bercelou", description:"Table d'appoint ronde Ø 50 × 40 cm, plateau blanc laqué et 3 pieds en bois clair. Montage en 5 minutes sans outil. Livraison offerte."}, productType:"Table d'appoint", vendor:"Bercelou", tags:["table-d-appoint"]}) { product { id handle } userErrors { field message } }
  x69_p: productUpdate(product:{id:"gid://shopify/Product/16616092565849", title:"Tables gigognes blanches, pieds bambou (lot de 2)", handle:"tables-gigognes-blanches-pieds-bambou", descriptionHtml:"<p><strong>Deux tables qui s'emboîtent : l'une près du fauteuil, l'autre devant le canapé, ou ensemble.</strong></p>\n<ul>\n<li>Lot de 2 tables : 55 cm et 40 cm</li>\n<li>Plateaux blancs laqués aux angles arrondis</li>\n<li>Pieds en bambou naturel verni</li>\n<li>S'emboîtent pour gagner de la place</li>\n</ul>\n<p>Ces deux tables gigognes aux plateaux blancs arrondis et aux pieds en bambou apportent une touche scandinave au salon. Séparez-les ou emboîtez-les selon vos besoins.</p>\n<h3>Deux tables, mille usages</h3>\n<p>La grande sert de table basse ou de bout de canapé, la petite se place à côté du rocking chair pour la tasse du soir.</p>\n<h3>Elles s'emboîtent</h3>\n<p>La petite table se glisse sous la grande pour libérer de la place, ou les deux se superposent pour un effet décalé.</p>\n<h3>Blanc et bambou</h3>\n<p>Le plateau laqué blanc résiste aux rayures, les pieds en bambou naturel sont vernis : un duo lumineux qui s'accorde au rotin et au lin.</p>\n<h3>Des sols protégés</h3>\n<p>Des patins en caoutchouc souple sous chaque pied évitent les rayures sur le parquet.</p>\n<h3>Montage simple</h3>\n<p>Les tables arrivent à plat, avec des pièces pré-percées et numérotées et une notice claire.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Grande table</td>\n<td>55 × 55 × 45 cm</td>\n</tr>\n<tr>\n<td>Petite table</td>\n<td>40 × 40 × 40 cm</td>\n</tr>\n<tr>\n<td>Épaisseur des plateaux</td>\n<td>2 cm</td>\n</tr>\n<tr>\n<td>Charge maximale (grande)</td>\n<td>25 kg</td>\n</tr>\n<tr>\n<td>Charge maximale (petite)</td>\n<td>15 kg</td>\n</tr>\n<tr>\n<td>Poids total</td>\n<td>5 kg</td>\n</tr>\n<tr>\n<td>Colis</td>\n<td>66 × 61,5 × 10 cm, 6 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : la petite table (40 cm de haut) se place à côté d'un fauteuil bas ; la grande (45 cm) devant un canapé. Emboîtées, elles occupent l'emprise de la grande.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Plateaux</td>\n<td>MDF laqué blanc, résistant aux rayures</td>\n</tr>\n<tr>\n<td>Pieds</td>\n<td>Bambou naturel verni</td>\n</tr>\n<tr>\n<td>Forme</td>\n<td>Triangulaire aux angles arrondis</td>\n</tr>\n<tr>\n<td>Patins</td>\n<td>Caoutchouc souple</td>\n</tr>\n<tr>\n<td>Contenu</td>\n<td>2 tables gigognes</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Blanc et bambou</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>À assembler, pièces pré-percées et numérotées, notice</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Nettoyez les plateaux avec un chiffon doux légèrement humide. Dépoussiérez les pieds en bambou avec un chiffon sec.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Les deux tables arrivent à plat dans un seul colis, avec visserie, pièces pré-percées et numérotées et notice.</p>\n<h2>FAQ</h2>\n<p><strong>1. Combien de tables sont livrées ?</strong><br>\nDeux : une grande de 55 × 55 × 45 cm et une petite de 40 × 40 × 40 cm.</p>\n<p><strong>2. Quelle charge supportent-elles ?</strong><br>\n25 kg pour la grande, 15 kg pour la petite.</p>\n<p><strong>3. Les tables s'emboîtent-elles ?</strong><br>\nOui, la petite se glisse sous la grande pour gagner de la place.</p>\n<p><strong>4. En quelle matière sont-elles ?</strong><br>\nPlateaux en MDF laqué blanc, pieds en bambou naturel verni.</p>\n<p><strong>5. Le montage est-il simple ?</strong><br>\nOui : pièces pré-percées et numérotées, visserie et notice fournies.</p>\n<p><strong>6. Abîment-elles le parquet ?</strong><br>\nNon, des patins en caoutchouc souple protègent le sol.</p>\n<p><strong>7. Combien de temps pour la livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>8. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Tables gigognes blanches, pieds bambou | Bercelou", description:"Lot de 2 tables gigognes blanches aux pieds en bambou : 55 × 55 × 45 cm et 40 × 40 × 40 cm. Plateau laqué, patins. Livraison offerte."}, productType:"Table d'appoint", vendor:"Bercelou", tags:["table-d-appoint"]}) { product { id handle } userErrors { field message } }
  x70_p: productUpdate(product:{id:"gid://shopify/Product/16616075592025", title:"Transat à bascule pliable, matelas gris aspect daim", handle:"transat-a-bascule-pliable-gris", descriptionHtml:"<p><strong>Un transat qui berce doucement au soleil, puis se replie contre un mur en fin de saison.</strong></p>\n<ul>\n<li>Bascule douce, 2 butées de sécurité anti-retournement</li>\n<li>Matelas gris aspect daim, amovible, appui-tête inclus</li>\n<li>Toile textilène 560 g/m², résistante aux UV</li>\n<li>Pliable pour le rangement</li>\n</ul>\n<p>Un transat à bascule au dessin contemporain, pour le jardin, la terrasse, le bord de piscine ou la véranda.</p>\n<h3>Une bascule douce et sûre</h3>\n<p>Le transat se balance doucement. Deux butées de sécurité empêchent le retournement.</p>\n<h3>Deux façons de s'installer</h3>\n<p>Avec son matelas matelassé aspect daim pour un confort moelleux, ou directement sur la toile textilène avec l'appui-tête amovible, les jours de chaleur.</p>\n<h3>Sur la terrasse</h3>\n<p>La toile textilène haute densité de 560 g/m² résiste aux UV et à l'humidité : elle convient au bord de la piscine.</p>\n<h3>Rangé en un instant</h3>\n<p>Le transat se plie et se range debout contre un mur ou derrière une porte.</p>\n<h2>Dimensions</h2>\n<table>\n<thead>\n<tr>\n<th>Mesure</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dimensions (L × l × H)</td>\n<td>145 × 74 × 86 cm</td>\n</tr>\n<tr>\n<td>Dimensions plié (L × l × H)</td>\n<td>145 × 40 × 97 cm</td>\n</tr>\n<tr>\n<td>Largeur d'assise</td>\n<td>39 à 48 cm</td>\n</tr>\n<tr>\n<td>Hauteur d'assise</td>\n<td>36 cm</td>\n</tr>\n<tr>\n<td>Longueur du dossier</td>\n<td>46 cm</td>\n</tr>\n<tr>\n<td>Hauteur des accoudoirs (sol)</td>\n<td>50 cm</td>\n</tr>\n<tr>\n<td>Matelas (L × l × ép.)</td>\n<td>166 × 40 à 51 × 6 cm</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n</tbody>\n</table>\n<p>Conseil de place : prévoyez environ 1,60 m de longueur pour une bascule libre.</p>\n<h2>Caractéristiques</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>Valeur</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Structure</td>\n<td>Métal époxy, accoudoirs gainés</td>\n</tr>\n<tr>\n<td>Toile</td>\n<td>Textilène 560 g/m², résistant aux UV</td>\n</tr>\n<tr>\n<td>Matelas</td>\n<td>Aspect daim, garnissage mousse, amovible</td>\n</tr>\n<tr>\n<td>Appui-tête</td>\n<td>Amovible</td>\n</tr>\n<tr>\n<td>Sécurité</td>\n<td>2 butées anti-retournement</td>\n</tr>\n<tr>\n<td>Pliable</td>\n<td>Oui</td>\n</tr>\n<tr>\n<td>Coloris</td>\n<td>Gris anthracite</td>\n</tr>\n<tr>\n<td>Charge maximale</td>\n<td>120 kg</td>\n</tr>\n<tr>\n<td>Montage</td>\n<td>Simple, notice illustrée fournie</td>\n</tr>\n</tbody>\n</table>\n<h2>Entretien</h2>\n<p>Rincez la toile textilène à l'eau claire et laissez sécher. Rentrez le matelas par temps de pluie et rangez le transat plié à l'abri l'hiver.</p>\n<h2>Livraison</h2>\n<p>Livraison offerte en France métropolitaine, en 3 à 10 jours ouvrés. Le transat s'installe facilement grâce à la notice illustrée.</p>\n<h2>FAQ</h2>\n<p><strong>1. Le transat est-il stable ?</strong><br>\nOui, deux butées de sécurité empêchent le retournement quand vous vous balancez.</p>\n<p><strong>2. Peut-on l'utiliser sans le matelas ?</strong><br>\nOui, la toile textilène et l'appui-tête amovible suffisent par temps chaud.</p>\n<p><strong>3. Se range-t-il facilement ?</strong><br>\nOui, il se plie à 40 cm de largeur et se range debout.</p>\n<p><strong>4. Quelle est la hauteur d'assise ?</strong><br>\nL'assise est à 36 cm du sol, les accoudoirs à 50 cm.</p>\n<p><strong>5. Quel poids supporte-t-il ?</strong><br>\nJusqu'à 120 kg.</p>\n<p><strong>6. Quels sont les délais de livraison ?</strong><br>\nLivraison offerte en France métropolitaine, en 3 à 10 jours ouvrés.</p>\n<p><strong>7. Quelle est la politique de retour ?</strong><br>\n14 jours après réception, frais de retour à votre charge pour ce colis volumineux. Colis abîmé ou pièce manquante : signalez-le sous 48 h avec photos, nous renvoyons ou remboursons à nos frais. Garantie légale de conformité 2 ans.</p>", seo:{title:"Transat à bascule pliable, matelas gris | Bercelou", description:"Transat à bascule pliable en métal et textilène, matelas gris aspect daim amovible, butées de sécurité, charge 120 kg. Livraison offerte."}, productType:"Fauteuil relax", vendor:"Bercelou", tags:["fauteuil-relax-jardin"]}) { product { id handle } userErrors { field message } }

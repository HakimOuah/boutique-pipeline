services:
  dropilot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

